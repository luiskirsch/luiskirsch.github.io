<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Entrar | O SextoLugar</title>
  <link rel="icon" href="./favicon.png" />

  <style>
    :root{
      --bg:#050507;
      --panel:rgba(255,255,255,.05);
      --line:rgba(255,255,255,.08);
      --gold:#e6c07b;
      --text:#f4f4f6;
      --muted:rgba(255,255,255,.66);
      --danger:#ff6b6b;
      --ok:#82d996;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:
        radial-gradient(900px 420px at 50% 10%, rgba(230,192,123,.08), transparent 58%),
        linear-gradient(180deg, #09090d 0%, #050507 100%);
      color:var(--text);
      font-family:"Segoe UI",system-ui;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:420px;
      padding:26px;
      border-radius:24px;
      background:var(--panel);
      border:1px solid var(--line);
      box-shadow:0 30px 90px rgba(0,0,0,.5);
    }

    h1{
      margin:0 0 6px;
      font-size:28px;
    }

    p{
      margin:0 0 20px;
      color:var(--muted);
      font-size:14px;
    }

    .field{
      display:grid;
      gap:6px;
      margin-bottom:14px;
    }

    .field label{
      font-size:11px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--gold);
    }

    .field input{
      min-height:50px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(0,0,0,.25);
      color:#fff;
      padding:12px;
      font-size:15px;
      outline:none;
    }

    .field input::placeholder{
      color:rgba(255,255,255,.34);
    }

    button{
      width:100%;
      height:52px;
      border-radius:14px;
      border:none;
      font-weight:700;
      background:linear-gradient(135deg,#e6c07b,#c99c4a);
      color:#000;
      cursor:pointer;
      margin-top:6px;
      font-size:15px;
    }

    button:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .status{
      margin-top:10px;
      font-size:13px;
      text-align:center;
      min-height:18px;
      color:rgba(255,255,255,.72);
    }

    .status.err{ color:var(--danger); }
    .status.ok{ color:var(--ok); }

    .links{
      margin-top:16px;
      text-align:center;
      font-size:13px;
      color:var(--muted);
      line-height:1.7;
    }

    .links a{
      color:var(--gold);
      text-decoration:none;
      font-weight:600;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Entrar</h1>
    <p>Acesse sua conta para continuar o ritual.</p>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="Seu e-mail" autocomplete="email">
    </div>

    <div class="field">
      <label for="password">Senha</label>
      <input id="password" type="password" placeholder="Sua senha" autocomplete="current-password">
    </div>

    <button id="loginBtn">Entrar</button>

    <div class="status" id="status"></div>

    <div class="links">
      Não tem conta? <a href="./cadastro.html">Criar conta</a><br>
      <a href="#" id="forgot">Esqueci minha senha</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC8sSvA7_1HPYRFGfgdgzstkP_yQHadY-c",
      authDomain: "osextolugar-game.firebaseapp.com",
      projectId: "osextolugar-game",
      storageBucket: "osextolugar-game.firebasestorage.app",
      messagingSenderId: "947922328721",
      appId: "1:947922328721:web:989522c99e16ab449f3330",
      measurementId: "G-D6HG779ZFR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const emailEl = document.getElementById("email");
    const passwordEl = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const statusEl = document.getElementById("status");
    const forgotBtn = document.getElementById("forgot");

    let isLoggingIn = false;

    function setStatus(text, type = "") {
      statusEl.textContent = text;
      statusEl.className = "status";
      if (type) statusEl.classList.add(type);
    }

    const savedEmail =
      localStorage.getItem("osl_checkout_email") ||
      localStorage.getItem("osl_license_email") ||
      "";

    if (savedEmail) {
      emailEl.value = savedEmail;
    }

    onAuthStateChanged(auth, (user) => {
      if (user && !isLoggingIn) {
        window.location.href = "./painel.html";
      }
    });

    loginBtn.addEventListener("click", async () => {
      const email = emailEl.value.trim().toLowerCase();
      const password = passwordEl.value;

      if (!email || !password) {
        setStatus("Preencha todos os campos.", "err");
        return;
      }

      try {
        isLoggingIn = true;
        loginBtn.disabled = true;
        setStatus("Entrando...");

        const cred = await signInWithEmailAndPassword(auth, email, password);

        const userRef = doc(db, "users", cred.user.uid);
        const userSnap = await getDoc(userRef);

        if (userSnap.exists()) {
          const data = userSnap.data();

          localStorage.setItem("osl_nome", data.displayName || "");
          localStorage.setItem("osl_username", data.username || "");
          localStorage.setItem("osl_auth_uid", cred.user.uid);
          localStorage.setItem("osl_license_code", data.licenseCode || "");
          localStorage.setItem("osl_license_email", data.email || email);
        }

        setStatus("Acesso liberado.", "ok");

        setTimeout(() => {
          window.location.href = "./painel.html";
        }, 500);

      } catch (err) {
        console.error(err);

        let msg = "Erro ao entrar.";

        if (err.code === "auth/user-not-found" || err.code === "auth/invalid-credential") {
          msg = "Conta não encontrada ou credenciais inválidas.";
        } else if (err.code === "auth/wrong-password") {
          msg = "Senha incorreta.";
        } else if (err.code === "auth/invalid-email") {
          msg = "E-mail inválido.";
        } else if (err.code === "auth/too-many-requests") {
          msg = "Muitas tentativas. Tente novamente mais tarde.";
        } else if (err.code === "auth/network-request-failed") {
          msg = "Erro de conexão. Tente novamente.";
        }

        setStatus(msg, "err");
        loginBtn.disabled = false;
        isLoggingIn = false;
      }
    });

    forgotBtn.addEventListener("click", async (e) => {
      e.preventDefault();

      const email = emailEl.value.trim().toLowerCase();

      if (!email) {
        setStatus("Digite seu e-mail para recuperar.", "err");
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        setStatus("E-mail de recuperação enviado.", "ok");
      } catch (err) {
        console.error(err);
        setStatus("Erro ao enviar recuperação.", "err");
      }
    });
  </script>

</body>
</html>
