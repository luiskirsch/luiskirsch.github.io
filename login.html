<!DOCTYPE html>
<html lang="pt-BR" data-i18n-ns="login">
<head>
<script src="js/domain-guard.js"></script>
<script src="./i18n/init.js" defer></script>
<link rel="preconnect" href="https://www.googleapis.com">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://firestore.googleapis.com">
<link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title data-i18n="login:title">Entrar | SEXTOLUGAR</title>
  <link rel="icon" href="./favicon.png" />

  <style>
    :root{
      --bg:#050507;
      --panel:rgba(255,255,255,.05);
      --line:rgba(255,255,255,.08);
      --gold:#e6c07b;
      --text:#f4f4f6;
      --muted:rgba(255,255,255,.66);
      --danger:#ff6b6b;
      --ok:#82d996;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:
        radial-gradient(900px 420px at 50% 10%, rgba(230,192,123,.08), transparent 58%),
        linear-gradient(180deg, #09090d 0%, #050507 100%);
      color:var(--text);
      font-family:"Segoe UI",system-ui;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:420px;
      padding:26px;
      border-radius:24px;
      background:var(--panel);
      border:1px solid var(--line);
      box-shadow:0 30px 90px rgba(0,0,0,.5);
    }

    h1{
      margin:0 0 6px;
      font-size:28px;
    }

    p{
      margin:0 0 20px;
      color:var(--muted);
      font-size:14px;
    }

    .field{
      display:grid;
      gap:6px;
      margin-bottom:14px;
    }

    .field label{
      font-size:11px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--gold);
    }

    .field input{
      min-height:50px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(0,0,0,.25);
      color:#fff;
      padding:12px;
      font-size:15px;
      outline:none;
    }

    .field input::placeholder{
      color:rgba(255,255,255,.34);
    }

    button{
      width:100%;
      height:52px;
      border-radius:14px;
      border:none;
      font-weight:700;
      background:linear-gradient(135deg,#e6c07b,#c99c4a);
      color:#000;
      cursor:pointer;
      margin-top:6px;
      font-size:15px;
    }

    button:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .status{
      margin-top:10px;
      font-size:13px;
      text-align:center;
      min-height:18px;
      color:rgba(255,255,255,.72);
    }

    .status.err{ color:var(--danger); }
    .status.ok{ color:var(--ok); }

    .links{
      margin-top:16px;
      text-align:center;
      font-size:13px;
      color:var(--muted);
      line-height:1.7;
    }

    .links a{
      color:var(--gold);
      text-decoration:none;
      font-weight:600;
    }
  </style>
<link rel="prefetch" href="/painel.html"><link rel="prefetch" href="/entrada.html">
</head>
<body>

  <div class="card">
    <h1 data-i18n="login:heading">Entrar</h1>
    <p>Digite seu e-mail e enviaremos um link de acesso direto — sem senha.</p>

    <div class="field">
      <label for="email" data-i18n="login:labels.email">Email</label>
      <input id="email" type="email" placeholder="Seu e-mail" data-i18n-placeholder="login:placeholders.email" autocomplete="email">
    </div>

    <button id="loginBtn">Enviar link de acesso</button>

    <div class="status" id="status"></div>

    <div class="links">
      <span data-i18n="login:links.noAccount">Não tem conta?</span> <a href="./cadastro.html" data-i18n="login:links.createAccount">Criar conta</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth,
      sendSignInLinkToEmail,
      isSignInWithEmailLink,
      signInWithEmailLink,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getFirestore, doc, getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC8sSvA7_1HPYRFGFgdgzstkP_yQHadY-c",
      authDomain: "osextolugar-game.firebaseapp.com",
      projectId: "osextolugar-game",
      storageBucket: "osextolugar-game.firebasestorage.app",
      messagingSenderId: "947922328721",
      appId: "1:947922328721:web:989522c99e16ab449f3330",
      measurementId: "G-D6HG779ZFR"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    const ACTION_URL = "https://preludiojogos.com/login.html";
    const EMAIL_KEY  = "osl_signin_email";

    const emailEl  = document.getElementById("email");
    const loginBtn = document.getElementById("loginBtn");
    const statusEl = document.getElementById("status");

    function setStatus(text, type = "") {
      statusEl.textContent = text;
      statusEl.className = "status" + (type ? " " + type : "");
    }

    // Pré-preenche e-mail salvo (checkout ou sessão anterior)
    const savedEmail =
      localStorage.getItem("osl_checkout_email") ||
      localStorage.getItem("osl_license_email") || "";
    if (savedEmail) emailEl.value = savedEmail;

    // ── Sessão já ativa → vai direto pro painel ────────────────────────────────
    onAuthStateChanged(auth, async (user) => {
      if (!user) return;
      try {
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists()) window.location.href = "./painel.html";
      } catch (_) {}
    });

    // ── Retorno do link de e-mail ──────────────────────────────────────────────
    if (isSignInWithEmailLink(auth, window.location.href)) {
      let email = localStorage.getItem(EMAIL_KEY);
      if (!email) email = window.prompt("Confirme seu e-mail para concluir o acesso:");
      if (email) {
        setStatus("Verificando link…");
        loginBtn.disabled = true;
        signInWithEmailLink(auth, email.trim().toLowerCase(), window.location.href)
          .then(async (cred) => {
            localStorage.removeItem(EMAIL_KEY);
            localStorage.setItem("osl_auth_uid", cred.user.uid);
            localStorage.setItem("osl_license_email", email);
            try {
              const snap = await getDoc(doc(db, "users", cred.user.uid));
              if (snap.exists()) {
                const d = snap.data();
                localStorage.setItem("osl_nome",         d.displayName || "");
                localStorage.setItem("osl_username",     d.username    || "");
                localStorage.setItem("osl_license_code", d.licenseCode || "");
              }
            } catch (_) {}
            setStatus("Acesso liberado.", "ok");
            setTimeout(() => { window.location.href = "./painel.html"; }, 500);
          })
          .catch(() => {
            setStatus("Link inválido ou expirado. Solicite um novo.", "err");
            loginBtn.disabled = false;
          });
      }
    }

    // ── Envio do magic link ────────────────────────────────────────────────────
    loginBtn.addEventListener("click", async () => {
      const email = emailEl.value.trim().toLowerCase();
      if (!email) { setStatus("Digite seu e-mail.", "err"); return; }

      loginBtn.disabled = true;
      setStatus("Enviando link…");

      try {
        await sendSignInLinkToEmail(auth, email, {
          url:             ACTION_URL,
          handleCodeInApp: true,
        });
        localStorage.setItem(EMAIL_KEY, email);
        setStatus("Link enviado! Verifique seu e-mail e clique no link.", "ok");
      } catch (err) {
        let msg = "Erro ao enviar link.";
        if (err.code === "auth/invalid-email")        msg = "E-mail inválido.";
        if (err.code === "auth/unauthorized-domain")  msg = "Domínio não autorizado no Firebase.";
        if (err.code === "auth/too-many-requests")    msg = "Muitas tentativas. Aguarde e tente de novo.";
        if (err.code === "auth/network-request-failed") msg = "Erro de conexão.";
        setStatus(msg, "err");
        loginBtn.disabled = false;
      }
    });
  </script>

<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
