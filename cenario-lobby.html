<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151814">
  <meta name="description" content="Protótipo do cenário tridimensional do lobby de O Sexto Lugar">
  <title>Cenário do Lobby — O Sexto Lugar</title>
  <link rel="icon" href="/favicon.png">
  <link rel="preload" href="/assets/lobby-left-corner-v1.webp" as="image" type="image/webp" fetchpriority="high">
  <link rel="stylesheet" href="/css/cenario-lobby.css?v=2">
</head>
<body>
  <main id="lobbyScene" aria-label="Sala tridimensional do lobby vista a partir do canto esquerdo">
    <div id="scenePlane" class="scenePlane">
      <img id="sceneImage" src="/assets/lobby-left-corner-v1.webp?v=1" width="1672" height="941" alt="Sala clara do Sexto Lugar vista do canto esquerdo, com mesa de madeira e seis cadeiras" fetchpriority="high" decoding="async">
    </div>
    <canvas id="lobbySceneCanvas" aria-hidden="true"></canvas>
    <div class="loading" id="sceneLoading" role="status">
      <div class="loading__line"><i id="sceneLoadingBar"></i></div>
      <span id="sceneLoadingText">Preparando a sala</span>
    </div>
    <div class="cinema" aria-hidden="true"></div>
  </main>
  <script src="/js/cenario-lobby.js?v=4" defer></script>
</body>
</html>
