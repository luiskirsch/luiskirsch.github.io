<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC8sSvA7_1HPYRFGFgdgzstkP_yQHadY-c",
  authDomain: "osextolugar-game.firebaseapp.com",
  projectId: "osextolugar-game",
  storageBucket: "osextolugar-game.firebasestorage.app",
  messagingSenderId: "947922328721",
  appId: "1:947922328721:web:989522c99e16ab449f3330",
  measurementId: "G-D6HG779ZFR"
};

const BACKEND_BASE_URL = "https://osl-video-server.onrender.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const nomeEl = document.getElementById("nome");
const usernameEl = document.getElementById("username");
const emailEl = document.getElementById("email");
const licenseEl = document.getElementById("license");
const statusEl = document.getElementById("status");
const playBtn = document.getElementById("playBtn");
const logoutBtn = document.getElementById("logoutBtn");
const linkLicenseBtn = document.getElementById("linkLicenseBtn");
const licenseInput = document.getElementById("licenseInput");
const licenseHelper = document.getElementById("licenseHelper");

let currentUser = null;
let currentProfile = null;

function setStatus(text, type = "") {
  statusEl.textContent = text;
  statusEl.className = "status";
  if (type) statusEl.classList.add(type);
}

function getLocalLicenseToken() {
  return localStorage.getItem("osl_license_token") || "";
}

function getLocalLicenseCode() {
  return localStorage.getItem("osl_license_code") || "";
}

function getLocalAccessToken() {
  return localStorage.getItem("osl_access_token") || "";
}

function canEnterGame(profileData) {
  return !!profileData?.access?.active && !!getLocalAccessToken();
}

function syncLicenseInput(profileData = null) {
  const code = profileData?.licenseCode || getLocalLicenseCode() || "";
  licenseInput.value = code;
}

function refreshUI(profileData, firebaseUser) {
  currentProfile = profileData;

  nomeEl.textContent =
    profileData?.displayName ||
    localStorage.getItem("osl_nome") ||
    firebaseUser?.displayName ||
    "-";

  usernameEl.textContent = profileData?.username
    ? "@" + profileData.username
    : (localStorage.getItem("osl_username")
        ? "@" + localStorage.getItem("osl_username")
        : "-");

  emailEl.textContent =
    profileData?.email ||
    firebaseUser?.email ||
    localStorage.getItem("osl_license_email") ||
    "-";

  licenseEl.textContent =
    profileData?.licenseCode ||
    getLocalLicenseCode() ||
    "Não vinculada";

  syncLicenseInput(profileData);

  if (canEnterGame(profileData)) {
    setStatus("Acesso liberado.", "ok");
    playBtn.disabled = false;
    linkLicenseBtn.disabled = false;
    linkLicenseBtn.textContent = "Restaurar acesso";
    licenseHelper.textContent =
      "Sua licença já está vinculada e este navegador possui acesso ativo.";
    return;
  }

  if (profileData?.licenseLinked && !getLocalAccessToken()) {
    setStatus("Sua licença está vinculada, mas este navegador ainda não possui acesso ativo.", "err");
    playBtn.disabled = true;
    linkLicenseBtn.disabled = false;
    linkLicenseBtn.textContent = "Restaurar acesso";
    licenseHelper.textContent =
      "Clique no botão para restaurar o acesso usando a licença salva neste navegador.";
    return;
  }

  setStatus("Sem acesso ativo.", "err");
  playBtn.disabled = true;
  linkLicenseBtn.disabled = false;
  linkLicenseBtn.textContent = "Vincular licença";
  licenseHelper.textContent =
    "Depois da compra, volte primeiro para a página de sucesso neste mesmo navegador.";
}

async function ensureUserProfile(user) {
  const userRef = doc(db, "users", user.uid);
  const snap = await getDoc(userRef);

  if (snap.exists()) {
    return snap.data();
  }

  const displayName =
    localStorage.getItem("osl_nome") ||
    user.displayName ||
    "Jogador";

  const email =
    user.email ||
    localStorage.getItem("osl_license_email") ||
    "";

  const username =
    localStorage.getItem("osl_username") ||
    String(email).split("@")[0] ||
    "jogador";

  const profileData = {
    uid: user.uid,
    userId: user.uid,
    email,
    displayName,
    username,
    avatarEmoji: "🔮",
    bio: "Novo participante do ritual.",
    createdAt: serverTimestamp(),
    updatedAt: serverTimestamp(),
    licenseLinked: false,
    licenseCode: "",
    product: "",
    access: {
      active: false
    },
    stats: {
      gamesPlayed: 0,
      wins: 0
    },
    friends: [],
    incomingRequests: [],
    outgoingRequests: []
  };

  await setDoc(userRef, profileData, { merge: true });

  return {
    ...profileData,
    createdAt: null,
    updatedAt: null
  };
}

async function loadProfile(user) {
  const profile = await ensureUserProfile(user);
  refreshUI(profile, user);
}

async function restoreAccessWithSavedLicense() {
  const licenseToken = getLocalLicenseToken();

  if (!licenseToken) {
    setStatus("Nenhuma licença salva neste navegador. Volte à página de sucesso após a compra.", "err");
    return;
  }

  try {
    linkLicenseBtn.disabled = true;
    playBtn.disabled = true;

    setStatus("Validando licença...");

    const verifyRes = await fetch(`${BACKEND_BASE_URL}/verificar-licenca`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ licenseToken })
    });

    const verifyData = await verifyRes.json().catch(() => ({}));

    if (!verifyRes.ok || !verifyData.valid) {
      setStatus("A licença salva neste navegador é inválida ou expirou.", "err");
      linkLicenseBtn.disabled = false;
      return;
    }

    setStatus("Emitindo acesso...");

    const accessRes = await fetch(`${BACKEND_BASE_URL}/emitir-acesso`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ licenseToken })
    });

    const accessData = await accessRes.json().catch(() => ({}));

    if (!accessRes.ok || !accessData.accessToken) {
      setStatus("Não foi possível restaurar o acesso.", "err");
      linkLicenseBtn.disabled = false;
      return;
    }

    localStorage.setItem("osl_access_token", accessData.accessToken);
    localStorage.setItem("osl_access_expires_at", String(accessData.expiresAt || ""));
    localStorage.setItem("osl_license_code", verifyData.licenseCode || "");
    localStorage.setItem("osl_license_email", verifyData.email || "");

    const userRef = doc(db, "users", currentUser.uid);

    await setDoc(userRef, {
      email: currentUser.email || verifyData.email || "",
      licenseLinked: true,
      licenseCode: verifyData.licenseCode || "",
      product: verifyData.product || "osl_ritual_completo",
      access: {
        active: true
      },
      updatedAt: serverTimestamp()
    }, { merge: true });

    const refreshedSnap = await getDoc(userRef);
    if (refreshedSnap.exists()) {
      refreshUI(refreshedSnap.data(), currentUser);
    }

    setStatus("Licença vinculada com sucesso. Acesso liberado.", "ok");
  } catch (err) {
    console.error(err);
    setStatus("Erro ao vincular licença.", "err");
  } finally {
    linkLicenseBtn.disabled = false;
  }
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "./login.html";
    return;
  }

  currentUser = user;

  try {
    await loadProfile(user);
  } catch (err) {
    console.error(err);
    setStatus("Erro ao carregar perfil.", "err");
    playBtn.disabled = true;
  }
});

linkLicenseBtn.addEventListener("click", async () => {
  if (!currentUser) return;
  await restoreAccessWithSavedLicense();
});

playBtn.addEventListener("click", () => {
  if (!currentProfile || !canEnterGame(currentProfile)) {
    setStatus("Vincule sua licença antes de entrar no jogo.", "err");
    return;
  }

  window.location.href = "./entrada.html";
});

logoutBtn.addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "./login.html";
});
</script>
