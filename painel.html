<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painel | O SextoLugar</title>

<style>
  body{
    margin:0;
    background:#050507;
    color:#fff;
    font-family:"Segoe UI",system-ui;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
  }

  .card{
    width:100%;
    max-width:480px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    padding:28px;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
  }

  h1{
    margin:0 0 6px;
    font-size:26px;
  }

  .muted{
    color:rgba(255,255,255,.6);
    font-size:14px;
    margin-bottom:20px;
  }

  .box{
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px;
    padding:14px;
    margin-bottom:12px;
  }

  .label{
    font-size:11px;
    color:#e6c07b;
    text-transform:uppercase;
    letter-spacing:.12em;
  }

  .value{
    margin-top:4px;
    font-size:15px;
  }

  .status{
    margin-top:12px;
    font-size:14px;
  }

  .ok{ color:#82d996; }
  .err{ color:#ff6b6b; }

  button{
    width:100%;
    height:52px;
    border:none;
    border-radius:14px;
    margin-top:16px;
    background:linear-gradient(135deg,#e6c07b,#c99c4a);
    font-weight:700;
    cursor:pointer;
  }

  .logout{
    margin-top:10px;
    background:rgba(255,255,255,.06);
    color:#fff;
  }
</style>
</head>

<body>

<div class="card">
  <h1>Seu acesso</h1>
  <div class="muted">Painel do O SextoLugar</div>

  <div class="box">
    <div class="label">Nome</div>
    <div class="value" id="nome">...</div>
  </div>

  <div class="box">
    <div class="label">Usuário</div>
    <div class="value" id="username">...</div>
  </div>

  <div class="box">
    <div class="label">Email</div>
    <div class="value" id="email">...</div>
  </div>

  <div class="box">
    <div class="label">Licença</div>
    <div class="value" id="license">...</div>
  </div>

  <div class="status" id="status"></div>

  <button id="playBtn">Entrar no jogo</button>
  <button class="logout" id="logoutBtn">Sair</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC8sSvA7_1HPYRFGFgdgzstkP_yQHadY-c",
  authDomain: "osextolugar-game.firebaseapp.com",
  projectId: "osextolugar-game",
  storageBucket: "osextolugar-game.firebasestorage.app",
  messagingSenderId: "947922328721",
  appId: "1:947922328721:web:989522c99e16ab449f3330",
  measurementId: "G-D6HG779ZFR"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const nomeEl = document.getElementById("nome");
const usernameEl = document.getElementById("username");
const emailEl = document.getElementById("email");
const licenseEl = document.getElementById("license");
const statusEl = document.getElementById("status");

const playBtn = document.getElementById("playBtn");
const logoutBtn = document.getElementById("logoutBtn");

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "./login.html";
    return;
  }

  try {
    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);

    if (!snap.exists()) {
      nomeEl.textContent = localStorage.getItem("osl_nome") || "-";
      usernameEl.textContent = localStorage.getItem("osl_username")
        ? "@" + localStorage.getItem("osl_username")
        : "-";
      emailEl.textContent = localStorage.getItem("osl_license_email") || user.email || "-";
      licenseEl.textContent = localStorage.getItem("osl_license_code") || "Não vinculada";
      statusEl.textContent = "Perfil não encontrado no banco.";
      statusEl.className = "status err";
      return;
    }

    const data = snap.data();

    nomeEl.textContent = data.displayName || "-";
    usernameEl.textContent = data.username ? "@" + data.username : "-";
    emailEl.textContent = data.email || user.email || "-";
    licenseEl.textContent = data.licenseCode || "Não vinculada";

    if (data.access?.active) {
      statusEl.textContent = "Acesso liberado.";
      statusEl.className = "status ok";
    } else {
      statusEl.textContent = "Sem acesso ativo.";
      statusEl.className = "status err";
    }
  } catch (err) {
    console.error(err);
    statusEl.textContent = "Erro ao carregar perfil.";
    statusEl.className = "status err";
  }
});

playBtn.addEventListener("click", () => {
  window.location.href = "./entrada.html";
});

logoutBtn.addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "./login.html";
});
</script>

</body>
</html>
