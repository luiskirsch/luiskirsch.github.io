<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Construtor de Deck — O SextoLugar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0907;
      --surface: #1a1208;
      --border: rgba(200,150,60,.22);
      --fg: #f0e8d8;
      --muted: #8a7a6a;
      --gold: #c89630;
      --green: #60b860;
      --red: #c05050;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,6,2,.7);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header__logo {
      font-size: 13px;
      letter-spacing: .12em;
      color: var(--gold);
      text-transform: uppercase;
      text-decoration: none;
    }
    .header__title {
      font-size: 16px;
      letter-spacing: .08em;
      color: var(--fg);
    }
    .header__xp {
      font-size: 12px;
      color: var(--green);
      letter-spacing: .06em;
    }

    /* ── Layout ── */
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 0;
      flex: 1;
      min-height: 0;
    }

    /* ── Sidebar ── */
    .sidebar {
      border-right: 1px solid var(--border);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .sidebar__heading {
      font-size: 11px;
      letter-spacing: .1em;
      color: var(--muted);
      text-transform: uppercase;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .deckList { display: flex; flex-direction: column; gap: 6px; }
    .deckItem {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      cursor: pointer;
      transition: background .2s, border-color .2s;
    }
    .deckItem:hover, .deckItem--active {
      background: rgba(200,150,60,.1);
      border-color: rgba(200,150,60,.5);
    }
    .deckItem__name { font-size: 14px; }
    .deckItem__count { font-size: 11px; color: var(--muted); }
    .deckItem__del {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      padding: 2px 6px;
      border-radius: 6px;
      transition: color .2s, background .2s;
    }
    .deckItem__del:hover { color: var(--red); background: rgba(200,80,80,.1); }

    .btn {
      background: rgba(200,150,60,.15);
      border: 1px solid rgba(200,150,60,.4);
      border-radius: var(--radius);
      color: var(--gold);
      font-size: 13px;
      padding: 10px 16px;
      cursor: pointer;
      letter-spacing: .05em;
      transition: background .2s, border-color .2s;
      width: 100%;
      text-align: center;
    }
    .btn:hover { background: rgba(200,150,60,.28); border-color: var(--gold); }
    .btn--green {
      background: rgba(80,180,80,.15);
      border-color: rgba(80,180,80,.4);
      color: var(--green);
    }
    .btn--green:hover { background: rgba(80,180,80,.28); border-color: var(--green); }
    .btn--disabled { opacity: .45; pointer-events: none; }

    /* ── Main ── */
    .main { display: flex; flex-direction: column; overflow: hidden; }

    .deckEditor {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .deckEditor__toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .deckEditor__nameInput {
      flex: 1;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--fg);
      font-size: 15px;
      padding: 8px 14px;
      font-family: inherit;
    }
    .deckEditor__nameInput:focus { outline: none; border-color: var(--gold); }
    .deckEditor__count { font-size: 12px; color: var(--muted); white-space: nowrap; }

    .deckEditor__body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex: 1;
      overflow: hidden;
    }

    .cardPool, .deckSlots {
      overflow-y: auto;
      padding: 16px;
    }
    .cardPool { border-right: 1px solid var(--border); }

    .sectionTitle {
      font-size: 11px;
      letter-spacing: .1em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .packGroup { margin-bottom: 20px; }
    .packGroup__name {
      font-size: 12px;
      color: var(--gold);
      letter-spacing: .08em;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .cardGrid { display: flex; flex-direction: column; gap: 6px; }

    .cardChip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      transition: background .2s, border-color .2s;
      gap: 8px;
    }
    .cardChip:hover { background: rgba(200,150,60,.09); border-color: rgba(200,150,60,.4); }
    .cardChip--inDeck {
      background: rgba(80,180,80,.1);
      border-color: rgba(80,180,80,.4);
    }
    .cardChip__info { flex: 1; min-width: 0; }
    .cardChip__title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cardChip__type { font-size: 11px; color: var(--muted); }
    .cardChip__effect { font-size: 10px; color: var(--gold); margin-top: 2px; }
    .cardChip__action {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: var(--muted);
      line-height: 1;
      padding: 2px;
      flex-shrink: 0;
    }
    .cardChip--inDeck .cardChip__action { color: var(--red); }

    .emptyState {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 40px 20px;
      line-height: 1.7;
    }

    /* ── Filter bar ── */
    .filterBar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .filterBtn {
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      padding: 4px 10px;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
    }
    .filterBtn--active {
      background: rgba(200,150,60,.18);
      border-color: rgba(200,150,60,.6);
      color: var(--gold);
    }

    /* ── XP / Level display ── */
    .xpBar {
      background: rgba(80,180,80,.08);
      border: 1px solid rgba(80,180,80,.2);
      border-radius: 999px;
      height: 6px;
      overflow: hidden;
    }
    .xpBar__fill {
      height: 100%;
      background: var(--green);
      border-radius: 999px;
      transition: width .5s ease;
    }
    .levelDisplay {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .levelDisplay__row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
    }

    /* ── No deck selected ── */
    .noDeckState {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      color: var(--muted);
      gap: 16px;
      padding: 40px;
      text-align: center;
    }
    .noDeckState__icon { font-size: 48px; }
    .noDeckState__text { font-size: 14px; line-height: 1.7; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(40,160,80,.9);
      color: #fff;
      font-size: 14px;
      padding: 10px 20px;
      border-radius: 999px;
      opacity: 0;
      transition: opacity .3s, transform .3s;
      pointer-events: none;
      z-index: 9999;
    }
    .toast--visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast--error { background: rgba(200,60,60,.9); }

    @media (max-width: 700px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
      .deckEditor__body { grid-template-columns: 1fr; }
      .cardPool { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>

    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

      { type: "Segredo", title: "Versão sem filtro",     text: "O anfitrião escolhe um jogador. O grupo tem permissão para fazer uma única pergunta que normalmente seria inadequada." },
      { type: "Segredo", title: "Peso que carrego",      text: "Um voluntário descreve algo que ainda carrega emocionalmente de uma relação passada — sem identificar a pessoa." },
      { type: "Segredo", title: "O que eu faria diferente", text: "Cada jogador revela uma decisão que tomou e que, se pudesse, mudaria completamente — e por quê não muda." },
      { type: "Segredo", title: "Limite invisível",      text: "Cada um revela um limite pessoal que nunca disse em voz alta mas que já foi ultrapassado várias vezes sem que ninguém soubesse." }
    ],
    "pacote-casais": [
      { type: "Casais", title: "Primeira vez que percebi",    text: "Cada um conta o momento exato em que percebeu que o outro era diferente de qualquer pessoa que havia conhecido." },
      { type: "Casais", title: "O que eu não disse",          text: "Cada parceiro revela algo que pensa sobre o relacionamento e que raramente ou nunca verbalizou." },
      { type: "Casais", title: "Meu medo de nós",             text: "Cada um completa: 'O que mais me assusta neste relacionamento é...' Sem minimizar." },
      { type: "Casais", title: "Você me surpreendeu quando",  text: "Cada parceiro conta um momento em que o outro o surpreendeu — positiva ou negativamente." },
      { type: "Casais", title: "O que eu precisava e não pedi", text: "Cada um revela algo que precisou do outro em algum momento mas não pediu. O outro ouve em silêncio." },
      { type: "Casais", title: "Versão que você não viu",     text: "Cada parceiro descreve uma versão de si mesmo que o outro ainda não conhece completamente." },
      { type: "Casais", title: "Momento que quase mudou tudo", text: "Um voluntário conta uma situação em que a relação quase tomou outro rumo — e o que fez a diferença." },
      { type: "Casais", title: "Expectativa não dita",        text: "Cada um revela uma expectativa sobre o relacionamento que nunca expressou claramente — mas que existe." },
      { type: "Casais", title: "Coisa que eu aceito mas não gosto", text: "Cada parceiro revela algo no comportamento do outro que aceita, mas que preferiria que fosse diferente." },
      { type: "Casais", title: "O que me prende aqui",        text: "Cada um responde honestamente: o que faz você escolher esse relacionamento todos os dias — mesmo nos dias difíceis?" },
      { type: "Casais", title: "Momento de distância",        text: "Cada parceiro identifica um período em que se sentiu distante do outro — sem culpa, apenas com honestidade." },
      { type: "Casais", title: "Palavra que nos define",      text: "Cada um escolhe uma única palavra para descrever o estado atual do relacionamento. Nenhuma palavra é discutida imediatamente." },
      { type: "Casais", title: "Pergunta que evito",          text: "Cada parceiro revela uma pergunta que evita fazer ao outro — e o outro decide se responde agora." },
      { type: "Casais", title: "O que mudou em mim",          text: "Cada um conta como mudou desde que está neste relacionamento — para melhor e para pior." },
      { type: "Casais", title: "Desejo esquecido",            text: "Cada parceiro revela algo que desejava no início da relação e que foi deixando de lado com o tempo." },
      { type: "Casais", title: "Se eu pudesse recomeçar",     text: "Cada um completa: 'Se eu pudesse voltar ao início desta relação, eu faria diferente...' e explica por quê." },
      { type: "Casais", title: "Momento de orgulho",          text: "Cada parceiro conta um momento em que sentiu um orgulho genuíno do outro — algo que talvez nunca tenha dito." },
      { type: "Casais", title: "O futuro que imagino",        text: "Cada um descreve como imagina esta relação daqui a 5 anos — com honestidade sobre o que espera e o que teme." }
    ]
  };

  // Indicadores de efeito por carta
  const CARD_EFFECT_LABELS = {
    "30 segundos": "⚡ Force + ⏱ Timer",
    "Escolha do grupo": "⚡ Votação",
    "Confiança quebrada": "⚰ +XP",
    "Ponto em comum": "⚡ Timer 2min",
    "Silêncio compartilhado": "⚡ Timer 30s",
    "Carta aberta": "⚰ +XP",
    "Inveja honesta": "⚡ Force Player",
    "Julgamento justo": "⚡ Votação",
    "Contradição pessoal": "⚰ +XP",
    "Pergunta que temo": "⚡ Force Player",
    "Provocação direta": "⚡ Force 2 Players",
    "Interrogatório": "⚡ Force Player",
    "Voto de eliminação": "⚡ Votação",
    "O mais fraco": "⚡ Votação",
    "Batalha de perspectivas": "⚡ Timer 90s",
    "Eu não confio em você": "⚰ → Conexão",
    "Acusação pública": "⚡ Force Player",
    "Quem manda aqui": "⚡ Timer 60s",
    "O que nunca contei": "⚰ +XP",
    "Confissão sem nome": "⚰ +XP",
    "Fantasma do passado": "⚡ Force Player",
    "Versão sem filtro": "⚡ Force Player",
    "Medo real": "⚰ +XP",
    "Meu medo de nós": "⚰ +XP",
    "Palavra que nos define": "⚡ Votação",
    "Expectativa não dita": "⚰ +XP",
    "Pergunta que evito": "⚡ Force + ⚰ +XP"
  };

  // ── XP helpers ─────────────────────────────────────────────────────────
  function levelFromXP(xp) { return Math.floor(Math.sqrt(Math.max(0, xp) / 50)) + 1; }
  function xpForLevel(lv) { return Math.pow(lv - 1, 2) * 50; }
  function xpForNextLevel(lv) { return Math.pow(lv, 2) * 50; }

  // ── State ──────────────────────────────────────────────────────────────
  let userId = null;
  let userDecks = [];       // [{id, name, cards:[]}]
  let activeDeckId = null;  // currently open in editor
  let deckCards = [];       // cards in the deck being edited
  let deckName = "";
  let filterType = "all";

  // Cartas disponíveis para o usuário
  function getOwnedCards() {
    try {
      const compras = JSON.parse(localStorage.getItem("osl_compras") || "[]");
      const packs = compras.map(c => c.produto);
      let cards = [...BASIC_CARDS];
      packs.forEach(p => { if (PACK_CARDS[p]) cards = cards.concat(PACK_CARDS[p]); });
      return cards;
    } catch { return [...BASIC_CARDS]; }
  }

  function getUniqueTypes(cards) {
    return ["all", ...new Set(cards.map(c => c.type))];
  }

  // ── Firestore ──────────────────────────────────────────────────────────
  async function loadDecks(uid) {
    const snap = await getDocs(collection(db, "users", uid, "decks"));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }

  async function saveDeck(uid, deckId, name, cards) {
    const ref = deckId
      ? doc(db, "users", uid, "decks", deckId)
      : doc(collection(db, "users", uid, "decks"));
    await setDoc(ref, { name, cards, updatedAt: serverTimestamp() }, { merge: true });
    return ref.id;
  }

  async function deleteDeck(uid, deckId) {
    await deleteDoc(doc(db, "users", uid, "decks", deckId));
  }

  // ── UI ─────────────────────────────────────────────────────────────────
  function showToast(msg, isError = false) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.toggle("toast--error", isError);
    el.classList.add("toast--visible");
    setTimeout(() => el.classList.remove("toast--visible"), 2000);
  }

  function renderXP(xp = 0) {
    const lv = levelFromXP(xp);
    const curr = xpForLevel(lv);
    const next = xpForNextLevel(lv);
    const pct = next > curr ? Math.round((xp - curr) / (next - curr) * 100) : 100;
    document.getElementById("levelLabel").textContent = `Nível ${lv}`;
    document.getElementById("xpLabel").textContent = `${xp} XP`;
    document.getElementById("xpBarFill").style.width = `${pct}%`;
    document.getElementById("xpNextLabel").textContent = `próx: ${next} XP`;
    document.getElementById("headerXp").textContent = `Nível ${lv} · ${xp} XP`;
  }

  function renderDeckList() {
    const el = document.getElementById("deckList");
    if (!userDecks.length) {
      el.innerHTML = `<div class="emptyState">Nenhum deck criado ainda.</div>`;
      return;
    }
    el.innerHTML = userDecks.map(d => `
      <div class="deckItem${activeDeckId === d.id ? " deckItem--active" : ""}"
           onclick="openDeck('${d.id}')">
        <div>
          <div class="deckItem__name">${d.name || "Sem nome"}</div>
          <div class="deckItem__count">${(d.cards || []).length} cartas</div>
        </div>
        <button class="deckItem__del" title="Deletar deck"
          onclick="event.stopPropagation();confirmDeleteDeck('${d.id}')">×</button>
      </div>
    `).join("");
  }

  function renderEditor() {
    const main = document.getElementById("mainArea");
    const deck = userDecks.find(d => d.id === activeDeckId);
    if (!deck && activeDeckId !== "__new__") {
      main.innerHTML = `
        <div class="noDeckState">
          <span class="noDeckState__icon">🃏</span>
          <p class="noDeckState__text">Selecione um deck na lista<br>ou crie um novo para começar.</p>
        </div>`;
      return;
    }

    const owned = getOwnedCards();
    const types = getUniqueTypes(owned);
    const deckTitles = new Set(deckCards.map(c => c.title));
    const filtered = filterType === "all" ? owned : owned.filter(c => c.type === filterType);

    main.innerHTML = `
      <div class="deckEditor">
        <div class="deckEditor__toolbar">
          <input class="deckEditor__nameInput" id="deckNameInput" placeholder="Nome do deck"
            value="${deckName}" oninput="deckNameChanged(this.value)">
          <span class="deckEditor__count">${deckCards.length} carta(s)</span>
          <button class="btn btn--green" style="width:auto;padding:8px 18px" onclick="saveCurrent()">Salvar</button>
        </div>
        <div class="deckEditor__body">
          <div class="cardPool">
            <div class="sectionTitle">Cartas disponíveis</div>
            <div class="filterBar">
              ${types.map(t => `
                <button class="filterBtn${filterType === t ? " filterBtn--active" : ""}"
                  onclick="setFilter('${t}')">
                  ${t === "all" ? "Todas" : t}
                </button>`).join("")}
            </div>
            <div class="cardGrid">
              ${filtered.map(card => `
                <div class="cardChip${deckTitles.has(card.title) ? " cardChip--inDeck" : ""}"
                     onclick="toggleCard(${JSON.stringify(card).replace(/"/g, '&quot;')})">
                  <div class="cardChip__info">
                    <div class="cardChip__title">${card.title}</div>
                    <div class="cardChip__type">${card.type}</div>
                    ${CARD_EFFECT_LABELS[card.title] ? `<div class="cardChip__effect">${CARD_EFFECT_LABELS[card.title]}</div>` : ""}
                  </div>
                  <button class="cardChip__action" title="${deckTitles.has(card.title) ? "Remover" : "Adicionar"}">
                    ${deckTitles.has(card.title) ? "−" : "+"}
                  </button>
                </div>`).join("")}
            </div>
          </div>
          <div class="deckSlots">
            <div class="sectionTitle">No deck (${deckCards.length})</div>
            <div class="cardGrid" id="deckCardGrid">
              ${deckCards.length === 0
                ? `<div class="emptyState">Adicione cartas do painel esquerdo.</div>`
                : deckCards.map(card => `
                  <div class="cardChip cardChip--inDeck"
                       onclick="removeCard('${card.title.replace(/'/g,"\\'")}')">
                    <div class="cardChip__info">
                      <div class="cardChip__title">${card.title}</div>
                      <div class="cardChip__type">${card.type}</div>
                      ${CARD_EFFECT_LABELS[card.title] ? `<div class="cardChip__effect">${CARD_EFFECT_LABELS[card.title]}</div>` : ""}
                    </div>
                    <button class="cardChip__action" title="Remover">−</button>
                  </div>`).join("")}
            </div>
          </div>
        </div>
      </div>`;
  }

  // ── Actions ────────────────────────────────────────────────────────────
  window.openDeck = function(id) {
    const deck = userDecks.find(d => d.id === id);
    if (!deck) return;
    activeDeckId = id;
    deckCards = [...(deck.cards || [])];
    deckName = deck.name || "";
    filterType = "all";
    renderDeckList();
    renderEditor();
  };

  window.deckNameChanged = function(val) { deckName = val; };

  window.setFilter = function(type) {
    filterType = type;
    renderEditor();
  };

  window.toggleCard = function(card) {
    const idx = deckCards.findIndex(c => c.title === card.title);
    if (idx >= 0) {
      deckCards.splice(idx, 1);
    } else {
      deckCards.push(card);
    }
    renderEditor();
  };

  window.removeCard = function(title) {
    deckCards = deckCards.filter(c => c.title !== title);
    renderEditor();
  };

  window.saveCurrent = async function() {
    if (!userId) return showToast("Você precisa estar logado.", true);
    if (!deckName.trim()) return showToast("Dê um nome ao deck.", true);
    try {
      const id = await saveDeck(userId, activeDeckId === "__new__" ? null : activeDeckId, deckName.trim(), deckCards);
      userDecks = await loadDecks(userId);
      activeDeckId = id;
      renderDeckList();
      renderEditor();
      showToast("Deck salvo!");
    } catch(e) {
      console.error(e);
      showToast("Erro ao salvar.", true);
    }
  };

  window.confirmDeleteDeck = async function(id) {
    if (!confirm("Deletar este deck?")) return;
    try {
      await deleteDeck(userId, id);
      userDecks = userDecks.filter(d => d.id !== id);
      if (activeDeckId === id) { activeDeckId = null; deckCards = []; deckName = ""; }
      renderDeckList();
      renderEditor();
      showToast("Deck deletado.");
    } catch(e) {
      showToast("Erro ao deletar.", true);
    }
  };

  document.getElementById("newDeckBtn").addEventListener("click", () => {
    activeDeckId = "__new__";
    deckCards = [];
    deckName = "";
    filterType = "all";
    userDecks = userDecks.map(d => ({ ...d })); // reset active highlight
    renderDeckList();
    renderEditor();
  });

  // ── Auth ───────────────────────────────────────────────────────────────
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "login.html";
      return;
    }
    userId = user.uid;

    const userSnap = await getDoc(doc(db, "users", userId));
    const userData = userSnap.data() || {};
    renderXP(userData.xp || 0);

    userDecks = await loadDecks(userId);
    renderDeckList();
    renderEditor();
  });
</script>
</body>
</html>
