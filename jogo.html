<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O SextoLugar – Entrada</title>

<style>
:root{
    --bg:#050505;
    --gold:#e6c07b;
    --muted:#a7a7a7;
    --card:rgba(255,255,255,0.045);
    --line:rgba(230,192,123,.22);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
    background: radial-gradient(circle at center, #101010 0%, #050505 60%);
    font-family: "Georgia", serif;
    color:white;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
}

.container{
    max-width:750px;
    padding:40px;
}

h1{
    font-size:48px;
    letter-spacing:8px;
    color:var(--gold);
    margin-bottom:20px;
}

.sub{
    color:var(--muted);
    font-size:16px;
    margin-bottom:40px;
}

.card{
    background:var(--card);
    padding:40px;
    border-radius:16px;
    border:1px solid var(--line);
    backdrop-filter: blur(10px);
}

.card h2{
    font-size:14px;
    letter-spacing:4px;
    color:var(--gold);
    margin-bottom:30px;
}

.card p{
    font-size:18px;
    line-height:1.6;
    margin-bottom:25px;
}

.silencio{
    animation: pulsar 3s infinite ease-in-out;
    color:var(--muted);
    font-size:14px;
    margin-top:20px;
}

@keyframes pulsar{
    0%{opacity:.4}
    50%{opacity:1}
    100%{opacity:.4}
}

.botoes{
    margin-top:30px;
}

.botao{
    background:transparent;
    border:1px solid var(--gold);
    color:var(--gold);
    padding:12px 28px;
    margin:0 10px;
    border-radius:30px;
    cursor:pointer;
    font-size:14px;
    letter-spacing:2px;
    transition:.3s;
}

.botao:hover{
    background:var(--gold);
    color:black;
}

#fade{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#050505;
    opacity:0;
    pointer-events:none;
    transition:opacity .8s ease;
    z-index:9999;
}
</style>
</head>

<body>

<div class="container">
    <h1>O SEXTO LUGAR</h1>
    <div class="sub">
        Você está prestes a atravessar a linha.  
        Respire. Leia. E escolha com cuidado.
    </div>

    <div class="card">
        <h2>• PROTOCOLO • ENTRADA •</h2>

        <p>
        Antes de iniciar, confirme que você está sozinho(a).  
        Se ouvir qualquer coisa atrás de você… <i>não vire</i>.
        </p>

        <div class="botoes">
            <button class="botao">LER O RITUAL</button>
            <button onclick="iniciarJogo()" class="botao">INICIAR</button>
        </div>

        <div class="silencio">
            O silêncio é parte do jogo.
        </div>
    </div>
</div>

<div id="fade"></div>

<script>
function iniciarJogo(){
    const fade = document.getElementById("fade");
    fade.style.opacity = "1";
    setTimeout(()=>{
        window.location.href = "jogo.html";
    },800);
}
</script>

</body>
</html>
