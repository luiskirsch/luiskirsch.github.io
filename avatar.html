<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>SextoLugar · Seu avatar</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="./favicon.png">
<script src="./js/domain-guard.js"></script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; img-src 'self' data:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://www.googleapis.com https://firebaseinstallations.googleapis.com https://www.gstatic.com; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://www.gstatic.com; frame-src https://cena.preludiojogos.com.br; upgrade-insecure-requests; block-all-mixed-content;">
<link rel="preconnect" href="https://cena.preludiojogos.com.br" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ouro:#d7b06b; --ouro-claro:#f3dca8; --texto:#f0ece0; --texto2:rgba(240,236,224,.68);
  --fundo:#070504; --barra-h:58px;
  --serif:'Cinzel','Palatino Linotype',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fundo);color:var(--texto);font-family:var(--sans);overflow:hidden}
.barra{position:fixed;inset:0 0 auto 0;height:var(--barra-h);display:flex;align-items:center;gap:14px;
  padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));
  background:linear-gradient(180deg,rgba(12,9,6,.96),rgba(12,9,6,.86));border-bottom:1px solid rgba(215,176,107,.22);z-index:3}
.voltar{display:inline-flex;align-items:center;gap:8px;color:var(--texto2);text-decoration:none;font-size:13px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;padding:8px 10px;border-radius:8px;transition:color .2s ease,background-color .2s ease}
.voltar:hover{color:#fff1d2;background:rgba(215,176,107,.10)}
.voltar svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.titulo{font-family:var(--serif);font-weight:700;letter-spacing:.22em;font-size:15px;color:var(--ouro-claro);margin:0;white-space:nowrap}
.espaco{flex:1}
.estado{font-size:13px;color:var(--texto2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.estado.ok{color:#cfe8b8}
.estado.erro{color:#f0c9a0}
.app{font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.02em;color:#f3dca8;background:rgba(12,9,6,.72);
  border:1px solid rgba(215,176,107,.55);border-radius:999px;padding:9px 16px;cursor:pointer;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease}
.app:hover{background:rgba(40,28,14,.88);border-color:#d7b06b;color:#fff1d2}
.app:focus-visible,.voltar:focus-visible{outline:2px solid #d7b06b;outline-offset:2px}
.aviso{position:fixed;top:calc(var(--barra-h) + 10px);right:16px;max-width:min(380px,calc(100% - 32px));z-index:4;
  font-size:13px;line-height:1.45;color:#e9dfc8;background:rgba(12,9,6,.94);border:1px solid rgba(215,176,107,.3);
  border-radius:10px;padding:10px 12px}
.aviso a{color:#f3dca8;font-weight:600}
.palco{position:fixed;inset:var(--barra-h) 0 0 0}
.palco iframe{width:100%;height:100%;border:0;display:block;background:#0d0a08}
@media (max-width:640px){
  .titulo{display:none}
  .estado{max-width:52vw}
}
@media (pointer:coarse){ .app{display:none} }
</style>
</head>
<body>
<header class="barra">
  <a class="voltar" href="./hub.html" aria-label="Voltar ao Hub">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    Hub
  </a>
  <h1 class="titulo">SEU AVATAR</h1>
  <span class="espaco"></span>
  <span class="estado" id="avatarEstado" role="status" aria-live="polite">Carregando o estúdio…</span>
  <button class="app" id="avatarApp" type="button" hidden>Abrir no app</button>
</header>
<div class="aviso" id="avatarAviso" hidden></div>
<main class="palco">
  <iframe id="avatarFrame" title="Criador de avatar em 3D" allow="fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</main>
<script type="module" src="./js/avatar-pagina.js?v=1"></script>
</body>
</html>
