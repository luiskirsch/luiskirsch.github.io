name               = "preludio-waf"
main               = "waf-worker.js"
compatibility_date = "2025-01-01"

# O SextoLugar — jogo
[[routes]]
pattern   = "preludiojogos.com/*"
zone_name = "preludiojogos.com"

[[routes]]
pattern   = "www.preludiojogos.com/*"
zone_name = "preludiojogos.com"

# Espaço Prelúdio — plataforma de telessaúde
[[routes]]
pattern   = "espacopreludio.com.br/*"
zone_name = "espacopreludio.com.br"

[[routes]]
pattern   = "www.espacopreludio.com.br/*"
zone_name = "espacopreludio.com.br"
