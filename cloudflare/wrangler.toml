name               = "preludio-waf"
main               = "waf-worker.js"
compatibility_date = "2025-01-01"

# Deploy o Worker como "zone worker" — intercepta todo o tráfego do domínio.
# Exige que preludiojogos.com esteja com nameservers apontando pro Cloudflare.
[[routes]]
pattern   = "preludiojogos.com/*"
zone_name = "preludiojogos.com"

[[routes]]
pattern   = "www.preludiojogos.com/*"
zone_name = "preludiojogos.com"

# Se preludiojogos.com.br também estiver no Cloudflare, descomente:
# [[routes]]
# pattern   = "preludiojogos.com.br/*"
# zone_name = "preludiojogos.com.br"
