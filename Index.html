<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contagem Regressiva — MyDrugs 2.0</title>
  <style>
    :root{
      --bg:#000000;
      --panel:#0a0a0a;
      --text:#f5f5f5;
      --muted:#cfcfcf;
      --blue-1:#b8ecff;
      --blue-2:#76cfff;
      --blue-3:#2ca5ff;
      --glass:rgba(255,255,255,.12);
      --glass-2:rgba(255,255,255,.22);
      --shadow:0 0 30px rgba(87,175,255,.18), 0 0 80px rgba(87,175,255,.08);
    }*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:radial-gradient(circle at 50% 35%, #101623 0%, #040608 38%, #000 72%);
  color:var(--text);
  font-family:Inter, Arial, Helvetica, sans-serif;
  overflow:hidden;
}

.scene{
  min-height:100vh;
  display:grid;
  grid-template-columns:minmax(320px, 520px) 1fr;
  align-items:center;
  gap:min(5vw,80px);
  padding:min(5vw,56px);
}

.left{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:70vh;
}

.right{
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:24px;
  max-width:820px;
}

.headline-top{
  margin:0;
  font-size:clamp(32px,4vw,72px);
  font-weight:800;
  line-height:.95;
  letter-spacing:-.04em;
}

.headline-main{
  margin:0;
  font-size:clamp(52px,8vw,124px);
  font-weight:900;
  line-height:.92;
  letter-spacing:-.06em;
}

.countdown{
  display:flex;
  gap:clamp(8px,1.2vw,18px);
  flex-wrap:wrap;
  align-items:flex-end;
}

.unit{
  min-width:min(18vw,150px);
  text-align:center;
}

.value{
  font-size:clamp(44px,7vw,108px);
  font-weight:900;
  line-height:.86;
  letter-spacing:-.05em;
  font-variant-numeric:tabular-nums;
}

.dots{
  font-size:clamp(42px,6vw,92px);
  font-weight:900;
  line-height:1;
  transform:translateY(-10px);
  opacity:.95;
}

.label{
  margin-top:10px;
  font-size:clamp(12px,1vw,18px);
  font-weight:700;
  letter-spacing:.35em;
  color:var(--muted);
}

.coming{
  margin:0;
  font-size:clamp(34px,5vw,84px);
  font-weight:800;
  line-height:1;
  letter-spacing:-.04em;
}

.date-line{
  color:#a8b7d4;
  font-size:clamp(14px,1.1vw,20px);
  letter-spacing:.12em;
  text-transform:uppercase;
}

.hourglass-wrap{
  width:min(100%,440px);
  aspect-ratio:0.7/1.1;
  position:relative;
  filter:drop-shadow(0 0 30px rgba(120,200,255,.16));
}

.hourglass-wrap svg{
  width:100%;
  height:100%;
  display:block;
}

.glow{
  position:absolute;
  inset:auto 12% 12% 12%;
  height:20%;
  background:radial-gradient(circle, rgba(66,178,255,.24) 0%, rgba(66,178,255,.08) 40%, rgba(66,178,255,0) 72%);
  filter:blur(18px);
  pointer-events:none;
}

@media (max-width:900px){
  body{overflow:auto}
  .scene{
    grid-template-columns:1fr;
    gap:20px;
    text-align:center;
  }
  .right{align-items:center}
  .countdown{justify-content:center}
  .unit{min-width:90px}
  .dots{transform:none}
  .left{min-height:auto}
  .hourglass-wrap{width:min(82vw,360px)}
}

  </style>
</head>
<body>
  <main class="scene">
    <section class="left" aria-hidden="true">
      <div class="hourglass-wrap">
        <div class="glow"></div>
        <svg viewBox="0 0 420 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ampulheta com contagem regressiva">
          <defs>
            <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#e8f1ff"/>
              <stop offset="18%" stop-color="#7e8da8"/>
              <stop offset="50%" stop-color="#f7fbff"/>
              <stop offset="78%" stop-color="#6f7e98"/>
              <stop offset="100%" stop-color="#dbe8ff"/>
            </linearGradient>
            <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="rgba(255,255,255,.22)"/>
              <stop offset="100%" stop-color="rgba(255,255,255,.04)"/>
            </linearGradient>
            <linearGradient id="sandGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#d7f8ff"/>
              <stop offset="40%" stop-color="#8ee0ff"/>
              <stop offset="70%" stop-color="#4fbfff"/>
              <stop offset="100%" stop-color="#1e8fff"/>
            </linearGradient>
            <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="8" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
            <clipPath id="topBowlClip">
              <path d="M118 116 H302 C296 178 266 245 232 288 C225 297 219 304 210 314 C201 304 195 297 188 288 C154 245 124 178 118 116 Z"/>
            </clipPath>
            <clipPath id="bottomBowlClip">
              <path d="M188 348 C195 339 201 332 210 322 C219 332 225 339 232 348 C266 391 296 458 302 520 H118 C124 458 154 391 188 348 Z"/>
            </clipPath>
          </defs><!-- outer frame -->
      <g fill="none" stroke="url(#metal)">
        <path d="M86 30 H334" stroke-width="16" stroke-linecap="round"/>
        <path d="M78 612 H342" stroke-width="16" stroke-linecap="round"/>
        <path d="M112 28 C106 78 106 562 112 612" stroke-width="8" opacity=".96"/>
        <path d="M308 28 C314 78 314 562 308 612" stroke-width="8" opacity=".96"/>
        <path d="M70 38 C72 92 72 548 70 602" stroke-width="4" opacity=".85"/>
        <path d="M350 38 C348 92 348 548 350 602" stroke-width="4" opacity=".85"/>
        <circle cx="112" cy="170" r="8" fill="url(#metal)"/>
        <circle cx="308" cy="170" r="8" fill="url(#metal)"/>
        <circle cx="112" cy="470" r="8" fill="url(#metal)"/>
        <circle cx="308" cy="470" r="8" fill="url(#metal)"/>
      </g>

      <!-- bowls outline -->
      <g fill="rgba(255,255,255,.02)" stroke="rgba(235,245,255,.75)" stroke-width="4">
        <path d="M118 116 H302 C296 178 266 245 232 288 C225 297 219 304 210 314 C201 304 195 297 188 288 C154 245 124 178 118 116 Z"/>
        <path d="M188 348 C195 339 201 332 210 322 C219 332 225 339 232 348 C266 391 296 458 302 520 H118 C124 458 154 391 188 348 Z"/>
      </g>

      <!-- glass reflections -->
      <g opacity=".48" stroke="white" stroke-width="3" fill="none">
        <path d="M140 132 C134 186 162 244 188 276"/>
        <path d="M286 132 C292 186 264 244 238 276"/>
        <path d="M150 510 C146 470 168 408 196 370"/>
        <path d="M270 510 C274 470 252 408 224 370"/>
      </g>

      <!-- top sand -->
      <g clip-path="url(#topBowlClip)">
        <path id="topSand" fill="url(#sandGrad)" filter="url(#softGlow)" d="M136 190 C162 176 194 168 210 168 C226 168 258 176 284 190 L284 314 L136 314 Z"/>
        <ellipse cx="210" cy="186" rx="76" ry="18" fill="rgba(220,250,255,.55)"/>
      </g>

      <!-- bottom sand -->
      <g clip-path="url(#bottomBowlClip)">
        <path id="bottomSand" fill="url(#sandGrad)" filter="url(#softGlow)" d="M126 520 C146 505 178 498 210 498 C242 498 274 505 294 520 L294 520 L126 520 Z"/>
        <ellipse id="bottomGlow" cx="210" cy="516" rx="82" ry="24" fill="rgba(220,250,255,.42)"/>
      </g>

      <!-- falling stream -->
      <g id="streamGroup" filter="url(#softGlow)">
        <rect id="stream" x="206" y="300" width="8" height="118" rx="4" fill="url(#sandGrad)"/>
        <circle id="drop1" cx="210" cy="370" r="7" fill="#a2ebff"/>
        <circle id="drop2" cx="210" cy="404" r="5" fill="#8bdfff" opacity=".85"/>
      </g>

      <!-- center crystal accent -->
      <g transform="translate(210 322)">
        <path d="M0 -13 L11 0 L0 13 L-11 0 Z" fill="rgba(182,242,255,.85)" stroke="rgba(255,255,255,.92)" stroke-width="2"/>
      </g>
    </svg>
  </div>
</section>

<section class="right">
  <p class="headline-top">Pronto para</p>
  <h1 class="headline-main">MyDrugs 2.0?</h1>

  <div class="countdown" aria-live="polite" aria-atomic="true">
    <div class="unit">
      <div class="value" id="days">00</div>
      <div class="label">D</div>
    </div>
    <div class="dots">:</div>
    <div class="unit">
      <div class="value" id="hours">00</div>
      <div class="label">H</div>
    </div>
    <div class="dots">:</div>
    <div class="unit">
      <div class="value" id="minutes">00</div>
      <div class="label">M</div>
    </div>
    <div class="dots">:</div>
    <div class="unit">
      <div class="value" id="seconds">00</div>
      <div class="label">S</div>
    </div>
  </div>

  <p class="coming" id="statusText">Em breve!</p>
  <div class="date-line" id="dateLine">Lançamento: 30 de junho de 2026 às 20h</div>
</section>

  </main>  <script>
    (function(){
      const target = new Date('2026-06-30T20:00:00-03:00');
      const launchStart = new Date('2026-03-12T00:00:00-03:00');

      const daysEl = document.getElementById('days');
      const hoursEl = document.getElementById('hours');
      const minutesEl = document.getElementById('minutes');
      const secondsEl = document.getElementById('seconds');
      const statusText = document.getElementById('statusText');

      const topSand = document.getElementById('topSand');
      const bottomSand = document.getElementById('bottomSand');
      const bottomGlow = document.getElementById('bottomGlow');
      const stream = document.getElementById('stream');
      const drop1 = document.getElementById('drop1');
      const drop2 = document.getElementById('drop2');
      const streamGroup = document.getElementById('streamGroup');

      function pad(n){ return String(n).padStart(2, '0'); }
      function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
      function lerp(a,b,t){ return a + (b-a)*t; }

      function updateSand(progress){
        const p = clamp(progress, 0, 1);
        const remaining = 1 - p;

        const topY = lerp(304, 166, remaining);
        const topRx = lerp(18, 78, remaining);
        topSand.setAttribute(
          'd',
          `M ${210 - topRx} ${topY + 18} C ${210 - topRx*0.72} ${topY + 4} ${210 - 28} ${topY} 210 ${topY} C ${210 + 28} ${topY} ${210 + topRx*0.72} ${topY + 4} ${210 + topRx} ${topY + 18} L ${210 + topRx} 314 L ${210 - topRx} 314 Z`
        );

        const bottomY = lerp(520, 440, p);
        const bottomRx = lerp(0, 86, p);
        bottomSand.setAttribute(
          'd',
          `M ${210 - bottomRx} 520 C ${210 - bottomRx*0.78} ${bottomY + 12} ${210 - 34} ${bottomY} 210 ${bottomY} C ${210 + 34} ${bottomY} ${210 + bottomRx*0.78} ${bottomY + 12} ${210 + bottomRx} 520 L ${210 + bottomRx} 520 L ${210 - bottomRx} 520 Z`
        );
        bottomGlow.setAttribute('cy', String(bottomY + 16));
        bottomGlow.setAttribute('rx', String(lerp(8, 84, p)));

        const finished = p >= 0.9999;
        streamGroup.style.opacity = finished ? '0' : '1';
      }

      function updateCountdown(){
        const now = new Date();
        let diff = target.getTime() - now.getTime();

        if (diff <= 0){
          daysEl.textContent = '00';
          hoursEl.textContent = '00';
          minutesEl.textContent = '00';
          secondsEl.textContent = '00';
          statusText.textContent = 'Chegou a hora!';
          updateSand(1);
          return;
        }

        const days = Math.floor(diff / 86400000);
        diff -= days * 86400000;
        const hours = Math.floor(diff / 3600000);
        diff -= hours * 3600000;
        const minutes = Math.floor(diff / 60000);
        diff -= minutes * 60000;
        const seconds = Math.floor(diff / 1000);

        daysEl.textContent = pad(days);
        hoursEl.textContent = pad(hours);
        minutesEl.textContent = pad(minutes);
        secondsEl.textContent = pad(seconds);
        statusText.textContent = 'Em breve!';

        const total = target.getTime() - launchStart.getTime();
        const elapsed = now.getTime() - launchStart.getTime();
        updateSand(total > 0 ? elapsed / total : 0);
      }

      let t = 0;
      function animateDrops(){
        t += 0.03;
        const y1 = 332 + ((Math.sin(t * 1.1) + 1) * 0.5) * 78;
        const y2 = 352 + ((Math.sin((t + 1.9) * 1.25) + 1) * 0.5) * 58;
        drop1.setAttribute('cy', y1.toFixed(2));
        drop2.setAttribute('cy', y2.toFixed(2));
        stream.setAttribute('height', (120 + Math.sin(t) * 6).toFixed(2));
        requestAnimationFrame(animateDrops);
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
      animateDrops();
    })();
  </script></body>
</html>
