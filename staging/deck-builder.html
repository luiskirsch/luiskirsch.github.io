<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://firebasestorage.googleapis.com https://storage.googleapis.com; connect-src 'self' https://osl-video-server-production.up.railway.app https://osl-video-server-staging.up.railway.app https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebasestorage.googleapis.com; font-src 'self'; object-src 'none'; base-uri 'self'; frame-src 'none'; worker-src 'self' blob:;">
<link rel="preconnect" href="https://www.googleapis.com">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://firestore.googleapis.com">
<link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com">  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Construtor de Deck — SEXTOLUGAR</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0907;
      --surface: #1a1208;
      --border: rgba(200,150,60,.22);
      --fg: #f0e8d8;
      --muted: #8a7a6a;
      --gold: #c89630;
      --green: #60b860;
      --red: #c05050;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,6,2,.7);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header__logo {
      font-size: 13px;
      letter-spacing: .12em;
      color: var(--gold);
      text-transform: uppercase;
      text-decoration: none;
    }
    .header__title {
      font-size: 16px;
      letter-spacing: .08em;
      color: var(--fg);
    }
    .header__xp {
      font-size: 12px;
      color: var(--green);
      letter-spacing: .06em;
    }

    /* ── Layout ── */
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 0;
      flex: 1;
      min-height: 0;
    }

    /* ── Sidebar ── */
    .sidebar {
      border-right: 1px solid var(--border);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .sidebar__heading {
      font-size: 11px;
      letter-spacing: .1em;
      color: var(--muted);
      text-transform: uppercase;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .deckList { display: flex; flex-direction: column; gap: 6px; }
    .deckItem {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      cursor: pointer;
      transition: background .2s, border-color .2s;
    }
    .deckItem:hover, .deckItem--active {
      background: rgba(200,150,60,.1);
      border-color: rgba(200,150,60,.5);
    }
    .deckItem__name { font-size: 14px; }
    .deckItem__count { font-size: 11px; color: var(--muted); }
    .deckItem__del {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      padding: 2px 6px;
      border-radius: 6px;
      transition: color .2s, background .2s;
    }
    .deckItem__del:hover { color: var(--red); background: rgba(200,80,80,.1); }

    .btn {
      background: rgba(200,150,60,.15);
      border: 1px solid rgba(200,150,60,.4);
      border-radius: var(--radius);
      color: var(--gold);
      font-size: 13px;
      padding: 10px 16px;
      cursor: pointer;
      letter-spacing: .05em;
      transition: background .2s, border-color .2s;
      width: 100%;
      text-align: center;
    }
    .btn:hover { background: rgba(200,150,60,.28); border-color: var(--gold); }
    .btn--green {
      background: rgba(80,180,80,.15);
      border-color: rgba(80,180,80,.4);
      color: var(--green);
    }
    .btn--green:hover { background: rgba(80,180,80,.28); border-color: var(--green); }
    .btn--disabled { opacity: .45; pointer-events: none; }

    /* ── Main ── */
    .main { display: flex; flex-direction: column; overflow: hidden; }

    .deckEditor {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .deckEditor__toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .deckEditor__nameInput {
      flex: 1;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--fg);
      font-size: 15px;
      padding: 8px 14px;
      font-family: inherit;
    }
    .deckEditor__nameInput:focus { outline: none; border-color: var(--gold); }
    .deckEditor__count { font-size: 12px; color: var(--muted); white-space: nowrap; }

    .deckEditor__body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex: 1;
      overflow: hidden;
    }

    .cardPool, .deckSlots {
      overflow-y: auto;
      padding: 16px;
    }
    .cardPool { border-right: 1px solid var(--border); }

    .sectionTitle {
      font-size: 11px;
      letter-spacing: .1em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .packGroup { margin-bottom: 20px; }
    .packGroup__name {
      font-size: 12px;
      color: var(--gold);
      letter-spacing: .08em;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .cardGrid { display: flex; flex-direction: column; gap: 6px; }

    .cardChip {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      transition: background .2s, border-color .2s;
      gap: 8px;
    }
    .cardChip:hover { background: rgba(200,150,60,.09); border-color: rgba(200,150,60,.4); }
    .cardChip--inDeck {
      background: rgba(80,180,80,.1);
      border-color: rgba(80,180,80,.4);
    }
    .cardChip__info { flex: 1; min-width: 0; }
    .cardChip__title { font-size: 13px; font-weight: 700; color: var(--fg); margin-bottom: 2px; }
    .cardChip__type { font-size: 11px; color: var(--muted); margin-bottom: 5px; }
    .cardChip__text { font-size: 12px; color: rgba(240,232,216,.72); line-height: 1.5; margin-bottom: 3px; }
    .cardChip__rule { font-size: 11px; color: var(--gold); font-style: italic; margin-top: 3px; line-height: 1.4; }
    .cardChip__effect { font-size: 10px; color: var(--gold); margin-top: 3px; }
    .cardChip__action {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: var(--muted);
      line-height: 1;
      padding: 2px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .cardChip--inDeck .cardChip__action { color: var(--red); }

    /* ── Cartas Personalizadas ── */
    .customSection { margin-bottom: 18px; }
    .customSection__header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 8px;
    }
    .customBadge {
      font-size: 10px; font-weight: 700; letter-spacing: .06em;
      background: rgba(140,100,220,.18); border: 1px solid rgba(140,100,220,.4);
      color: #b090e8; border-radius: 20px; padding: 2px 8px;
    }
    .customSlot {
      border-radius: 8px; margin-bottom: 6px;
      border: 1px solid rgba(140,100,220,.28);
      transition: border-color .15s, background .15s;
    }
    .customSlot--empty {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; cursor: pointer;
      border-style: dashed; color: rgba(240,232,216,.4);
      font-size: 13px;
    }
    .customSlot--empty:hover { border-color: rgba(140,100,220,.7); color: #b090e8; background: rgba(140,100,220,.08); }
    .customSlot__emptyIcon { font-size: 16px; }
    .customSlot--locked {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 14px; font-size: 12px;
      color: rgba(240,232,216,.25); border-color: rgba(255,255,255,.06);
    }
    .customSlot--filled { background: rgba(140,100,220,.06); }
    .customSlot--filled:hover { border-color: rgba(140,100,220,.55); }
    .customSlot__card { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; }
    .customSlot__actions { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
    .customSlot__actionBtn {
      appearance: none; background: none; border: 1px solid rgba(140,100,220,.3);
      color: #b090e8; font-size: 14px; cursor: pointer; border-radius: 6px;
      width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .customSlot__actionBtn:hover { background: rgba(140,100,220,.2); }
    .customSlot__actionBtn--inDeck { border-color: var(--red); color: var(--red); }
    .customSlot__actionBtn--inDeck:hover { background: rgba(192,80,80,.15); }
    .customSlot--editing { padding: 12px; background: rgba(140,100,220,.07); }
    .customSlot__formLabel { font-size: 10px; letter-spacing: .1em; color: #b090e8; text-transform: uppercase; margin-bottom: 8px; }
    .customSlot__input {
      width: 100%; background: rgba(0,0,0,.35); border: 1px solid rgba(140,100,220,.3);
      border-radius: 6px; padding: 7px 10px; color: var(--fg); font-size: 13px;
      font-family: inherit; margin-bottom: 6px;
    }
    .customSlot__textarea {
      width: 100%; background: rgba(0,0,0,.35); border: 1px solid rgba(140,100,220,.3);
      border-radius: 6px; padding: 8px 10px; color: var(--fg); font-size: 13px;
      font-family: inherit; resize: vertical; min-height: 72px; margin-bottom: 6px;
    }
    .customSlot__input:focus, .customSlot__textarea:focus {
      outline: none; border-color: rgba(140,100,220,.7);
    }
    .customSlot__formBtns { display: flex; gap: 6px; margin-top: 4px; }

    .emptyState {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 40px 20px;
      line-height: 1.7;
    }

    /* ── Filter bar ── */
    .filterBar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .filterBtn {
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      padding: 4px 10px;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
    }
    .filterBtn--active {
      background: rgba(200,150,60,.18);
      border-color: rgba(200,150,60,.6);
      color: var(--gold);
    }

    /* ── XP / Level display ── */
    .xpBar {
      background: rgba(80,180,80,.08);
      border: 1px solid rgba(80,180,80,.2);
      border-radius: 999px;
      height: 6px;
      overflow: hidden;
    }
    .xpBar__fill {
      height: 100%;
      background: var(--green);
      border-radius: 999px;
      transition: width .5s ease;
    }
    .levelDisplay {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .levelDisplay__row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
    }

    /* ── No deck selected ── */
    .noDeckState {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      color: var(--muted);
      gap: 16px;
      padding: 40px;
      text-align: center;
    }
    .noDeckState__icon { font-size: 48px; }
    .noDeckState__text { font-size: 14px; line-height: 1.7; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(40,160,80,.9);
      color: #fff;
      font-size: 14px;
      padding: 10px 20px;
      border-radius: 999px;
      opacity: 0;
      transition: opacity .3s, transform .3s;
      pointer-events: none;
      z-index: 9999;
    }
    .toast--visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast--error { background: rgba(200,60,60,.9); }

    @media (max-width: 700px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
      .deckEditor__body { grid-template-columns: 1fr; }
      .cardPool { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>

<header class="header">

<link rel="preconnect" href="https://www.googleapis.com">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://firestore.googleapis.com">
<link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com">  <a href="sala.html" class="header__logo">← SEXTOLUGAR</a>
  <span class="header__title">Construtor de Deck</span>
  <span class="header__xp" id="headerXp">Carregando...</span>
</header>

<div class="layout">
  <!-- Sidebar: lista de decks -->
  <aside class="sidebar">
    <div class="sidebar__heading">Meus Decks</div>
    <div class="deckList" id="deckList">
      <div class="emptyState">Nenhum deck criado ainda.</div>
    </div>
    <button class="btn" id="newDeckBtn">+ Novo Deck</button>

    <div style="margin-top:auto; padding-top:20px;">
      <div class="sidebar__heading" style="margin-bottom:10px;">Seu Nível</div>
      <div class="levelDisplay">
        <div class="levelDisplay__row">
          <span id="levelLabel">Nível 1</span>
          <span id="xpLabel">0 XP</span>
        </div>
        <div class="xpBar"><div class="xpBar__fill" id="xpBarFill" style="width:0%"></div></div>
        <div class="levelDisplay__row">
          <span></span>
          <span id="xpNextLabel" style="color:var(--muted)">próx: 50 XP</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main: editor de deck -->
  <main class="main" id="mainArea">
    <div class="noDeckState">
      <span class="noDeckState__icon">🃏</span>
      <p class="noDeckState__text">
        Selecione um deck na lista<br>ou crie um novo para começar.
      </p>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import {
    getFirestore, doc, getDoc, getDocs, setDoc, deleteDoc,
    collection, addDoc, onSnapshot, serverTimestamp, query, orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC8sSvA7_1HPYRFGFgdgzstkP_yQHadY-c",
    authDomain: "osextolugar-game.firebaseapp.com",
    projectId: "osextolugar-game",
    storageBucket: "osextolugar-game.firebasestorage.app",
    messagingSenderId: "592088391155",
    appId: "1:592088391155:web:c2e4f9fba44fb2c0b3e785"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  // ── Card data (espelhado de sala.html) ─────────────────────────────────
  const BASIC_CARDS = [
    { type: "Ritual",   title: "O Observador",        text: "Todos olham para a câmera em silêncio por 30 segundos. Depois, cada um diz em uma palavra o que sentiu.", rule: "Quem sorrir ou desviar o olhar perde a vez de falar.", phrase: "O silêncio revela mais do que as palavras." },
    { type: "Suspeita", title: "Primeiro Suspeito",   text: "O anfitrião aponta: quem nesta sala parece estar escondendo algo? Cada jogador responde em 15 segundos.", rule: "O mais citado deve confirmar ou negar — com honestidade.", phrase: "Suspeita sem prova ainda é suspeita." },
    { type: "Confissão",title: "Confissão Forçada",   text: "Um voluntário revela algo desconfortável, real e que nunca contou ao grupo. O grupo ouve sem interromper.", phrase: "Coragem é falar mesmo com medo." },
    { type: "Decisão",  title: "Decisão Coletiva",    text: "O grupo tem 60 segundos para decidir: revelar um segredo agora ou seguir em frente. Unanimidade obrigatória.", rule: "Se não houver consenso, o anfitrião decide sozinho." },
    { type: "Pressão",  title: "Pressão Real",        text: "O anfitrião escolhe um jogador. O grupo faz uma pergunta direta. A resposta deve ter no mínimo 3 frases.", rule: "Sem desviar. Sem 'não sei'. Sem ironia.", phrase: "Presença é o que sobra quando a defesa cai." },
    { type: "Voto",     title: "Voto da Sala",        text: "Todos votam: quem está sendo mais genuíno nesta sessão? O mais votado pode fazer uma pergunta a qualquer pessoa.", phrase: "Autenticidade se reconhece antes de ser nomeada." },
    { type: "Vínculo",  title: "Conexão Obrigatória", text: "O grupo escolhe dois jogadores. Eles têm 90 segundos para descobrir algo que ninguém mais sabe sobre ambos." },
    { type: "Tensão",   title: "Ruptura",             text: "Cada jogador nomeia alguém em quem confiaria menos para guardar um segredo. Sem amenizar.", rule: "O mais citado responde: 'Por que acham isso?'", phrase: "Confiança é lenta. Traição é instantânea." }
  ];

  const PACK_CARDS = {
    "pacote-conexao": [
      { type: "Conexão", title: "Memória que ficou",        text: "Cada jogador compartilha um momento com alguém desta sala que ainda lembra com nitidez.", rule: "Ninguém pode repetir o mesmo tipo de memória.", phrase: "O que fica não é o momento. É a sensação." },
      { type: "Conexão", title: "Primeira Impressão",       text: "O anfitrião escolhe um jogador. Os outros revelam, em 10 segundos cada, qual foi a primeira coisa que notaram nele.", rule: "O escolhido ouve tudo antes de reagir." },
      { type: "Conexão", title: "Obrigado",                 text: "Alguém precisa agradecer outra pessoa desta sala por algo que nunca disse em voz alta. Com detalhes.", phrase: "Gratidão não dita nunca chega." },
      { type: "Conexão", title: "Uma Só Palavra",           text: "Cada jogador escolhe uma palavra que descreve como se sente agora. Nenhuma explicação. Nenhum comentário.", subrule: "Quando todos falarem, observem os padrões." },
      { type: "Conexão", title: "Quem Eu Admiro",           text: "Sem revelar o nome, cada pessoa descreve alguém que admira nesta sala. O grupo tenta adivinhar de quem se trata.", rule: "O admirado confirma ou nega ser quem descreveram." },
      { type: "Conexão", title: "Ponto em Comum",           text: "O grupo tem 2 minutos para descobrir algo que todos têm em comum — mas que nunca foi dito antes nesta sala.", phrase: "O que nos une supera o que nos separa." },
      { type: "Conexão", title: "Carta Aberta",             text: "Um voluntário formula uma frase que gostaria de dizer a alguém desta sala — e então diz em voz alta, de verdade." },
      { type: "Conexão", title: "30 Segundos de Presença",  text: "Todos ficam em silêncio absoluto por 30 segundos, olhando para a câmera. Depois, cada um diz uma coisa que observou.", phrase: "Presença plena é o maior presente." },
      { type: "Conexão", title: "O Que Nos Une",            text: "O anfitrião aponta dois jogadores. Cada um diz algo que acredita ter em comum com o outro — sem combinar.", rule: "O outro confirma ou corrige com honestidade." },
      { type: "Conexão", title: "Apoio Visível",            text: "Cada jogador escreve no chat o nome de alguém da sala que mais precisa de apoio hoje. Sem explicações. Só os nomes.", phrase: "Ver alguém de verdade já é cuidado." },
      { type: "Conexão", title: "A Música da Sala",         text: "Se este grupo fosse uma música, qual seria? Cada um sugere uma e justifica em uma única frase." },
      { type: "Conexão", title: "Antes e Depois",           text: "Cada jogador completa: 'Antes de entrar aqui hoje eu estava... Agora estou...' Sem filtros.", phrase: "O encontro muda. Às vezes imperceptivelmente." }
    ],
    "pacote-verdades": [
      { type: "Verdade", title: "Mentira Favorita",         text: "Cada jogador confessa uma pequena mentira que conta com frequência — e por que ainda conta.", rule: "O grupo pode fazer uma única pergunta de acompanhamento." },
      { type: "Verdade", title: "O Que Eu Evito",           text: "Um voluntário revela algo sobre si mesmo que evita abordar em conversas. Deve ser real e atual.", rule: "O grupo pode fazer apenas uma pergunta — sem desvio permitido." },
      { type: "Verdade", title: "Discordância Silenciosa",  text: "Há algo que você concorda publicamente mas discorda em privado? Quem tiver coragem fala agora.", phrase: "Silêncio pode ser a maior mentira." },
      { type: "Verdade", title: "Opinião Impopular",        text: "Cada jogador compartilha uma opinião que sabe que o grupo provavelmente não vai gostar de ouvir.", rule: "Ninguém pode responder imediatamente. Processem primeiro.", phrase: "A verdade incômoda vale mais." },
      { type: "Verdade", title: "Inveja Honesta",           text: "O anfitrião escolhe uma pessoa. Os outros revelam algo que invejam nela — sem elogios disfarçados.", rule: "O escolhido ouve em silêncio e depois diz o que sentiu." },
      { type: "Verdade", title: "O Que Não Disse",          text: "Houve algo que você pensou mas não disse durante esta sessão? Agora é sua última chance.", phrase: "As palavras não ditas costumam pesar mais." },

  // ── XP helpers ─────────────────────────────────────────────────────────
  function levelFromXP(xp) { return Math.floor(Math.sqrt(Math.max(0, xp) / 50)) + 1; }
  function xpForLevel(lv) { return Math.pow(lv - 1, 2) * 50; }
  function xpForNextLevel(lv) { return Math.pow(lv, 2) * 50; }

  const BACKEND_BASE_URL = "https://osl-video-server-production.up.railway.app";

  // ── State ──────────────────────────────────────────────────────────────
  let userId = null;
  let userDecks = [];       // [{id, name, cards:[]}]
  let activeDeckId = null;  // currently open in editor
  let deckCards = [];       // cards in the deck being edited
  let deckName = "";
  let filterType = "all";
  let customCards = [];     // [{id, slotIndex, title, text, rule}]
  let userXp = 0;
  let editingSlot = null;   // índice do slot em edição (null = nenhum)
  let _ownedPacks = null;   // Set populado pelo servidor; null = ainda carregando

  // Cartas disponíveis para o usuário — usa Set verificado pelo servidor
  function getOwnedCards() {
    const packs = _ownedPacks !== null ? [..._ownedPacks] : [];
    let cards = [...BASIC_CARDS];
    packs.forEach(p => { if (PACK_CARDS[p]) cards = cards.concat(PACK_CARDS[p]); });
    return cards;
  }

  function getUniqueTypes(cards) {
    return ["all", ...new Set(cards.map(c => c.type))];
  }

  // ── Firestore ──────────────────────────────────────────────────────────
  async function loadDecks(uid) {
    const snap = await getDocs(collection(db, "users", uid, "decks"));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }

  async function saveDeck(uid, deckId, name, cards) {
    const ref = deckId
      ? doc(db, "users", uid, "decks", deckId)
      : doc(collection(db, "users", uid, "decks"));
    await setDoc(ref, { name, cards, updatedAt: serverTimestamp() }, { merge: true });
    return ref.id;
  }

  async function deleteDeck(uid, deckId) {
    await deleteDoc(doc(db, "users", uid, "decks", deckId));
  }

  // ── Custom Cards ───────────────────────────────────────────────────────
  function customSlotCount() {
    return Math.floor(levelFromXP(userXp) / 10) + 1;
  }

  function escHtml(s) {
    return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  async function loadCustomCards(uid) {
    const snap = await getDocs(collection(db, "users", uid, "customCards"));
    customCards = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a,b) => (a.slotIndex||0) - (b.slotIndex||0));
  }

  async function persistCustomCard(uid, slotIndex, data) {
    const existing = customCards.find(c => c.slotIndex === slotIndex);
    const r = existing
      ? doc(db, "users", uid, "customCards", existing.id)
      : doc(collection(db, "users", uid, "customCards"));
    const payload = { slotIndex, type: "Pessoal", isCustom: true, ...data };
    await setDoc(r, payload, { merge: true });
    if (existing) {
      Object.assign(existing, payload);
    } else {
      customCards.push({ id: r.id, ...payload });
      customCards.sort((a,b) => (a.slotIndex||0) - (b.slotIndex||0));
    }
  }

  function renderCustomSection() {
    const el = document.getElementById("customSectionArea");
    if (!el) return;

    const slots = customSlotCount();
    const deckTitles = new Set(deckCards.map(c => c.title));

    let html = `
      <div class="customSection">
        <div class="customSection__header">
          <div class="sectionTitle" style="margin:0">Cartas Pessoais</div>
          <span class="customBadge">${slots} slot${slots !== 1 ? "s" : ""}</span>
        </div>`;

    for (let i = 0; i < 10; i++) {
      const card = customCards.find(c => c.slotIndex === i);
      const unlocked = i < slots;

      if (!unlocked) {
        const neededLevel = i * 10;
        html += `<div class="customSlot customSlot--locked">🔒 Slot ${i+1} — Disponível no Nível ${neededLevel}</div>`;
        continue;
      }

      if (editingSlot === i) {
        const t  = escHtml(card?.title || "");
        const tx = escHtml(card?.text  || "");
        const ru = escHtml(card?.rule  || "");
        html += `
          <div class="customSlot customSlot--editing">
            <div class="customSlot__formLabel">Slot ${i+1} — Carta Pessoal</div>
            <input  class="customSlot__input"    id="cs_title_${i}" placeholder="Título da carta" value="${t}">
            <textarea class="customSlot__textarea" id="cs_text_${i}"  placeholder="O que acontece quando esta carta é revelada no ritual?">${tx}</textarea>
            <input  class="customSlot__input"    id="cs_rule_${i}"  placeholder="Regra especial (opcional)" value="${ru}">
            <div class="customSlot__formBtns">
              <button class="btn btn--green" style="flex:1;padding:7px" onclick="saveCustomSlot(${i})">Salvar</button>
              <button class="btn" style="flex:0;padding:7px 14px"       onclick="cancelCustomEdit()">Cancelar</button>
            </div>
          </div>`;
      } else if (card?.text) {
        const inDeck = card.title && deckTitles.has(card.title);
        html += `
          <div class="customSlot customSlot--filled">
            <div class="customSlot__card">
              <div class="cardChip__info">
                <div class="cardChip__title">${escHtml(card.title || "Carta Pessoal")}</div>
                <div class="cardChip__type">Pessoal · Slot ${i+1}</div>
                <div class="cardChip__text">${escHtml(card.text)}</div>
                ${card.rule ? `<div class="cardChip__rule">⚠ ${escHtml(card.rule)}</div>` : ""}
              </div>
              <div class="customSlot__actions">
                <button class="customSlot__actionBtn" title="Editar" onclick="editCustomSlot(${i})">✏</button>
                <button class="customSlot__actionBtn${inDeck ? " customSlot__actionBtn--inDeck" : ""}"
                  title="${inDeck ? "Remover do deck" : "Adicionar ao deck"}"
                  onclick="toggleCustomCard(${i})">${inDeck ? "−" : "+"}</button>
              </div>
            </div>
          </div>`;
      } else {
        html += `
          <div class="customSlot customSlot--empty" onclick="editCustomSlot(${i})">
            <span class="customSlot__emptyIcon">✦</span>
            <span>Slot ${i+1} — Criar carta pessoal</span>
          </div>`;
      }
    }

    html += `</div>`;
    el.innerHTML = html;
  }

  window.editCustomSlot = function(i) {
    editingSlot = i;
    renderCustomSection();
    setTimeout(() => document.getElementById(`cs_title_${i}`)?.focus(), 40);
  };

  window.cancelCustomEdit = function() {
    editingSlot = null;
    renderCustomSection();
  };

  window.saveCustomSlot = async function(i) {
    const title = (document.getElementById(`cs_title_${i}`)?.value || "").trim();
    const text  = (document.getElementById(`cs_text_${i}`)?.value  || "").trim();
    const rule  = (document.getElementById(`cs_rule_${i}`)?.value  || "").trim();
    if (!title) { showToast("Dê um título à carta.", true); return; }
    if (!text)  { showToast("Escreva o conteúdo da carta.", true); return; }
    try {
      await persistCustomCard(userId, i, { title, text, rule });
      editingSlot = null;
      renderCustomSection();
      showToast("Carta salva!");
    } catch(e) {
      console.error(e);
      showToast("Erro ao salvar.", true);
    }
  };

  window.toggleCustomCard = function(i) {
    const card = customCards.find(c => c.slotIndex === i);
    if (!card?.text) return;
    const cardObj = {
      title: card.title || "Carta Pessoal",
      text: card.text, rule: card.rule || "",
      type: "Pessoal", isCustom: true
    };
    const idx = deckCards.findIndex(c => c.isCustom && c.title === cardObj.title);
    if (idx >= 0) deckCards.splice(idx, 1);
    else deckCards.push(cardObj);
    renderCustomSection();
    // atualiza só o painel direito sem destruir o formulário
    const deckGrid = document.getElementById("deckCardGrid");
    const countEl  = document.querySelector(".deckEditor__count");
    if (countEl) countEl.textContent = `${deckCards.length} carta(s)`;
    if (deckGrid) {
      deckGrid.innerHTML = deckCards.length === 0
        ? `<div class="emptyState">Adicione cartas do painel esquerdo.</div>`
        : deckCards.map(c => `
            <div class="cardChip cardChip--inDeck" onclick="removeCard('${escHtml(c.title).replace(/'/g,"\\'")}')">
              <div class="cardChip__info">
                <div class="cardChip__title">${escHtml(c.title)}</div>
                <div class="cardChip__type">${escHtml(c.type)}</div>
                ${c.text ? `<div class="cardChip__text">${escHtml(c.text)}</div>` : ""}
              </div>
              <button class="cardChip__action" title="Remover">−</button>
            </div>`).join("");
    }
  };

  // ── UI ─────────────────────────────────────────────────────────────────
  function showToast(msg, isError = false) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.toggle("toast--error", isError);
    el.classList.add("toast--visible");
    setTimeout(() => el.classList.remove("toast--visible"), 2000);
  }

  function renderXP(xp = 0) {
    const lv = levelFromXP(xp);
    const curr = xpForLevel(lv);
    const next = xpForNextLevel(lv);
    const pct = next > curr ? Math.round((xp - curr) / (next - curr) * 100) : 100;
    document.getElementById("levelLabel").textContent = `Nível ${lv}`;
    document.getElementById("xpLabel").textContent = `${xp} XP`;
    document.getElementById("xpBarFill").style.width = `${pct}%`;
    document.getElementById("xpNextLabel").textContent = `próx: ${next} XP`;
    document.getElementById("headerXp").textContent = `Nível ${lv} · ${xp} XP`;
  }

  function renderDeckList() {
    const el = document.getElementById("deckList");
    if (!userDecks.length) {
      el.innerHTML = `<div class="emptyState">Nenhum deck criado ainda.</div>`;
      return;
    }
    el.innerHTML = userDecks.map(d => `
      <div class="deckItem${activeDeckId === d.id ? " deckItem--active" : ""}"
           onclick="openDeck('${d.id}')">
        <div>
          <div class="deckItem__name">${d.name || "Sem nome"}</div>
          <div class="deckItem__count">${(d.cards || []).length} cartas</div>
        </div>
        <button class="deckItem__del" title="Deletar deck"
          onclick="event.stopPropagation();confirmDeleteDeck('${d.id}')">×</button>
      </div>
    `).join("");
  }

  function renderEditor() {
    const main = document.getElementById("mainArea");
    const deck = userDecks.find(d => d.id === activeDeckId);
    if (!deck && activeDeckId !== "__new__") {
      main.innerHTML = `
        <div class="deckEditor">
          <div class="deckEditor__body" style="display:block;padding:20px">
            <div id="customSectionArea"></div>
            <div class="noDeckState" style="margin-top:24px">
              <span class="noDeckState__icon">🃏</span>
              <p class="noDeckState__text">Selecione um deck na lista<br>ou crie um novo para começar.</p>
            </div>
          </div>
        </div>`;
      renderCustomSection();
      return;
    }

    const owned = getOwnedCards();
    const types = getUniqueTypes(owned);
    const deckTitles = new Set(deckCards.map(c => c.title));
    const filtered = filterType === "all" ? owned : owned.filter(c => c.type === filterType);

    main.innerHTML = `
      <div class="deckEditor">
        <div class="deckEditor__toolbar">
          <input class="deckEditor__nameInput" id="deckNameInput" placeholder="Nome do deck"
            value="${deckName}" oninput="deckNameChanged(this.value)">
          <span class="deckEditor__count">${deckCards.length} carta(s)</span>
          <button class="btn btn--green" style="width:auto;padding:8px 18px" onclick="saveCurrent()">Salvar</button>
        </div>
        <div class="deckEditor__body">
          <div class="cardPool">
            <div id="customSectionArea"></div>
            <div class="sectionTitle">Cartas disponíveis</div>
            <div class="filterBar">
              ${types.map(t => `
                <button class="filterBtn${filterType === t ? " filterBtn--active" : ""}"
                  onclick="setFilter('${t}')">
                  ${t === "all" ? "Todas" : t}
                </button>`).join("")}
            </div>
            <div class="cardGrid">
              ${filtered.map(card => `
                <div class="cardChip${deckTitles.has(card.title) ? " cardChip--inDeck" : ""}"
                     onclick="toggleCard(${JSON.stringify(card).replace(/"/g, '&quot;')})">
                  <div class="cardChip__info">
                    <div class="cardChip__title">${card.title}</div>
                    <div class="cardChip__type">${card.type}</div>
                    ${card.text ? `<div class="cardChip__text">${card.text}</div>` : ""}
                    ${card.rule ? `<div class="cardChip__rule">⚠ ${card.rule}</div>` : ""}
                    ${CARD_EFFECT_LABELS[card.title] ? `<div class="cardChip__effect">${CARD_EFFECT_LABELS[card.title]}</div>` : ""}
                  </div>
                  <button class="cardChip__action" title="${deckTitles.has(card.title) ? "Remover" : "Adicionar"}">
                    ${deckTitles.has(card.title) ? "−" : "+"}
                  </button>
                </div>`).join("")}
            </div>
          </div>
          <div class="deckSlots">
            <div class="sectionTitle">No deck (${deckCards.length})</div>
            <div class="cardGrid" id="deckCardGrid">
              ${deckCards.length === 0
                ? `<div class="emptyState">Adicione cartas do painel esquerdo.</div>`
                : deckCards.map(card => `
                  <div class="cardChip cardChip--inDeck"
                       onclick="removeCard('${card.title.replace(/'/g,"\\'")}')">
                    <div class="cardChip__info">
                      <div class="cardChip__title">${card.title}</div>
                      <div class="cardChip__type">${card.type}</div>
                      ${card.text ? `<div class="cardChip__text">${card.text}</div>` : ""}
                      ${card.rule ? `<div class="cardChip__rule">⚠ ${card.rule}</div>` : ""}
                      ${CARD_EFFECT_LABELS[card.title] ? `<div class="cardChip__effect">${CARD_EFFECT_LABELS[card.title]}</div>` : ""}
                    </div>
                    <button class="cardChip__action" title="Remover">−</button>
                  </div>`).join("")}
            </div>
          </div>
        </div>
      </div>`;
    renderCustomSection();
  }

  // ── Actions ────────────────────────────────────────────────────────────
  window.openDeck = function(id) {
    const deck = userDecks.find(d => d.id === id);
    if (!deck) return;
    activeDeckId = id;
    deckCards = [...(deck.cards || [])];
    deckName = deck.name || "";
    filterType = "all";
    renderDeckList();
    renderEditor();
  };

  window.deckNameChanged = function(val) { deckName = val; };

  window.setFilter = function(type) {
    filterType = type;
    renderEditor();
  };

  window.toggleCard = function(card) {
    const idx = deckCards.findIndex(c => c.title === card.title);
    if (idx >= 0) {
      deckCards.splice(idx, 1);
    } else {
      deckCards.push(card);
    }
    renderEditor();
  };

  window.removeCard = function(title) {
    deckCards = deckCards.filter(c => c.title !== title);
    renderEditor();
  };

  window.saveCurrent = async function() {
    if (!userId) return showToast("Você precisa estar logado.", true);
    if (!deckName.trim()) return showToast("Dê um nome ao deck.", true);
    try {
      const id = await saveDeck(userId, activeDeckId === "__new__" ? null : activeDeckId, deckName.trim(), deckCards);
      userDecks = await loadDecks(userId);
      activeDeckId = id;
      renderDeckList();
      renderEditor();
      showToast("Deck salvo!");
    } catch(e) {
      console.error(e);
      showToast("Erro ao salvar.", true);
    }
  };

  window.confirmDeleteDeck = async function(id) {
    if (!confirm("Deletar este deck?")) return;
    try {
      await deleteDeck(userId, id);
      userDecks = userDecks.filter(d => d.id !== id);
      if (activeDeckId === id) { activeDeckId = null; deckCards = []; deckName = ""; }
      renderDeckList();
      renderEditor();
      showToast("Deck deletado.");
    } catch(e) {
      showToast("Erro ao deletar.", true);
    }
  };

  document.getElementById("newDeckBtn").addEventListener("click", () => {
    activeDeckId = "__new__";
    deckCards = [];
    deckName = "";
    filterType = "all";
    userDecks = userDecks.map(d => ({ ...d })); // reset active highlight
    renderDeckList();
    renderEditor();
  });

  // ── Auth ───────────────────────────────────────────────────────────────
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "login.html";
      return;
    }
    userId = user.uid;

    // Busca compras verificadas pelo servidor antes de renderizar
    try {
      const idToken = await user.getIdToken();
      const r = await fetch(BACKEND_BASE_URL + "/minhas-compras", { headers: { "Authorization": "Bearer " + idToken } });
      if (r.ok) {
        const d = await r.json();
        _ownedPacks = new Set((Array.isArray(d.compras) ? d.compras : []).map(c => c.produto));
      }
    } catch (_) { _ownedPacks = new Set(); }

    const userSnap = await getDoc(doc(db, "users", userId));
    const userData = userSnap.data() || {};
    userXp = userData.xp || 0;
    renderXP(userXp);

    await loadCustomCards(userId);
    userDecks = await loadDecks(userId);
    renderDeckList();
    renderEditor();
  });
</script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
