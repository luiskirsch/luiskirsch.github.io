<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Prelúdio Jogos — O SextoLugar</title>

<link rel="icon" href="./favicon.png">
<meta name="theme-color" content="#050505" />

<style>
:root{
--bg:#050505;
--gold:#e6c07b;
--muted:#a7a7a7;
--shadow:rgba(0,0,0,.55);
--ok:#9be37a;
}

*{box-sizing:border-box;}
body{
margin:0;
min-height:100vh;
display:grid;
place-items:center;
padding:24px;
background:
radial-gradient(1200px 700px at 50% 20%, rgba(230,192,123,.10), transparent 55%),
radial-gradient(900px 560px at 18% 15%, rgba(255,255,255,.06), transparent 60%),
var(--bg);
color:#f2f2f2;
font-family:Georgia,serif;
}

.wrap{max-width:980px;width:100%;text-align:center;}

h1{
margin:0;
letter-spacing:.20em;
text-transform:uppercase;
color:var(--gold);
font-size:clamp(30px,6vw,78px);
text-shadow:0 18px 60px var(--shadow);
}

.subtitle{
margin-top:10px;
opacity:.9;
}

.card{
margin-top:30px;
padding:28px;
border-radius:20px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(10px);
}

input{
width:100%;
padding:12px;
margin-top:6px;
border-radius:14px;
border:1px solid rgba(255,255,255,.1);
background:rgba(0,0,0,.25);
color:white;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

button{
margin-top:15px;
padding:12px 18px;
border-radius:14px;
border:1px solid rgba(230,192,123,.3);
background:rgba(0,0,0,.3);
color:var(--gold);
cursor:pointer;
letter-spacing:.1em;
text-transform:uppercase;
}

.secondary{
border-color:rgba(255,255,255,.15);
color:#ddd;
}

.status{
margin-top:10px;
font-size:13px;
opacity:.7;
}

.status.ok{color:var(--ok);}

.footer{
margin-top:30px;
font-size:11px;
opacity:.5;
letter-spacing:.12em;
text-transform:uppercase;
}

@media(max-width:600px){
.grid{grid-template-columns:1fr;}
button{width:100%;}
}
</style>
</head>

<body>
<main class="wrap">

<h1>PRELÚDIO JOGOS</h1>
<p class="subtitle">Uma experiência psicológica em cartas físicas.</p>

<section class="card">

<form id="leadForm" action="https://formsubmit.co/luiskirsch22@hotmail.com" method="POST">

<input type="hidden" name="_subject" value="Novo lead — Prelúdio Jogos">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_next" value="./index.html?ok=1">

<div class="grid">
<div>
<label>Nome</label>
<input type="text" name="Nome" required>
</div>

<div>
<label>E-mail</label>
<input type="email" name="Email" required>
</div>
</div>

<p class="status" id="statusLead">Status: aguardando seu e-mail.</p>

<button type="submit">Entrar na lista</button>
<button type="button" id="btnEntrada" class="secondary">Acessar a entrada</button>

</form>
</section>

<footer class="footer">
© 2026 PRELÚDIO JOGOS™ · O SEXTOLUGAR™
</footer>

</main>

<script>
document.getElementById("btnEntrada").addEventListener("click",()=>{
window.location.href="./entrada.html";
});

const params=new URLSearchParams(window.location.search);
if(params.get("ok")==="1"){
const status=document.getElementById("statusLead");
status.textContent="Status: você entrou na lista. Bem-vindo.";
status.classList.add("ok");
history.replaceState({},document.title,"./index.html");
}
</script>

</body>
</html>
