<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  height: 100%;
  background: #000;
  overflow: hidden;
}

body {
  height: 100svh;
  height: 100vh;
  overflow: hidden;
  overscroll-behavior: none;
  color: #f5f7fb;
  font-family: 'Sora', system-ui, -apple-system, sans-serif;
  -webkit-text-size-adjust: 100%;
  background:
    radial-gradient(ellipse 90% 55% at 50% -5%,  rgba(38,118,240,.16), transparent 52%),
    radial-gradient(ellipse 55% 45% at 12% 88%,  rgba(18, 80,180,.10), transparent 52%),
    radial-gradient(ellipse 45% 35% at 88% 72%,  rgba(28, 90,200,.07), transparent 50%),
    linear-gradient(175deg, #050810 0%, #020408 40%, #000000 100%);
}

/* Vignette */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse 110% 110% at 50% 50%, transparent 38%, rgba(0,0,0,.62) 100%);
  z-index: 0;
}

/* Top/bottom edge glow */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(180deg,
      rgba(255,255,255,.025) 0%,
      transparent 14%,
      transparent 86%,
      rgba(255,255,255,.018) 100%
    );
  mix-blend-mode: screen;
  z-index: 0;
}

/* ─── Animações ─── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0);    }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

@keyframes pulseGlow {
  0%, 100% { box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 8px 32px rgba(0,0,0,.28); }
  50%       { box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 8px 32px rgba(0,0,0,.28), 0 0 18px rgba(72,183,244,.08); }
}

@keyframes progressShimmer {
  from { background-position: -200% center; }
  to   { background-position: 200% center;  }
}

/* ─── Layout ─── */
.page {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100svh;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding:
    max(20px, env(safe-area-inset-top))
    max(22px, env(safe-area-inset-right))
    max(20px, env(safe-area-inset-bottom))
    max(22px, env(safe-area-inset-left));
  overflow: hidden;
  gap: clamp(6px, 1.4vh, 14px);
}

/* ─── Eyebrow ─── */
.eyebrow {
  font-size: clamp(15px, 1.7vh, 24px);
  font-weight: 600;
  letter-spacing: .06em;
  color: rgba(210,224,248,.65);
  animation: fadeUp .55s cubic-bezier(.22,1,.36,1) .05s both;
  margin-bottom: clamp(8px, 1.6vh, 20px);
}

/* ─── Título ─── */
.title {
  line-height: 1;
  font-weight: 900;
  text-align: center;
  animation: fadeUp .60s cubic-bezier(.22,1,.36,1) .12s both;
}

.title .line1 {
  display: block;
  font-size: clamp(26px, 3.6vh, 50px);
  font-weight: 700;
  letter-spacing: -.01em;
  color: rgba(245,247,251,.85);
}

.title .line2 {
  display: block;
  /* Limitado também pela largura: em celular alto e estreito o "SEXTOLUGAR?"
     ficava mais largo que a tela e era cortado nas bordas. */
  font-size: clamp(30px, min(7.8vh, 11.5vw), 108px);
  font-weight: 900;
  letter-spacing: -.03em;
  line-height: 1;
  background: linear-gradient(175deg, #ffffff 0%, #e8effd 40%, #c8daf5 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: none;
  padding: 0 4px; /* evita clip nas laterais */
}

/* ─── Grid countdown ─── */
.countdown {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: clamp(8px, 1.2vw, 14px);
  width: min(100%, 660px);
  animation: fadeUp .65s cubic-bezier(.22,1,.36,1) .22s both;
}

.time-box {
  border-radius: clamp(16px, 2vw, 22px);
  padding: clamp(12px, 1.8vh, 20px) clamp(8px, 1.2vw, 14px) clamp(10px, 1.5vh, 16px);
  background:
    linear-gradient(160deg, rgba(255,255,255,.052), rgba(255,255,255,.016)),
    radial-gradient(circle at 50% 0%, rgba(90,170,255,.08), transparent 58%);
  border: 1px solid rgba(255,255,255,.09);
  text-align: center;
  animation: pulseGlow 4s ease-in-out infinite;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

.time-value {
  display: block;
  font-size: clamp(32px, 5.8vh, 76px);
  font-weight: 900;
  letter-spacing: -.06em;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  background: linear-gradient(180deg, #ffffff 0%, #ddeeff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.time-label {
  display: block;
  margin-top: clamp(4px, .7vh, 8px);
  font-size: clamp(9px, 1.1vh, 12px);
  letter-spacing: .24em;
  text-transform: uppercase;
  color: rgba(200,218,245,.65);
  font-weight: 700;
}

/* ─── Status ─── */
.soon {
  font-size: clamp(24px, 4.5vh, 62px);
  font-weight: 900;
  letter-spacing: -.03em;
  animation: fadeUp .65s cubic-bezier(.22,1,.36,1) .32s both;
}

.launch-line {
  font-size: clamp(10px, 1.3vh, 14px);
  letter-spacing: .10em;
  text-transform: uppercase;
  color: rgba(195,215,242,.60);
  animation: fadeUp .65s cubic-bezier(.22,1,.36,1) .38s both;
}

/* ─── Barra de progresso ─── */
.progress-wrap {
  width: min(100%, 580px);
  animation: fadeIn .8s ease .48s both;
}

.progress {
  height: clamp(5px, .8vh, 8px);
  border-radius: 999px;
  overflow: hidden;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.06);
}

.progress span {
  display: block;
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, #4a9eff 0%, #8fd9ff 50%, #c8f0ff 100%);
  background-size: 200% auto;
  animation: progressShimmer 3s linear infinite;
  transition: width .8s cubic-bezier(.4,0,.2,1);
}

/* ─── Footer ─── */
.footer-note {
  font-size: clamp(9px, 1.1vh, 12px);
  color: rgba(195,215,242,.38);
  letter-spacing: .20em;
  text-transform: uppercase;
  animation: fadeIn .8s ease .56s both;
}

/* ═══════════════════════════════════════
   MOBILE — tudo em 1 tela, sem scroll
═══════════════════════════════════════ */
@media (max-width: 560px) {

  .page {
    gap: clamp(5px, 1.8vw, 10px);
    padding:
      max(14px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(14px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
  }

  .countdown {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    width: 100%;
  }

  .time-box {
    border-radius: 18px;
  }

}

/* ═══════════════════════════════════════
   FIM DA CONTAGEM — fogos, "Chegou a hora" e passagem para a página do jogo
═══════════════════════════════════════ */
#fireworks,
#fireworksGlow {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity .5s ease;
}
#fireworks.on,
#fireworksGlow.on { opacity: 1; }

/* Halo escuro discreto atrás do texto durante a abertura (legibilidade). */
body.is-celebrating .page::before {
  content: "";
  position: absolute;
  left: 8%; right: 8%; top: 22%; bottom: 22%;
  background: radial-gradient(ellipse at center, rgba(0,0,0,.42) 0%, rgba(0,0,0,.18) 45%, transparent 72%);
  z-index: -1;
  pointer-events: none;
}

@keyframes fadeOutDown {
  from { opacity: 1; transform: translateY(0) scale(1); }
  to   { opacity: 0; transform: translateY(14px) scale(.97); }
}
@keyframes finaleIn {
  0%   { opacity: 0; transform: translateY(-50%) scale(.82); filter: blur(10px) drop-shadow(0 0 0 rgba(255,214,120,0)); }
  60%  { opacity: 1; filter: blur(0) drop-shadow(0 0 34px rgba(255,214,120,.55)); }
  100% { opacity: 1; transform: translateY(-50%) scale(1); filter: blur(0) drop-shadow(0 0 22px rgba(255,214,120,.35)); }
}
@keyframes finaleGlow {
  0%, 100% { filter: drop-shadow(0 0 18px rgba(255,214,120,.30)); }
  50%      { filter: drop-shadow(0 0 36px rgba(255,214,120,.60)); }
}

body.is-finale .countdown,
body.is-finale .soon,
body.is-finale .launch-line,
body.is-finale .progress-wrap,
body.is-finale .footer-note {
  animation: fadeOutDown .7s cubic-bezier(.4,0,.2,1) forwards;
  pointer-events: none;
}

.finale {
  display: none;
  position: absolute;
  left: 0;
  right: 0;
  top: 56%;
  transform: translateY(-50%);
  text-align: center;
  padding: 0 16px;
}
body.is-finale .finale {
  display: block;
  animation: finaleIn 1.2s cubic-bezier(.22,1,.36,1) both;
}
.finale__text {
  display: inline-block;
  font-size: clamp(36px, 10.5vw, 148px);
  font-weight: 900;
  letter-spacing: -.02em;
  line-height: 1;
  text-transform: uppercase;
  background: linear-gradient(175deg, #ffffff 0%, #fff4d8 45%, #f2cf86 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: finaleGlow 2.4s ease-in-out 1.2s infinite;
}

/* Saída premium: o conteúdo se desfaz, uma luz dourada floresce e a tela escurece. */
@keyframes pageDissolve {
  to { opacity: 0; transform: scale(1.05); filter: blur(10px); }
}
body.is-exiting .page { animation: pageDissolve 1.6s cubic-bezier(.4,0,.2,1) forwards; }
.exit-light {
  position: fixed;
  left: 50%;
  top: 50%;
  width: 140vmax;
  height: 140vmax;
  margin: -70vmax 0 0 -70vmax;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,228,168,.5) 0%, rgba(255,198,104,.16) 22%, rgba(0,0,0,0) 55%);
  opacity: 0;
  transform: scale(.15);
  pointer-events: none;
  z-index: 9;
}
@keyframes lightBloom {
  0%   { opacity: 0; transform: scale(.15); }
  45%  { opacity: 1; transform: scale(.9); }
  100% { opacity: 0; transform: scale(1.4); }
}
body.is-exiting .exit-light { animation: lightBloom 2.2s cubic-bezier(.22,1,.36,1) .25s forwards; }

/* Transição entre páginas (navegadores com View Transitions): a página do
   jogo surge do escuro. Precisa do mesmo bloco em página.html. */
@view-transition { navigation: auto; }
::view-transition-old(root) { animation: vtOut .6s ease both; }
::view-transition-new(root) { animation: vtIn 1.2s cubic-bezier(.22,1,.36,1) both; }
@keyframes vtOut { to { opacity: 0; } }
@keyframes vtIn {
  from { opacity: 0; transform: scale(1.035); filter: blur(12px) brightness(1.5); }
  to   { opacity: 1; transform: none; filter: none; }
}

.page-exit {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: #000;
  opacity: 0;
  pointer-events: none;
  transition: opacity .9s ease;
}
.page-exit.on { opacity: 1; }

/* Últimos 10 segundos: o relógio pulsa a cada tick */
@keyframes tickPulse {
  0%   { transform: scale(1);    box-shadow: 0 0 0 rgba(255,214,120,0); }
  30%  { transform: scale(1.07); box-shadow: 0 0 34px rgba(255,214,120,.35); border-color: rgba(255,214,120,.55); }
  100% { transform: scale(1);    box-shadow: 0 0 0 rgba(255,214,120,0); }
}
body.final-ten .time-box { border-color: rgba(255,214,120,.22); }
body.final-ten .time-box.tick { animation: tickPulse .62s cubic-bezier(.22,1,.36,1); }

/* Convite para ativar o som da abertura (último minuto) */
.sound-chip {
  position: fixed;
  /* Centralizado por margem: a animação de entrada (fadeUp) usa transform e
     anulava um translateX(-50%), deixando o botão deslocado para a direita. */
  left: 0;
  right: 0;
  margin: 0 auto;
  width: max-content;
  max-width: calc(100% - 32px);
  bottom: max(18px, env(safe-area-inset-bottom));
  z-index: 6;
  padding: 10px 18px;
  border-radius: 999px;
  border: 1px solid rgba(255,214,120,.35);
  background: rgba(10,14,24,.72);
  color: #f6e6c2;
  font: 700 13px/1 'Sora', system-ui, sans-serif;
  letter-spacing: .04em;
  cursor: pointer;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  animation: fadeUp .6s cubic-bezier(.22,1,.36,1) both;
}
.sound-chip[hidden] { display: none; }

@media (prefers-reduced-motion: reduce) {
  body.is-finale .finale, .finale__text, body.final-ten .time-box.tick { animation: none; }
  body.is-exiting .page, body.is-exiting .exit-light { animation: none; }
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
}
</style>

<script>
(function(){
  // Lançamento oficial na virada do ano: o zero acontece quando termina o
  // 23:59:59 de 31/12/2026 — meia-noite em Brasília. Os foguetes da abertura
  // sobem no último segundo e estouram no zero; depois "Chegou a hora" e a
  // página do jogo com a apresentação (página.html?intro=1).
  const LAUNCH          = new Date('2027-01-01T00:00:00-03:00').getTime();
  const START_REFERENCE = new Date('2026-07-05T00:00:00-03:00').getTime();
  const GAME_PAGE       = 'p%C3%A1gina.html';
  // Quem chegar até 15 min depois do lançamento ainda vê a abertura; depois
  // disso a raiz leva direto à página do jogo.
  const CELEBRATION_WINDOW_MS = 15 * 60 * 1000;
  // Roteiro da abertura (ms em relação ao zero): 30 s de fogos.
  // As bombas da abertura saem nos últimos segundos e estouram no zero.
  const SHOW_ITS_TIME_AT = 5000;    // "Chegou a hora" (fica até a transição)
  const SHOW_END_AT      = 29500;   // último lançamento; a cortina dourada estoura aos 29 s
  const EXIT_AT          = 31200;   // transição: som baixa, luz dourada, tela escurece
  const AUDIO_FADE_MS    = 2600;
  const NAVIGATE_AT      = 34000;
  // Botão "ative o som" aparece no último minuto (o navegador só toca áudio após um toque).
  const SOUND_PROMPT_MS  = 60 * 1000;

  // Prévia: ?simular=10 faz a contagem terminar em 10 s (só para quem abrir
  // com o parâmetro; não muda nada para os demais visitantes).
  const params    = new URLSearchParams(location.search);
  const simSecs   = Math.round(Number(params.get('simular')));
  const simulated = Number.isFinite(simSecs) && simSecs >= 3 && simSecs <= 600;
  const TARGET    = simulated ? Date.now() + simSecs * 1000 : LAUNCH;
  const START     = simulated ? Date.now() - 60 * 1000 : START_REFERENCE;

  const daysEl      = document.getElementById('days');
  const hoursEl     = document.getElementById('hours');
  const minutesEl   = document.getElementById('minutes');
  const secondsEl   = document.getElementById('seconds');
  const secondsBox  = secondsEl.closest('.time-box');
  const progressBar = document.getElementById('progressBar');
  const statusText  = document.getElementById('statusText');
  const exitLayer   = document.getElementById('pageExit');
  const soundChip   = document.getElementById('soundChip');

  let audioCtx = null, audioEnabled = false, noiseBuf = null, lastSecond = null, finished = false, prelaunchTimer = null;

  function enableAudio(){
    if (!audioEnabled){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      try {
        audioCtx = new Ctx();
        audioEnabled = true;
        // Ruído reutilizado por todos os estouros.
        noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch(e){ return; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    Sfx.ready();
    soundChip.hidden = true;
  }
  window.addEventListener('pointerdown', enableAudio, { once: true });
  window.addEventListener('touchstart',  enableAudio, { once: true });
  window.addEventListener('keydown',     enableAudio, { once: true });
  soundChip.addEventListener('click', enableAudio);

  function playTick(final){
    if (!audioEnabled || !audioCtx) return;
    try {
      const t    = audioCtx.currentTime;
      const osc  = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const flt  = audioCtx.createBiquadFilter();
      osc.type = 'square';
      osc.frequency.setValueAtTime(final ? 1500 : 1850, t);
      osc.frequency.exponentialRampToValueAtTime(final ? 980 : 1320, t + .02);
      flt.type = 'bandpass';
      flt.frequency.setValueAtTime(2100, t);
      flt.Q.setValueAtTime(5.5, t);
      gain.gain.setValueAtTime(.00001, t);
      gain.gain.exponentialRampToValueAtTime(final ? .14 : .075, t + .0025);
      gain.gain.exponentialRampToValueAtTime(.00001, t + (final ? .05 : .022));
      osc.connect(flt); flt.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + .06);
    } catch(e){}
  }

  // ─── Som dos fogos: gravações reais + espaço acústico ──────────────────────
  // Estrondos, estalos e assobios recortados de "Fireworks.ogg" (Wikimedia
  // Commons, domínio público — autor Stephan / pdsounds.org); ver
  // assets/sfx/fogos/FONTE.txt. Cada som vai para o lado do estouro, chega com
  // o atraso e o abafamento da distância e ganha o eco de céu aberto. Se as
  // gravações não carregarem, cai na síntese.
  const SFX_DIR = 'assets/sfx/fogos/';
  const SFX_FILES = {
    boom:    ['estrondo-1', 'estrondo-2', 'estrondo-3', 'estrondo-4', 'estrondo-5'],
    crackle: ['estalos-1', 'estalos-2'],
    whistle: ['assobio-1', 'assobio-2']
  };
  const rand   = (a, b) => a + Math.random() * (b - a);
  const choose = a => a[(Math.random() * a.length) | 0];

  const Sfx = {
    bank: { boom: [], crackle: [], whistle: [] },
    raw: null, decoding: null, chain: null, voices: 0, lastBoom: -1,

    // Baixa os arquivos cedo (último minuto); decodifica quando o áudio é liberado.
    prefetch(){
      if (this.raw) return;
      this.raw = {};
      for (const [kind, names] of Object.entries(SFX_FILES)) {
        this.raw[kind] = names.map(n => fetch(SFX_DIR + n + '.mp3').then(r => r.ok ? r.arrayBuffer() : null).catch(() => null));
      }
    },
    ready(){
      if (!audioCtx) return null;
      this.prefetch();
      if (!this.decoding) this.decoding = (async () => {
        for (const [kind, list] of Object.entries(this.raw)) {
          const decoded = await Promise.all(list.map(async pending => {
            const ab = await pending;
            if (!ab) return null;
            try { return await new Promise((res, rej) => audioCtx.decodeAudioData(ab.slice(0), res, rej)); } catch (e) { return null; }
          }));
          this.bank[kind] = decoded.filter(Boolean);
        }
      })();
      return this.decoding;
    },

    // Mixagem: compressor no fim (nada distorce) + eco de céu aberto.
    graph(){
      if (this.chain) return this.chain;
      const comp = audioCtx.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 14; comp.ratio.value = 4; comp.attack.value = .003; comp.release.value = .3;
      const master = audioCtx.createGain(); master.gain.value = .95;
      master.connect(comp); comp.connect(audioCtx.destination);
      const sr = audioCtx.sampleRate, len = Math.floor(sr * 3.2);
      const ir = audioCtx.createBuffer(2, len, sr);
      for (let c = 0; c < 2; c++) {
        const d = ir.getChannelData(c);
        for (let i = 0; i < len; i++) {
          const t = i / sr;
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.4) * (t < .025 ? t / .025 : 1);
        }
      }
      const verb = audioCtx.createConvolver(); verb.buffer = ir;
      const verbTone = audioCtx.createBiquadFilter(); verbTone.type = 'lowpass'; verbTone.frequency.value = 3000;
      const verbGain = audioCtx.createGain(); verbGain.gain.value = .6;
      verb.connect(verbTone); verbTone.connect(verbGain); verbGain.connect(master);
      this.chain = { master, verb };
      return this.chain;
    },

    // Baixa todo o som suavemente (inclui o eco) antes da troca de página.
    fadeOut(sec){
      if (!audioCtx || !this.chain) return;
      const g = this.chain.master.gain, t = audioCtx.currentTime;
      g.cancelScheduledValues(t); g.setValueAtTime(g.value, t);
      g.linearRampToValueAtTime(g.value * .55, t + sec * .4);
      g.exponentialRampToValueAtTime(.0001, t + sec);
    },

    play(buf, { when = 0, rate = 1, gain = 1, pan = 0, lowpass = 16000, send = .35 } = {}){
      if (!buf || this.voices > 36) return;
      const { master, verb } = this.graph();
      const t = audioCtx.currentTime + when;
      const src = audioCtx.createBufferSource(); src.buffer = buf; src.playbackRate.value = rate;
      const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = lowpass;
      const g = audioCtx.createGain(); g.gain.value = gain;
      src.connect(lp); lp.connect(g);
      let out = g;
      if (audioCtx.createStereoPanner) {
        const pn = audioCtx.createStereoPanner(); pn.pan.value = Math.max(-1, Math.min(1, pan));
        g.connect(pn); out = pn;
      }
      out.connect(master);
      const sendGain = audioCtx.createGain(); sendGain.gain.value = send;
      out.connect(sendGain); sendGain.connect(verb);
      this.voices++;
      src.onended = () => { this.voices--; };
      src.start(t);
    },

    noise(t, dur, type, f0, f1, gain){
      if (!noiseBuf) return;
      const { master } = this.graph();
      const src = audioCtx.createBufferSource(), flt = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
      src.buffer = noiseBuf;
      flt.type = type; flt.frequency.setValueAtTime(f0, t); if (f1) flt.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      src.connect(flt); flt.connect(g); g.connect(master);
      src.start(t, Math.random() * 1.2, dur + .05);
    },
    tone(t, dur, f0, f1, gain){
      const { master } = this.graph();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05);
    },

    // Foguete saindo do morteiro: baque grave curto (+ assobio real às vezes).
    launch(nx, whistle){
      if (!audioEnabled || !audioCtx) return;
      try {
        const pan = (nx * 2 - 1) * .7, t = audioCtx.currentTime;
        this.tone(t, .14, 90, 40, .09);
        this.noise(t, .18, 'bandpass', 700, 300, .035);
        if (whistle && this.bank.whistle.length) {
          this.play(choose(this.bank.whistle), { when: .05, rate: rand(.85, 1.25), gain: .2, pan, lowpass: 9000, send: .3 });
        }
      } catch (e) {}
    },

    // Estouro: gravação real com tom, lado, distância e eco; bombas grandes
    // ganham uma segunda camada mais grave e o "grave de peito".
    boom(nx, ny, size, type){
      if (!audioEnabled || !audioCtx) return;
      try {
        const pan = (nx * 2 - 1) * .8;
        const near = Math.max(0, Math.min(1, ny / .55));   // estouro mais baixo = mais perto
        const delay = .08 + (1 - near) * .38;             // a luz chega antes do som
        const lowpass = 2200 + near * 10000;              // a distância abafa os agudos
        const gain = (.45 + .55 * Math.min(1.4, size)) * (.55 + .45 * near);
        const t = audioCtx.currentTime + delay;
        if (!this.bank.boom.length) {                      // reserva: síntese
          this.noise(t, 1.1 + size * .6, 'lowpass', 1400, 90, .22 + .3 * size);
          this.tone(t, .9, 70, 28, .28 * size + .08);
          return;
        }
        let i = (Math.random() * this.bank.boom.length) | 0;
        if (i === this.lastBoom) i = (i + 1) % this.bank.boom.length;   // não repete o anterior
        this.lastBoom = i;
        const big = size >= 1.05;
        const rate = big ? rand(.7, .84) : rand(.84, 1.06);
        this.play(this.bank.boom[i], { when: delay, rate, gain, pan, lowpass, send: .42 });
        if (big) {
          this.play(choose(this.bank.boom), { when: delay + .025, rate: rate * .78, gain: gain * .55, pan: pan * .6, lowpass: lowpass * .6, send: .5 });
          this.tone(t, .9, 58, 30, .5 * Math.min(1.3, size) * (.6 + .4 * near));
        }
        if (this.bank.crackle.length) {
          if (type === 'crackle') {
            this.play(choose(this.bank.crackle), { when: delay + rand(.35, .6), rate: rand(.92, 1.15), gain: .5 * (.6 + .4 * near), pan, lowpass, send: .35 });
          } else if (type === 'brocade' || type === 'willow') {
            this.play(this.bank.crackle[0], { when: delay + rand(.5, .8), rate: rand(.7, .82), gain: .28, pan, lowpass: Math.min(lowpass, 3600), send: .45 });
          } else if (type === 'chrys' && Math.random() < .5) {
            this.play(choose(this.bank.crackle), { when: delay + rand(.45, .7), rate: rand(1.05, 1.25), gain: .22, pan, lowpass, send: .35 });
          }
        }
      } catch (e) {}
    }
  };

  // Diagnóstico só de leitura (console): OSL_FOGOS.status()
  window.OSL_FOGOS = { status: () => ({
    audio: audioCtx ? audioCtx.state : 'desligado',
    estrondos: Sfx.bank.boom.length, estalos: Sfx.bank.crackle.length, assobios: Sfx.bank.whistle.length,
    vozesTocando: Sfx.voices,
    volume: Sfx.chain ? Number(Sfx.chain.master.gain.value.toFixed(4)) : null
  }) };

  // ─── Fogos de artifício com física real (canvas atrás do conteúdo) ────────
  // Mundo em metros e segundos: gravidade 9,81 m/s² igual para tudo, arrasto do
  // ar quadrático (a = −k·|v − vento|·(v − vento)), vento leve, e bombas com
  // espoleta de tempo — sobem e estouram no instante programado, como as de
  // verdade. A tela mostra ~240 m de céu (300 m no celular em pé) e o tempo
  // corre 2,4× para caber no ritmo do show.
  const Fireworks = (function(){
    const canvas = document.getElementById('fireworks');          // faíscas, com rastro
    const ctx = canvas.getContext('2d');
    const glowCanvas = document.getElementById('fireworksGlow');  // fumaça e clarões, limpo a cada quadro
    const gctx = glowCanvas.getContext('2d');
    const small = Math.min(window.innerWidth, window.innerHeight) < 640 || (navigator.hardwareConcurrency || 8) <= 4;
    const MAX_PARTICLES = small ? 1800 : 3800;
    const DENSITY = small ? .62 : 1;
    const G = 9.81, TIME_SCALE = 2.4, WIND = 2.4;   // m/s² · aceleração do tempo · vento (m/s, para a direita)
    // Cores de pirotecnia (sais metálicos) — dourado e prata dominam, como num show real.
    const C = {
      gold: [255, 190, 86], silver: [228, 236, 255], red: [255, 66, 46], green: [104, 255, 128],
      blue: [86, 146, 255], purple: [192, 100, 255], orange: [255, 138, 46], cyan: [104, 228, 255],
      white: [255, 250, 238], ember: [255, 120, 40]
    };
    const SHOW_COLORS = ['gold', 'gold', 'silver', 'red', 'green', 'blue', 'purple', 'orange', 'cyan'];
    const HOT = [255, 252, 240];
    // Modelos de bomba: velocidade das estrelas (m/s), arrasto k (1/m), queima (s), tamanho.
    const TYPES = {
      peony:      { n: 140, v: [40, 52], k: .026, burn: [2.6, 3.2], size: [1.5, 2.3], boom: .9 },
      chrys:      { n: 150, v: [42, 54], k: .024, burn: [3.0, 3.6], size: [1.4, 2.0], glitter: 5, boom: .9 },
      dahlia:     { n: 55,  v: [50, 60], k: .016, burn: [3.0, 3.6], size: [2.4, 3.2], glitter: 8, boom: 1 },
      willow:     { n: 85,  v: [30, 38], k: .06,  burn: [6.0, 7.5], size: [1.3, 1.8], embers: 10, color: 'gold', boom: 1.1 },
      kamuro:     { n: 120, v: [36, 44], k: .05,  burn: [5.0, 6.0], size: [1.5, 2.0], embers: 7, color: 'gold', boom: 1.15 },
      palm:       { n: 8,   v: [55, 64], k: .011, burn: [3.2, 3.8], size: [3.2, 3.8], glitter: 26, color: 'gold', boom: 1.15 },
      ring:       { n: 72,  v: [44, 50], k: .026, burn: [2.6, 3.0], size: [1.6, 2.3], ring: true, boom: .9 },
      saturn:     { n: 90,  v: [26, 32], k: .03,  burn: [2.6, 3.0], size: [1.5, 2.1], saturn: 64, boom: 1 },
      pistil:     { n: 120, v: [42, 52], k: .026, burn: [2.8, 3.2], size: [1.5, 2.2], core: .45, boom: .95 },
      crossette:  { n: 24,  v: [44, 50], k: .02,  burn: [1.4, 1.6], size: [2.0, 2.6], split: true, boom: .8 },
      crackle:    { n: 110, v: [40, 48], k: .03,  burn: [2.2, 2.9], size: [1.2, 1.8], flicker: true, pop: .55, boom: .9 },
      strobe:     { n: 70,  v: [34, 42], k: .045, burn: [4.0, 5.0], size: [1.4, 1.9], blink: true, color: 'white', boom: .85 },
      spider:     { n: 70,  v: [85, 98], k: .022, burn: [1.6, 2.0], size: [1.1, 1.5], color: 'silver', boom: .9 },
      horsetail:  { n: 60,  v: [16, 24], k: .03,  burn: [4.0, 4.6], size: [1.4, 1.9], down: true, color: 'gold', boom: .85 },
      multibreak: { n: 5,   v: [22, 28], k: .01,  burn: [.5, .7],   size: [2.6, 3.0], sub: true, boom: .7 },
      salute:     { n: 200, v: [60, 75], k: .08,  burn: [.6, .9],   size: [1.6, 2.4], color: 'white', boom: 1.6 }
    };
    const particles = [], shells = [], flashes = [], smokes = [];
    const sprites = new Map();
    let w = 0, h = 0, S = 1, ppm = 1, viewH = 300, raf = 0, last = 0;
    let running = false, initialized = false, openingLaunched = false, zeroAt = 0, script = [];

    const rnd  = (a, b) => a + Math.random() * (b - a);
    const pick = a => a[(Math.random() * a.length) | 0];
    const mix  = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
    const sx = X => X * ppm, sy = Y => h - Y * ppm;          // mundo (m) → tela (px)

    function measure(){
      w = window.innerWidth; h = window.innerHeight;
      viewH = h > w * 1.2 ? 300 : 240;                       // celular em pé mostra mais céu
      ppm = h / viewH;
      S = Math.max(.55, Math.min(1.5, Math.min(w, h) / 800));
    }
    function resize(){
      measure();
      const dpr = Math.min(window.devicePixelRatio || 1, small ? 1.5 : 2);
      for (const [cv, cx] of [[canvas, ctx], [glowCanvas, gctx]]){
        cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
        cx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
    }

    // Brilho pré-renderizado por cor (quantizada) — muito mais leve que shadowBlur.
    function sprite(c){
      const q = [c[0], c[1], c[2]].map(v => Math.max(0, Math.min(255, Math.round(v / 15) * 15)));
      const key = q.join(',');
      let s = sprites.get(key);
      if (!s){
        s = document.createElement('canvas'); s.width = s.height = 64;
        const g = s.getContext('2d'), grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
        grd.addColorStop(0,   'rgba(255,255,255,1)');
        grd.addColorStop(.16, 'rgba(' + q + ',.95)');
        grd.addColorStop(.42, 'rgba(' + q + ',.26)');
        grd.addColorStop(1,   'rgba(' + q + ',0)');
        g.fillStyle = grd; g.fillRect(0, 0, 64, 64);
        if (sprites.size > 500) sprites.clear();
        sprites.set(key, s);
      }
      return s;
    }

    // Direção uniforme numa esfera; o céu mostra a projeção (borda mais densa).
    function dir3(){
      let x, y, z, d;
      do { x = rnd(-1, 1); y = rnd(-1, 1); z = rnd(-1, 1); d = x * x + y * y + z * z; } while (d > 1 || d < 1e-4);
      d = Math.sqrt(d); return [x / d, y / d];
    }

    // ─── Névoa da pólvora (espaço da tela) ───────────────────────────────────
    const MAX_SMOKE = small ? 45 : 90, SMOKE_RGB = [70, 74, 92];
    let clouds = null;
    const cloudTints = new Map();
    function makeClouds(){
      clouds = [0, 1, 2].map(() => {
        const c = document.createElement('canvas'); c.width = c.height = 160;
        const g = c.getContext('2d');
        for (let i = 0; i < 20; i++){
          const r = rnd(16, 46), cx = 80 + rnd(-36, 36), cy = 80 + rnd(-36, 36);
          const grd = g.createRadialGradient(cx, cy, 0, cx, cy, r);
          grd.addColorStop(0, 'rgba(255,255,255,.24)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
          g.fillStyle = grd; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
        }
        g.globalCompositeOperation = 'destination-in';
        const m = g.createRadialGradient(80, 80, 24, 80, 80, 80);
        m.addColorStop(0, 'rgba(0,0,0,1)'); m.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = m; g.fillRect(0, 0, 160, 160);
        return c;
      });
    }
    function cloudTint(k, rgb){
      const q = [rgb[0], rgb[1], rgb[2]].map(v => Math.min(255, Math.round(v / 32) * 32)).join(',');
      const key = k + ':' + q;
      let c = cloudTints.get(key);
      if (!c){
        c = document.createElement('canvas'); c.width = c.height = 160;
        const g = c.getContext('2d');
        g.drawImage(clouds[k], 0, 0);
        g.globalCompositeOperation = 'source-in';
        g.fillStyle = 'rgb(' + q + ')'; g.fillRect(0, 0, 160, 160);
        if (cloudTints.size > 120) cloudTints.clear();
        cloudTints.set(key, c);
      }
      return c;
    }
    function smoke(x, y, R){
      const n = small ? 3 : 6, drift = WIND * ppm * TIME_SCALE * .5 / 60;   // px por quadro
      for (let i = 0; i < n; i++){
        const a = Math.random() * Math.PI * 2, d = rnd(.05, .75) * R;
        smokes.push({ x: x + Math.cos(a) * d, y: y + Math.sin(a) * d * .8, r: rnd(.28, .55) * R, vr: rnd(.18, .45) * S,
          vx: drift + rnd(-.1, .1) * S, vy: rnd(-.14, -.02) * S, a: rnd(.06, .1), life: 1, age: 0,
          decay: rnd(.0016, .0028), k: (Math.random() * 3) | 0 });
      }
      while (smokes.length > MAX_SMOKE) smokes.shift();
    }
    function flash(x, y, color, power){
      flashes.push({ x, y, c: color, life: 1, decay: .055 / Math.max(.6, power), r: Math.min(w, h) * (.3 + .3 * power), power });
    }

    // O laço de animação para quando a cena esvazia; tudo que entra em cena o
    // religa (as salvas agendam bombas com atraso — sem isso elas congelavam).
    function kick(){
      if (raf || !initialized) return;
      last = performance.now();
      raf = requestAnimationFrame(frame);
    }

    // ─── Partículas ──────────────────────────────────────────────────────────
    function star(X, Y, vx, vy, o){
      if (particles.length >= MAX_PARTICLES) return;
      kick();
      o.X = X; o.Y = Y; o.vx = vx; o.vy = vy; o.age = 0;
      o.px = sx(X); o.py = sy(Y);
      o.blinkPhase = Math.random() * 6.28;
      particles.push(o);
    }

    // Uma bomba no céu, em (X, Y) metros, herdando a velocidade da bomba.
    function burst(X, Y, svx, svy, type, colorName, scale = 1){
      const T = TYPES[type]; if (!T) return;
      const base = C[T.color || colorName] || C.gold;
      const second = C[pick(SHOW_COLORS)];
      const count = Math.max(4, Math.round(T.n * DENSITY * rnd(.85, 1.1) * (T.sub ? 1 : scale)));
      const tilt = rnd(-.9, .9), squash = rnd(.25, .55);
      const mk = (dx, dy, vmul, color, extra) => {
        const v = rnd(T.v[0], T.v[1]) * vmul * (T.sub ? 1 : Math.sqrt(scale));
        star(X, Y, svx + dx * v, svy + dy * v, Object.assign({
          k: T.k * rnd(.9, 1.1), burn: rnd(T.burn[0], T.burn[1]) * (T.sub ? 1 : rnd(.95, 1.05)),
          size: rnd(T.size[0], T.size[1]) * S, c: color, hot: type === 'salute' ? .5 : .12,
          glitter: T.glitter || 0, embers: T.embers || 0, flicker: !!T.flicker, blink: !!T.blink,
          pop: T.pop ? Math.random() < T.pop : false, split: !!T.split
        }, extra || {}));
      };
      if (T.sub){
        // Multiestouro: sub-bombas que estouram em pequenas peônias.
        for (let i = 0; i < count; i++){
          const [dx, dy] = dir3();
          const v = rnd(T.v[0], T.v[1]);
          shells.push({ X, Y, vx: svx + dx * v, vy: svy + dy * v, k: .01, fuse: rnd(T.burn[0], T.burn[1]), age: 0,
            type: 'peony', color: pick(SHOW_COLORS), scale: .42, sub: true, px: sx(X), py: sy(Y), tail: false });
        }
      } else if (T.ring){
        for (let i = 0; i < count; i++){
          const a = (i / count) * Math.PI * 2, cx = Math.cos(a), cy = Math.sin(a) * squash;
          mk(cx * Math.cos(tilt) - cy * Math.sin(tilt), cx * Math.sin(tilt) + cy * Math.cos(tilt), 1, base);
        }
      } else {
        for (let i = 0; i < count; i++){
          let [dx, dy] = dir3();
          if (T.down){ dy = -Math.abs(dy) * .85 - .15; const d = Math.hypot(dx, dy); dx /= d; dy /= d; }
          mk(dx, dy, 1, type === 'crackle' ? (Math.random() < .5 ? C.silver : C.gold) : base);
        }
        if (T.core){
          for (let i = 0; i < count * .4; i++){ const [dx, dy] = dir3(); mk(dx, dy, T.core, second); }
        }
        if (T.saturn){
          for (let i = 0; i < T.saturn * DENSITY; i++){
            const a = (i / (T.saturn * DENSITY)) * Math.PI * 2, cx = Math.cos(a), cy = Math.sin(a) * squash;
            const dx = cx * Math.cos(tilt) - cy * Math.sin(tilt), dy = cx * Math.sin(tilt) + cy * Math.cos(tilt);
            const v = rnd(46, 52) * Math.sqrt(scale);
            star(X, Y, svx + dx * v, svy + dy * v, { k: .024, burn: rnd(2.6, 3), size: rnd(1.5, 2.1) * S, c: second, hot: .12,
              glitter: 0, embers: 0, flicker: false, blink: false, pop: false, split: false });
          }
        }
      }
      const x = sx(X), y = sy(Y);
      const R = (T.v[1] * 1.2) * ppm * Math.sqrt(scale);
      flash(x, y, type === 'salute' ? C.white : base, (T.boom || .9) * Math.max(.6, scale));
      if (!T.sub) smoke(x, y, R);
      Sfx.boom(x / w, y / h, Math.min(1.6, (T.boom || .9) * scale), type);
    }

    // Bomba saindo do morteiro com espoleta: estoura depois de `fuse` s (real).
    function shell(type, colorName, xFrac, apexFrac, fuseReal, opts = {}){
      const Ha = apexFrac * viewH;                           // altura do estouro (m)
      const v0 = Math.sqrt(2 * G * Ha);                      // velocidade de saída do morteiro
      const fuse = fuseReal != null ? fuseReal * TIME_SCALE : v0 / G;   // espoleta (s do mundo)
      const vy = fuseReal != null ? G * fuse : v0;            // espoleta fixa: sai com a velocidade que leva ao topo nesse tempo
      const X = (xFrac != null ? xFrac : rnd(.1, .9)) * (w / ppm);
      shells.push({ X, Y: -4, vx: rnd(-1.5, 1.5), vy, k: .0006, fuse, age: 0, type, color: colorName,
        scale: opts.scale || 1, px: sx(X), py: sy(-4), tail: opts.tail !== false });
      kick();
      Sfx.launch(X * ppm / w, opts.whistle != null ? opts.whistle : Math.random() < .35);
    }
    const shellAt = (type, color, xf, apexFrac, fuseReal, opts) => shell(type, color, xf, apexFrac, fuseReal, opts);
    function randomShell(types){
      const t = pick(types);
      shell(t, pick(SHOW_COLORS), rnd(.08, .92), rnd(.6, .86), null, { scale: t === 'salute' ? 1 : rnd(.95, 1.25) });
    }
    function mirroredPair(type){
      const xf = rnd(.12, .38), ap = rnd(.62, .84), color = pick(SHOW_COLORS), fuse = Math.sqrt(2 * ap * viewH / G) / TIME_SCALE;
      shell(type, color, xf, ap, fuse); shell(type, color, 1 - xf, ap, fuse);
    }
    // Bolo de chão: leque de cometas saindo de um canto de baixo, em sequência.
    function cake(side){
      const n = small ? 6 : 9, color = Math.random() < .6 ? 'gold' : pick(SHOW_COLORS);
      const baseX = (side ? rnd(.78, .92) : rnd(.08, .22)) * (w / ppm);
      for (let i = 0; i < n; i++){
        setTimeout(() => {
          const ang = (side ? 120 - i * (60 / (n - 1)) : 60 + i * (60 / (n - 1))) * Math.PI / 180;
          const v = rnd(58, 66);
          star(baseX, 0, Math.cos(ang) * v, Math.sin(ang) * v, { k: .012, burn: rnd(2.6, 3.0), size: rnd(2.6, 3.2) * S,
            c: C[color], hot: .2, glitter: 22, embers: 0, flicker: false, blink: false, pop: false, split: false, comet: true });
          Sfx.launch(baseX * ppm / w, false);
        }, i * 120);
      }
    }
    // Tempo real até o topo para uma altura (fração da tela).
    const flightOf = ap => Math.sqrt(2 * ap * viewH / G) / TIME_SCALE;
    // Salva: todas estouram juntas no instante `burstAtMs` (relógio performance.now),
    // em alturas diferentes — as mais altas saem antes, como num show real.
    function volley(plan, burstAtMs){
      const now = performance.now();
      plan.forEach(([type, color, xf, ap]) => {
        const delay = burstAtMs - now - flightOf(ap) * 1000;
        const go = () => shell(type, color, xf + rnd(-.025, .025), ap, Math.max(.3, (burstAtMs - performance.now()) / 1000), { whistle: Math.random() < .5 });
        if (delay > 0) setTimeout(go, delay); else go();
      });
    }
    const OPENING_PLAN = [['peony', 'gold', .5, .66], ['chrys', null, .24, .72], ['crackle', 'silver', .76, .7],
      ['pistil', null, .38, .58], ['ring', null, .62, .6], ['spider', 'silver', .1, .62], ['dahlia', null, .9, .64]];
    // Quanto antes do zero a primeira bomba da abertura precisa sair (s).
    function openingFlight(){ measure(); return flightOf(Math.max(...OPENING_PLAN.map(p => p[3]))); }
    function openingVolley(burstAtMs){
      if (openingLaunched) return;
      openingLaunched = true;
      const plan = OPENING_PLAN.slice(0, small ? 5 : 7).map(([t, c, xf, ap]) => [t, c || pick(SHOW_COLORS), xf, ap]);
      volley(plan, burstAtMs);
    }

    // ─── Roteiro de 30 s (ms reais desde o zero) ────────────────────────────
    function buildScript(){
      const ev = [], at = (t, fn) => ev.push({ t, fn });
      // Ato 1 — abertura (0–5 s): ritmo rápido e variado.
      for (let t = 450; t < 4300; t += rnd(380, 620)) at(t, () => randomShell(['peony', 'chrys', 'crackle', 'ring', 'pistil', 'dahlia', 'spider']));
      // "Chegou a hora" (5 s): salva no centro, coroas e palmeiras estouram juntas.
      at(SHOW_ITS_TIME_AT - flightOf(.72) * 1000 - 50, () => volley([['salute', 'white', .5, .64], ['kamuro', 'gold', .28, .72], ['kamuro', 'gold', .72, .72],
        ['palm', 'gold', .14, .6], ['palm', 'gold', .86, .6]], zeroAt + SHOW_ITS_TIME_AT));
      // Ato 2 — cores e formas (6–12 s): pares espelhados.
      for (let t = 6000; t < 12000; t += rnd(620, 950)) at(t, () => mirroredPair(pick(['dahlia', 'saturn', 'ring', 'pistil', 'crossette', 'peony', 'palm'])));
      // Ato 3 — dourado e ritmo (12–19 s): bolos de chão alternados + chorões, strobe, cascata.
      for (let t = 12000, side = 0; t < 19000; t += rnd(950, 1300), side ^= 1) { const s = side; at(t, () => cake(s)); }
      for (let t = 12400; t < 19000; t += rnd(650, 1000)) at(t, () => randomShell(['willow', 'strobe', 'horsetail', 'kamuro', 'multibreak', 'palm']));
      // Ato 4 — crescendo (19–25 s).
      for (let t = 19000; t < 25000; t += rnd(240, 420)) at(t, () => randomShell(['chrys', 'crackle', 'spider', 'peony', 'dahlia', 'pistil', 'crossette']));
      [21000, 23000, 24500].forEach(t => at(t, () => randomShell(['salute'])));
      // Grande final (25–28,5 s): barragem, bolos dos dois lados e salvas.
      for (let t = 25000; t < 28500; t += rnd(150, 250)) at(t, () => randomShell(['peony', 'chrys', 'crackle', 'spider', 'kamuro', 'dahlia', 'multibreak']));
      [25200, 26900].forEach(t => at(t, () => { cake(0); cake(1); }));
      [26000, 27200, 28100].forEach(t => at(t, () => randomShell(['salute'])));
      // Cortina dourada: estoura aos 29 s e fica pendurada até a transição.
      at(29000 - flightOf(.74) * 1000 - 50, () => volley([0.08, .22, .36, .5, .64, .78, .92].map((xf, i) => [i % 2 ? 'kamuro' : 'willow', 'gold', xf, i % 2 ? .74 : .66]), zeroAt + 29000));
      return ev.sort((a, b) => a.t - b.t);
    }

    // ─── Quadro ──────────────────────────────────────────────────────────────
    function frame(now){
      const dtReal = Math.min(.05, (now - last) / 1000 || .016);
      last = now;
      const ds = dtReal * TIME_SCALE;                        // segundos do mundo neste quadro
      const f60 = dtReal * 60;

      if (running){
        const t = now - zeroAt;
        while (script.length && script[0].t <= t) script.shift().fn();
      }

      // Rastro: esmaece o quadro anterior mantendo o fundo da página visível.
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = 'rgba(0,0,0,' + (1 - Math.pow(1 - .2, f60)).toFixed(3) + ')';
      ctx.fillRect(0, 0, w, h);

      // Canvas do brilho: limpo a cada quadro, então fumaça e clarões não se acumulam.
      gctx.clearRect(0, 0, w, h);
      for (let i = smokes.length - 1; i >= 0; i--){
        const s = smokes[i];
        s.x += s.vx * f60; s.y += s.vy * f60; s.r += s.vr * f60; s.life -= s.decay * f60; s.age += f60;
        if (s.life <= 0){ smokes.splice(i, 1); continue; }
        const size = s.r * 2.2, left = s.x - size / 2, top = s.y - size / 2;
        gctx.globalCompositeOperation = 'source-over';
        gctx.globalAlpha = s.a * Math.min(1, s.life * 1.6) * Math.min(1, s.age / 18);
        gctx.drawImage(cloudTint(s.k, SMOKE_RGB), left, top, size, size);
        let light = 0, best = 0, tint = null;
        for (const f of flashes){
          const dx = s.x - f.x, dy = s.y - f.y, rr = f.r * .9;
          const v = f.life * f.life * f.power * Math.exp(-(dx * dx + dy * dy) / (rr * rr));
          light += v;
          if (v > best){ best = v; tint = f.c; }
        }
        if (light > .02 && tint){
          gctx.globalCompositeOperation = 'lighter';
          gctx.globalAlpha = Math.min(.18, light * .2) * Math.min(1, s.life * 2);
          gctx.drawImage(cloudTint(s.k, mix(tint, [150, 150, 162], .45)), left, top, size, size);
        }
      }
      gctx.globalAlpha = 1;
      gctx.globalCompositeOperation = 'lighter';
      const tintScale = 1 / Math.max(1, Math.sqrt(flashes.length / 2));
      for (let i = flashes.length - 1; i >= 0; i--){
        const f = flashes[i];
        f.life -= f.decay * f60;
        if (f.life <= 0){ flashes.splice(i, 1); continue; }
        const k = f.life * f.life;
        gctx.fillStyle = 'rgba(' + (f.c[0] | 0) + ',' + (f.c[1] | 0) + ',' + (f.c[2] | 0) + ',' + (Math.min(.12, .06 * k * f.power) * tintScale).toFixed(3) + ')';
        gctx.fillRect(0, 0, w, h);
        const grd = gctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
        grd.addColorStop(0, 'rgba(255,250,235,' + (.32 * k).toFixed(3) + ')');
        grd.addColorStop(.22, 'rgba(' + (f.c[0] | 0) + ',' + (f.c[1] | 0) + ',' + (f.c[2] | 0) + ',' + (.13 * k).toFixed(3) + ')');
        grd.addColorStop(1, 'rgba(0,0,0,0)');
        gctx.fillStyle = grd; gctx.fillRect(f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
      }

      ctx.globalCompositeOperation = 'lighter';

      // Bombas subindo (gravidade + arrasto pequeno), com cauda de faíscas.
      for (let i = shells.length - 1; i >= 0; i--){
        const b = shells[i];
        const rvx = b.vx - WIND, sp = Math.hypot(rvx, b.vy);
        b.vx += -b.k * sp * rvx * ds;
        b.vy += (-G - b.k * sp * b.vy) * ds;
        b.X += b.vx * ds; b.Y += b.vy * ds; b.age += ds;
        const x = sx(b.X), y = sy(b.Y);
        if (b.tail){
          ctx.strokeStyle = 'rgba(255,220,170,.5)'; ctx.lineWidth = 1.5 * S;
          ctx.beginPath(); ctx.moveTo(b.px, b.py); ctx.lineTo(x, y); ctx.stroke();
          const s = 6.5 * S; ctx.globalAlpha = .9; ctx.drawImage(sprite(C.gold), x - s, y - s, s * 2, s * 2); ctx.globalAlpha = 1;
          if (Math.random() < .85) star(b.X, b.Y, b.vx * .2 + rnd(-3, 3), b.vy * .2 - rnd(2, 8), { k: .2, burn: rnd(.4, .7), size: rnd(.7, 1.1) * S,
            c: C.ember, hot: .2, glitter: 0, embers: 0, flicker: false, blink: false, pop: false, split: false });
        }
        b.px = x; b.py = y;
        if (b.age >= b.fuse){ burst(b.X, b.Y, b.vx, b.vy, b.type, b.color, b.scale); shells.splice(i, 1); }
      }

      // Estrelas: branco-quente → cor → brasa; arrasto quadrático, vento e gravidade.
      for (let i = particles.length - 1; i >= 0; i--){
        const p = particles[i];
        const rvx = p.vx - WIND, sp = Math.hypot(rvx, p.vy);
        p.vx += -p.k * sp * rvx * ds;
        p.vy += (-G - p.k * sp * p.vy) * ds;
        p.X += p.vx * ds; p.Y += p.vy * ds; p.age += ds;
        const t = p.age / p.burn;
        const x = sx(p.X), y = sy(p.Y);
        if (t >= 1){
          if (p.pop){
            for (let j = 0; j < 4; j++) star(p.X, p.Y, p.vx + rnd(-12, 12), p.vy + rnd(-12, 12), { k: .3, burn: rnd(.12, .2), size: rnd(.8, 1.2) * S,
              c: C.white, hot: 1, glitter: 0, embers: 0, flicker: false, blink: false, pop: false, split: false });
          }
          particles.splice(i, 1); continue;
        }
        if (p.split && t > .45){
          p.split = false;
          const a0 = Math.random() * Math.PI;
          for (let j = 0; j < 4; j++){
            const a = a0 + j * Math.PI / 2;
            star(p.X, p.Y, p.vx * .4 + Math.cos(a) * 20, p.vy * .4 + Math.sin(a) * 20, { k: .03, burn: rnd(1.0, 1.3), size: p.size * .85,
              c: p.c, hot: .1, glitter: 0, embers: 0, flicker: false, blink: false, pop: false, split: false });
          }
          particles.splice(i, 1); continue;
        }
        if (p.embers && Math.random() < p.embers * ds){
          star(p.X, p.Y, p.vx * .15, p.vy * .15, { k: .12, burn: rnd(.9, 1.6), size: rnd(.6, .95) * S, c: C.gold, hot: 0,
            glitter: 0, embers: 0, flicker: false, blink: false, pop: false, split: false, dim: true });
        }
        if (p.glitter && Math.random() < p.glitter * ds){
          star(p.X, p.Y, p.vx * .1, p.vy * .1, { k: .25, burn: rnd(.25, .45), size: rnd(.6, 1) * S, c: p.comet ? C.gold : C.silver,
            hot: .5, glitter: 0, embers: 0, flicker: false, blink: false, pop: false, split: false });
        }
        const color = t < p.hot ? mix(HOT, p.c, t / p.hot) : (t > .72 ? mix(p.c, C.ember, (t - .72) / .28 * .8) : p.c);
        let alpha = t < .7 ? 1 : 1 - (t - .7) / .3;
        if (p.dim) alpha *= .65;
        if (p.blink) alpha *= Math.sin(p.blinkPhase + p.age * 26) > .2 ? 1 : .06;
        else if (p.flicker) alpha *= Math.random() < .45 ? .15 : 1;
        else alpha *= .82 + Math.random() * .18;
        if (alpha > .02){
          ctx.strokeStyle = 'rgba(' + (color[0] | 0) + ',' + (color[1] | 0) + ',' + (color[2] | 0) + ',' + (alpha * .75).toFixed(3) + ')';
          ctx.lineWidth = p.size * .8;
          ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(x, y); ctx.stroke();
          const s = p.size * 2.6;
          ctx.globalAlpha = alpha; ctx.drawImage(sprite(color), x - s, y - s, s * 2, s * 2);
        }
        p.px = x; p.py = y;
      }
      ctx.globalAlpha = 1;

      if (running || particles.length || shells.length || flashes.length || smokes.length) raf = requestAnimationFrame(frame);
      else raf = 0;
    }

    function ensureInit(){
      if (initialized) return;
      initialized = true;
      if (!clouds) makeClouds();
      resize();
      window.addEventListener('resize', resize);
      canvas.classList.add('on');
      glowCanvas.classList.add('on');
      document.body.classList.add('is-celebrating');
      last = performance.now();
      raf = requestAnimationFrame(frame);
    }

    return {
      // Tempo de voo da salva de abertura (s) para esta tela.
      openingFlight,
      // Últimos segundos da contagem: as bombas da abertura já estão subindo
      // para estourar exatamente no zero (burstAtMs no relógio performance.now).
      prelude(burstAtMs){ ensureInit(); openingVolley(burstAtMs); },
      // Zero: começa o roteiro (quem chegou depois vê a salva sair agora).
      start(){
        ensureInit();
        openingVolley(performance.now() + openingFlight() * 1000);
        running = true;
        zeroAt = performance.now();
        script = buildScript();
        if (!raf) raf = requestAnimationFrame(frame);
      },
      stop(){ running = false; script = []; },
      fadeOut(ms){
        for (const cv of [canvas, glowCanvas]){
          cv.style.transition = 'opacity ' + ms + 'ms ease, filter ' + ms + 'ms ease';
          cv.style.filter = 'blur(3px)';
          cv.classList.remove('on');
        }
      }
    };
  })();

  function pad(n){ return String(Math.max(0, n)).padStart(2, '0'); }

  function goToGame(withIntro){
    location.replace(GAME_PAGE + (withIntro ? '?intro=1' : ''));
  }

  const prefersReducedMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  function celebrate(){
    soundChip.hidden = true;
    const reduceMotion = prefersReducedMotion();
    if (!reduceMotion) Fireworks.start();
    setTimeout(() => document.body.classList.add('is-finale'), reduceMotion ? 400 : SHOW_ITS_TIME_AT);
    setTimeout(() => Fireworks.stop(), SHOW_END_AT);
    setTimeout(() => exitShow(reduceMotion), reduceMotion ? 2600 : EXIT_AT);
    setTimeout(() => goToGame(true), reduceMotion ? 3600 : NAVIGATE_AT);
  }

  // Transição premium: o som baixa devagar (sem corte), o texto se desfaz, os
  // fogos se apagam, uma luz dourada floresce no centro e a tela escurece; a
  // página do jogo surge com a transição entre páginas do navegador.
  function exitShow(reduceMotion){
    Sfx.fadeOut(AUDIO_FADE_MS / 1000);
    document.body.classList.add('is-exiting');
    if (!reduceMotion) Fireworks.fadeOut(1800);
    setTimeout(() => exitLayer.classList.add('on'), reduceMotion ? 300 : 1300);
  }

  function finish(lateMs){
    if (finished) return;
    finished = true;
    document.body.classList.remove('final-ten');
    daysEl.textContent = hoursEl.textContent = minutesEl.textContent = secondsEl.textContent = '00';
    statusText.setAttribute('data-i18n', 'index:soonItsTime');
    statusText.textContent = (window.OSL_I18N && window.OSL_I18N.t('index:soonItsTime')) || 'Chegou a hora.';
    progressBar.style.width = '100%';
    if (!simulated && lateMs > CELEBRATION_WINDOW_MS) { goToGame(false); return; }
    celebrate();
  }

  function update(){
    const now  = Date.now();
    const diff = TARGET - now;

    if (diff <= 0){ finish(now - TARGET); return; }

    // Arredonda para cima: o "01" segundo fica na tela até o instante do zero.
    const total   = Math.ceil(diff / 1000);
    const days    = Math.floor(total / 86400);
    const hours   = Math.floor((total % 86400) / 3600);
    const minutes = Math.floor((total % 3600) / 60);
    const seconds = total % 60;

    daysEl.textContent    = pad(days);
    hoursEl.textContent   = pad(hours);
    minutesEl.textContent = pad(minutes);
    secondsEl.textContent = pad(seconds);

    // As bombas da abertura saem nos últimos segundos para estourar no zero
    // (o tempo de voo depende da altura do céu nesta tela).
    if (!prelaunchTimer && diff <= 6000){
      const lead = Fireworks.openingFlight() * 1000;
      prelaunchTimer = setTimeout(() => {
        if (!prefersReducedMotion()) Fireworks.prelude(performance.now() + Math.max(0, TARGET - Date.now()));
      }, Math.max(0, diff - lead - 60));
    }

    const finalTen = total <= 10;
    document.body.classList.toggle('final-ten', finalTen);
    if (lastSecond !== null && seconds !== lastSecond){
      playTick(finalTen);
      if (finalTen){ secondsBox.classList.remove('tick'); void secondsBox.offsetWidth; secondsBox.classList.add('tick'); }
    }
    lastSecond = seconds;
    if (diff <= SOUND_PROMPT_MS) Sfx.prefetch();
    if (!audioEnabled && diff <= SOUND_PROMPT_MS) soundChip.hidden = false;

    const range    = TARGET - START;
    const elapsed  = now   - START;
    progressBar.style.width = (Math.max(0, Math.min(1, elapsed / range)) * 100).toFixed(2) + '%';
  }

  // Agenda cada atualização na virada exata do segundo da contagem, para o
  // zero (e os fogos) acontecerem no mesmo instante do lançamento.
  function schedule(){
    if (finished) return;
    const remaining = TARGET - Date.now();
    const wait = remaining <= 0 ? 0 : (remaining % 1000 || 1000);
    setTimeout(() => { update(); schedule(); }, wait + 2);
  }

  update();
  schedule();
})();
</script>
