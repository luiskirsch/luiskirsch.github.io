<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Prelúdio Jogos — Contagem Regressiva</title>

<style>
:root{
  --text:#f5f7fb;
}

*{ box-sizing:border-box; }

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
  background:
    radial-gradient(45vw 45vw at 22% 48%, rgba(28,120,220,.12), transparent 60%),
    radial-gradient(38vw 38vw at 68% 28%, rgba(20,88,180,.10), transparent 62%),
    radial-gradient(60vw 60vw at 50% 50%, rgba(255,255,255,.02), transparent 68%),
    linear-gradient(180deg,#030608 0%,#010203 45%,#000000 100%);
  background-size:cover;
  background-repeat:no-repeat;
  background-color:#000;
}

body{
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
  -webkit-overflow-scrolling:touch;
  position:fixed;
  inset:0;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at center, transparent 48%, rgba(0,0,0,.26) 100%);
  opacity:.9;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(180deg, rgba(255,255,255,.018), rgba(255,255,255,0) 20%, rgba(255,255,255,0) 80%, rgba(255,255,255,.018));
  mix-blend-mode:screen;
  opacity:.22;
}

.page{
  width:100%;
  height:100dvh;
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:
    max(28px, env(safe-area-inset-top))
    max(18px, env(safe-area-inset-right))
    max(28px, env(safe-area-inset-bottom))
    max(18px, env(safe-area-inset-left));
  position:relative;
  z-index:1;
}

.hero{
  width:min(980px,100%);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.right{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  width:100%;
  max-width:760px;
}

.eyebrow{
  margin:0 0 2px;
  font-size:clamp(28px,2.6vw,64px);
  font-weight:800;
  letter-spacing:-.03em;
  line-height:1;
}

.title{
  margin:0;
  line-height:1.02;
  font-weight:900;
  letter-spacing:-.055em;
  text-shadow:
    0 10px 30px rgba(0,0,0,.45),
    0 2px 10px rgba(255,255,255,.05);
}

.title .line1{
  display:block;
  font-size:clamp(40px,4vw,64px);
  font-weight:800;
  opacity:.98;
}

.title .line2{
  display:block;
  font-size:clamp(56px,7vw,128px);
  font-weight:900;
  background:linear-gradient(180deg,#ffffff 0%, #eef4ff 45%, #dfe9f8 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.countdown{
  margin-top:16px;
  display:grid;
  grid-template-columns:repeat(4,minmax(108px,1fr));
  gap:14px;
  width:min(100%,680px);
}

.time-box{
  position:relative;
  border-radius:22px;
  padding:18px 14px 14px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.014)),
    radial-gradient(circle at top, rgba(72,183,244,.08), transparent 60%);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.06),
    inset 0 0 30px rgba(72,183,244,.03),
    0 14px 40px rgba(0,0,0,.24);
  text-align:center;
  overflow:hidden;
}

.time-box::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0) 40%);
  opacity:.7;
}

.time-value{
  display:block;
  position:relative;
  z-index:1;
  font-size:clamp(42px,5vw,78px);
  font-weight:900;
  letter-spacing:-.05em;
  font-variant-numeric:tabular-nums;
  text-shadow:0 8px 18px rgba(0,0,0,.35);
}

.time-label{
  display:block;
  position:relative;
  z-index:1;
  margin-top:8px;
  font-size:12px;
  letter-spacing:.26em;
  text-transform:uppercase;
  color:rgba(235,241,250,.78);
  font-weight:700;
}

.soon{
  margin:12px 0 0;
  font-size:clamp(34px,4vw,68px);
  font-weight:900;
  text-shadow:0 10px 26px rgba(0,0,0,.35);
}

.launch-line{
  margin-top:6px;
  font-size:13px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:rgba(214,224,237,.72);
}

.progress{
  margin-top:16px;
  width:min(100%,620px);
  height:10px;
  border-radius:999px;
  overflow:hidden;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:inset 0 0 24px rgba(0,0,0,.35);
}

.progress span{
  display:block;
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#8fd9ff,#48b7f4,#daf6ff);
  box-shadow:0 0 20px rgba(72,183,244,.35);
  transition:width .6s ease;
}

.footer-note{
  margin-top:10px;
  font-size:12px;
  color:rgba(214,224,237,.54);
  letter-spacing:.18em;
  text-transform:uppercase;
}

@media (max-width:560px){
  .page{
    padding:
      max(20px, env(safe-area-inset-top))
      max(14px, env(safe-area-inset-right))
      max(20px, env(safe-area-inset-bottom))
      max(14px, env(safe-area-inset-left));
  }

  .right{
    gap:10px;
    max-width:100%;
  }

  .eyebrow{
    font-size:clamp(22px, 7vw, 34px);
    margin-bottom:0;
  }

  .title{
    width:100%;
  }

  .title .line1{
    font-size:clamp(34px, 8vw, 42px);
  }

  .title .line2{
    font-size:clamp(54px, 16vw, 78px);
    line-height:.94;
  }

  .countdown{
    margin-top:12px;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    width:100%;
  }

  .time-box{
    padding:16px 12px 14px;
    border-radius:20px;
  }

  .time-value{
    font-size:clamp(38px, 12vw, 54px);
  }

  .time-label{
    font-size:11px;
    letter-spacing:.22em;
  }

  .soon{
    margin-top:10px;
    font-size:clamp(30px, 11vw, 48px);
  }

  .launch-line{
    margin-top:4px;
    font-size:11px;
    line-height:1.5;
    max-width:320px;
  }

  .progress{
    display:none;
  }

  .footer-note{
    font-size:10px;
    letter-spacing:.14em;
  }
}
</style>
</head>

<body>
<main class="page">
  <section class="hero">
    <div class="right">
      <p class="eyebrow">Pronto para</p>

      <h1 class="title">
        <span class="line1">O</span>
        <span class="line2">SextoLugar?</span>
      </h1>

      <div class="countdown">
        <div class="time-box">
          <span class="time-value" id="days">00</span>
          <span class="time-label">DIAS</span>
        </div>

        <div class="time-box">
          <span class="time-value" id="hours">00</span>
          <span class="time-label">HORAS</span>
        </div>

        <div class="time-box">
          <span class="time-value" id="minutes">00</span>
          <span class="time-label">MINUTOS</span>
        </div>

        <div class="time-box">
          <span class="time-value" id="seconds">00</span>
          <span class="time-label">SEGUNDOS</span>
        </div>
      </div>

      <p class="soon" id="statusText">Em breve!</p>
      <p class="launch-line">Lançamento em 30 de junho de 2026 às 20h</p>

      <div class="progress">
        <span id="progressBar"></span>
      </div>

      <p class="footer-note">Prelúdio Jogos • Contagem oficial</p>
    </div>
  </section>
</main>

<script>
(function(){
  const TARGET = new Date('2026-06-30T20:00:00-03:00').getTime();
  const START_REFERENCE = new Date('2026-03-12T00:00:00-03:00').getTime();

  const daysEl = document.getElementById('days');
  const hoursEl = document.getElementById('hours');
  const minutesEl = document.getElementById('minutes');
  const secondsEl = document.getElementById('seconds');
  const progressBar = document.getElementById('progressBar');
  const statusText = document.getElementById('statusText');

  let audioCtx = null;
  let audioEnabled = false;
  let lastSecondShown = null;

  function enableAudio(){
    if (audioEnabled) return;

    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;

    try{
      audioCtx = new Ctx();
      if (audioCtx.state === 'suspended'){
        audioCtx.resume().catch(()=>{});
      }
      audioEnabled = true;
    }catch(e){}
  }

  window.addEventListener('pointerdown', enableAudio, { once:true });
  window.addEventListener('touchstart', enableAudio, { once:true });

  function playTick(){
    if (!audioEnabled || !audioCtx) return;

    try{
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      osc.type = 'square';
      osc.frequency.setValueAtTime(1850, now);
      osc.frequency.exponentialRampToValueAtTime(1320, now + 0.018);

      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(2100, now);
      filter.Q.setValueAtTime(5.5, now);

      gain.gain.setValueAtTime(0.00001, now);
      gain.gain.exponentialRampToValueAtTime(0.075, now + 0.0025);
      gain.gain.exponentialRampToValueAtTime(0.00001, now + 0.022);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.028);
    }catch(e){}
  }

  function pad(n){
    return String(Math.max(0, n)).padStart(2, '0');
  }

  function clamp(v,min,max){
    return Math.max(min,Math.min(max,v));
  }

  function update(){
    const now = Date.now();
    let diff = TARGET - now;

    if(diff <= 0){
      daysEl.textContent = '00';
      hoursEl.textContent = '00';
      minutesEl.textContent = '00';
      secondsEl.textContent = '00';
      statusText.textContent = 'Chegou a hora.';
      progressBar.style.width = '100%';
      return;
    }

    const totalSeconds = Math.floor(diff / 1000);

    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    daysEl.textContent = pad(days);
    hoursEl.textContent = pad(hours);
    minutesEl.textContent = pad(minutes);
    secondsEl.textContent = pad(seconds);

    if(lastSecondShown !== null && seconds !== lastSecondShown){
      playTick();
    }
    lastSecondShown = seconds;

    const totalRange = TARGET - START_REFERENCE;
    const elapsed = now - START_REFERENCE;
    const progress = clamp(elapsed / totalRange, 0, 1);

    progressBar.style.width = (progress * 100).toFixed(2) + '%';
  }

  update();
  setInterval(update, 1000);
})();
</script>
</body>
</html>
