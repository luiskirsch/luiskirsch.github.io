<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Contagem Regressiva — Prelúdio Jogos</title>
  <link rel="icon" type="image/png" href="./favicon.png" />

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="referrer" content="no-referrer" />

  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    base-uri 'self';
    object-src 'none';
    frame-ancestors 'none';
    img-src 'self' data: blob:;
    media-src 'self' data: blob:;
    connect-src 'self';
    font-src 'self' data:;
    style-src 'self' 'unsafe-inline';
    script-src 'self' 'unsafe-inline';
    upgrade-insecure-requests;
    block-all-mixed-content;
  ">

  <style>
    :root{
      --bg:#000000;
      --bg2:#05070b;
      --text:#f2f2f2;
      --muted:rgba(255,255,255,.72);
      --muted2:rgba(255,255,255,.48);
      --blue:#79d7ff;
      --blue-strong:#53c7ff;
      --glow:rgba(83,199,255,.45);
    }

    *{ box-sizing:border-box; }

    html,body{
      margin:0;
      min-height:100%;
      background:
        radial-gradient(circle at 32% 48%, rgba(45,115,255,.10), transparent 24%),
        radial-gradient(circle at 70% 50%, rgba(0,140,255,.09), transparent 22%),
        linear-gradient(180deg, #010101 0%, #000000 58%, #010204 100%);
      color:var(--text);
      font-family: Inter, Arial, Helvetica, sans-serif;
      overflow-x:hidden;
    }

    body{
      min-height:100vh;
      padding:
        max(20px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .page{
      width:min(1400px, 100%);
      min-height:min(860px, calc(100vh - 40px));
      display:grid;
      grid-template-columns: minmax(320px, 520px) minmax(320px, 1fr);
      align-items:center;
      gap:clamp(20px, 4vw, 90px);
      position:relative;
    }

    .page::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 50%, rgba(67,144,255,.08), transparent 32%);
      filter:blur(18px);
    }

    .leftWrap{
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
      min-height:680px;
    }

    .hourglassStage{
      position:relative;
      width:min(100%, 470px);
      aspect-ratio: 0.73 / 1;
      display:flex;
      align-items:center;
      justify-content:center;
      filter:
        drop-shadow(0 0 22px rgba(120,220,255,.08))
        drop-shadow(0 0 55px rgba(70,150,255,.12));
    }

    .hourglassGlow{
      position:absolute;
      inset:10% 14%;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 38%, rgba(125,220,255,.22), transparent 30%),
        radial-gradient(circle at 50% 68%, rgba(50,160,255,.18), transparent 28%);
      filter:blur(28px);
      pointer-events:none;
      z-index:0;
      animation:glowPulse 4.2s ease-in-out infinite;
    }

    .hourglassImg{
      position:relative;
      z-index:3;
      width:100%;
      height:100%;
      object-fit:contain;
      user-select:none;
      -webkit-user-drag:none;
      pointer-events:none;
    }

    /* ÁREA DA AREIA */
    .sandSystem{
      position:absolute;
      inset:0;
      z-index:2;
      pointer-events:none;
    }

    /* topo */
    .sandTop{
      position:absolute;
      left:31%;
      top:18.5%;
      width:38%;
      height:17.5%;
      overflow:hidden;
      border-radius:0 0 46% 46% / 0 0 26% 26%;
      filter:blur(.15px);
    }

    .sandTopFill{
      position:absolute;
      left:0;
      bottom:0;
      width:100%;
      height:100%;
      transform-origin:bottom center;
      background:
        radial-gradient(circle at 50% 18%, rgba(210,245,255,.92), rgba(150,222,255,.96) 38%, rgba(90,186,255,.98) 78%, rgba(54,145,255,.98) 100%);
      clip-path: ellipse(50% 52% at 50% 100%);
      box-shadow:
        0 0 30px rgba(90,190,255,.18),
        inset 0 18px 25px rgba(255,255,255,.18);
      animation:topSandShrink 16s linear infinite;
    }

    .sandTopShine{
      position:absolute;
      left:13%;
      top:10%;
      width:74%;
      height:28%;
      border-radius:50%;
      background:linear-gradient(180deg, rgba(255,255,255,.36), rgba(255,255,255,0));
      filter:blur(5px);
      opacity:.75;
      animation:shineFloat 4.5s ease-in-out infinite;
    }

    /* fio central */
    .sandStream{
      position:absolute;
      left:49.2%;
      top:41.2%;
      width:1.35%;
      height:25.2%;
      transform:translateX(-50%);
      overflow:hidden;
      border-radius:999px;
    }

    .sandStream::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:999px;
      background:
        linear-gradient(180deg,
          rgba(218,248,255,.98) 0%,
          rgba(145,224,255,.98) 24%,
          rgba(86,190,255,.98) 72%,
          rgba(75,175,255,.88) 100%);
      box-shadow:
        0 0 10px rgba(105,205,255,.70),
        0 0 22px rgba(55,160,255,.44);
      animation:streamPulse 1.1s ease-in-out infinite;
    }

    .sandParticles{
      position:absolute;
      inset:0;
      overflow:hidden;
    }

    .sandParticles span{
      position:absolute;
      left:50%;
      top:-10%;
      width:4px;
      height:10px;
      margin-left:-2px;
      border-radius:999px;
      background:rgba(173,233,255,.95);
      box-shadow:0 0 8px rgba(102,205,255,.9);
      animation:particleFall 1.2s linear infinite;
    }

    .sandParticles span:nth-child(2){ animation-delay:.2s; opacity:.8; }
    .sandParticles span:nth-child(3){ animation-delay:.42s; opacity:.7; }
    .sandParticles span:nth-child(4){ animation-delay:.64s; opacity:.85; }

    /* base */
    .sandBottom{
      position:absolute;
      left:34.6%;
      top:63.2%;
      width:30.8%;
      height:14.2%;
      overflow:hidden;
      border-radius:46% 46% 18% 18% / 60% 60% 18% 18%;
      filter:blur(.15px);
    }

    .sandBottomFill{
      position:absolute;
      left:0;
      bottom:0;
      width:100%;
      height:100%;
      transform-origin:bottom center;
      background:
        radial-gradient(circle at 50% 18%, rgba(214,247,255,.90), rgba(158,228,255,.96) 34%, rgba(87,188,255,.98) 76%, rgba(45,140,255,.98) 100%);
      clip-path: ellipse(50% 54% at 50% 100%);
      box-shadow:
        0 0 25px rgba(80,190,255,.18),
        inset 0 10px 20px rgba(255,255,255,.12);
      animation:bottomSandGrow 16s linear infinite;
    }

    .sandBottomCore{
      position:absolute;
      left:43%;
      top:0;
      width:14%;
      height:80%;
      background:radial-gradient(circle at 50% 0%, rgba(180,235,255,.95), rgba(90,190,255,.55) 52%, rgba(90,190,255,0) 78%);
      filter:blur(6px);
      animation:impactPulse 1.2s ease-in-out infinite;
    }

    /* reflexos no vidro */
    .glassReflections{
      position:absolute;
      inset:0;
      z-index:4;
      pointer-events:none;
    }

    .glassReflections::before,
    .glassReflections::after{
      content:"";
      position:absolute;
      background:linear-gradient(180deg, rgba(255,255,255,.30), rgba(255,255,255,.02));
      border-radius:999px;
      filter:blur(2px);
      opacity:.42;
    }

    .glassReflections::before{
      left:34.8%;
      top:16.5%;
      width:2.6%;
      height:53%;
      transform:rotate(8deg);
    }

    .glassReflections::after{
      right:35.2%;
      top:16.5%;
      width:2.1%;
      height:53%;
      transform:rotate(-8deg);
      opacity:.28;
    }

    .rightWrap{
      position:relative;
      z-index:2;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:flex-start;
    }

    .titleSmall{
      margin:0;
      font-size:clamp(34px, 4vw, 72px);
      line-height:.95;
      font-weight:800;
      letter-spacing:-.03em;
      color:#ffffff;
      text-shadow:0 0 24px rgba(255,255,255,.04);
    }

    .titleBig{
      margin:10px 0 0;
      font-size:clamp(62px, 8vw, 142px);
      line-height:.90;
      font-weight:900;
      letter-spacing:-.055em;
      color:#f4f4f4;
      text-shadow:
        0 0 26px rgba(255,255,255,.04),
        0 8px 30px rgba(0,0,0,.35);
    }

    .countdown{
      margin-top:26px;
      display:grid;
      grid-template-columns:repeat(4, minmax(78px, auto));
      gap:clamp(14px, 2vw, 30px);
      align-items:end;
    }

    .unit{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      min-width:0;
    }

    .num{
      font-size:clamp(52px, 7vw, 116px);
      line-height:.90;
      font-weight:900;
      letter-spacing:-.06em;
      color:#f4f4f4;
      text-shadow:
        0 0 20px rgba(255,255,255,.03),
        0 12px 30px rgba(0,0,0,.42);
      font-variant-numeric: tabular-nums;
    }

    .label{
      margin-top:10px;
      font-size:clamp(12px, 1vw, 16px);
      font-weight:700;
      letter-spacing:.35em;
      text-transform:uppercase;
      color:rgba(255,255,255,.76);
      padding-left:4px;
    }

    .colon{
      align-self:center;
      font-size:clamp(50px, 6vw, 96px);
      line-height:1;
      font-weight:900;
      color:rgba(255,255,255,.88);
      margin-top:-10px;
    }

    .coming{
      margin:26px 0 0;
      font-size:clamp(34px, 4vw, 78px);
      line-height:.96;
      font-weight:900;
      letter-spacing:-.04em;
      color:#ffffff;
    }

    .date{
      margin-top:18px;
      font-size:clamp(14px, 1.2vw, 18px);
      color:var(--muted);
      letter-spacing:.02em;
    }

    .statusLine{
      margin-top:10px;
      font-size:clamp(13px, 1.05vw, 16px);
      color:var(--muted2);
    }

    .brand{
      margin-top:28px;
      font-size:13px;
      letter-spacing:.30em;
      text-transform:uppercase;
      color:rgba(255,255,255,.36);
    }

    @keyframes topSandShrink{
      0%   { transform:scaleY(1); opacity:1; }
      85%  { transform:scaleY(.16); opacity:.96; }
      100% { transform:scaleY(.06); opacity:.94; }
    }

    @keyframes bottomSandGrow{
      0%   { transform:scaleY(.12); opacity:.95; }
      85%  { transform:scaleY(.92); opacity:1; }
      100% { transform:scaleY(1); opacity:1; }
    }

    @keyframes streamPulse{
      0%,100%{ opacity:.85; transform:scaleY(1); }
      50%{ opacity:1; transform:scaleY(1.04); }
    }

    @keyframes particleFall{
      0%   { transform:translateY(-6%) scale(.85); opacity:0; }
      15%  { opacity:.95; }
      100% { transform:translateY(112%) scale(1); opacity:0; }
    }

    @keyframes glowPulse{
      0%,100%{ opacity:.75; transform:scale(1); }
      50%{ opacity:1; transform:scale(1.04); }
    }

    @keyframes shineFloat{
      0%,100%{ transform:translateY(0); opacity:.68; }
      50%{ transform:translateY(4px); opacity:.88; }
    }

    @keyframes impactPulse{
      0%,100%{ opacity:.55; transform:scale(1); }
      50%{ opacity:1; transform:scale(1.08); }
    }

    @media (max-width: 1100px){
      .page{
        grid-template-columns:1fr;
        gap:22px;
        justify-items:center;
        text-align:center;
        min-height:auto;
      }

      .leftWrap{
        min-height:unset;
      }

      .rightWrap{
        align-items:center;
      }

      .countdown{
        justify-content:center;
      }

      .unit{
        align-items:center;
      }
    }

    @media (max-width: 700px){
      body{
        padding:16px;
      }

      .page{
        gap:10px;
      }

      .hourglassStage{
        width:min(82vw, 360px);
      }

      .countdown{
        grid-template-columns:repeat(2, minmax(90px, auto));
        gap:18px 24px;
      }

      .colon{
        display:none;
      }

      .titleBig{
        margin-top:8px;
      }

      .coming{
        margin-top:22px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="leftWrap" aria-hidden="true">
      <div class="hourglassStage">
        <div class="hourglassGlow"></div>

        <div class="sandSystem">
          <div class="sandTop">
            <div class="sandTopFill"></div>
            <div class="sandTopShine"></div>
          </div>

          <div class="sandStream">
            <div class="sandParticles">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>

          <div class="sandBottom">
            <div class="sandBottomFill"></div>
            <div class="sandBottomCore"></div>
          </div>
        </div>

        <img
          class="hourglassImg"
          src="./ampulheta.png"
          alt="Ampulheta"
          draggable="false"
          referrerpolicy="no-referrer"
        />

        <div class="glassReflections"></div>
      </div>
    </section>

    <section class="rightWrap">
      <h1 class="titleSmall">Pronto para</h1>
      <div class="titleBig">MyDrugs 2.0?</div>

      <div class="countdown" aria-live="polite" aria-label="Contagem regressiva">
        <div class="unit">
          <div class="num" id="days">000</div>
          <div class="label">D</div>
        </div>

        <div class="colon">:</div>

        <div class="unit">
          <div class="num" id="hours">00</div>
          <div class="label">H</div>
        </div>

        <div class="colon">:</div>

        <div class="unit">
          <div class="num" id="minutes">00</div>
          <div class="label">M</div>
        </div>

        <div class="colon">:</div>

        <div class="unit">
          <div class="num" id="seconds">00</div>
          <div class="label">S</div>
        </div>
      </div>

      <div class="coming">Em breve!</div>
      <div class="date" id="launchText">Lançamento: 30 de junho de 2026 às 20h</div>
      <div class="statusLine" id="statusText">Preparando a contagem…</div>
      <div class="brand">PRELÚDIO JOGOS</div>
    </section>
  </main>

  <script>
    (function(){
      var TARGET = new Date("2026-06-30T20:00:00-03:00");

      var daysEl = document.getElementById("days");
      var hoursEl = document.getElementById("hours");
      var minutesEl = document.getElementById("minutes");
      var secondsEl = document.getElementById("seconds");
      var statusText = document.getElementById("statusText");
      var launchText = document.getElementById("launchText");

      function pad(n){
        return String(n).padStart(2, "0");
      }

      function padDays(n){
        return String(n).padStart(3, "0");
      }

      try{
        var fmt = new Intl.DateTimeFormat("pt-BR", {
          dateStyle: "long",
          timeStyle: "short"
        });
        launchText.textContent = "Lançamento: " + fmt.format(TARGET);
      } catch(e){}

      function updateCountdown(){
        var now = new Date();
        var diff = TARGET.getTime() - now.getTime();

        if (diff <= 0){
          daysEl.textContent = "000";
          hoursEl.textContent = "00";
          minutesEl.textContent = "00";
          secondsEl.textContent = "00";
          statusText.textContent = "A contagem terminou.";
          return;
        }

        var totalSeconds = Math.floor(diff / 1000);
        var days = Math.floor(totalSeconds / 86400);
        var hours = Math.floor((totalSeconds % 86400) / 3600);
        var minutes = Math.floor((totalSeconds % 3600) / 60);
        var seconds = totalSeconds % 60;

        daysEl.textContent = padDays(days);
        hoursEl.textContent = pad(hours);
        minutesEl.textContent = pad(minutes);
        secondsEl.textContent = pad(seconds);

        statusText.textContent = "Faltam " + days + " dia(s) para o lançamento.";
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    })();
  </script>
</body>
</html>
