<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recording | O SextoLugar</title>

  <style>
    :root{
      --bg:#050505;
      --gold:#e6c07b;
      --gold-dim:rgba(215,176,107,.55);
      --line:rgba(215,176,107,.28);
      --muted:#a7a7a7;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }

    html,body{
      width:100%; height:100%; overflow:hidden;
      background:
        radial-gradient(1200px 700px at 50% 20%, rgba(230,192,123,.10), transparent 55%),
        radial-gradient(900px 560px at 18% 15%, rgba(255,255,255,.06), transparent 60%),
        radial-gradient(900px 560px at 82% 75%, rgba(255,255,255,.05), transparent 62%),
        var(--bg);
      color:#f2f2f2;
      font-family: ui-serif, Georgia, "Times New Roman", serif;
    }

    body::before{
      content:"";
      position:fixed;
      inset:-20%;
      pointer-events:none;
      background:
        radial-gradient(700px 360px at 50% 35%, rgba(230,192,123,.08), transparent 60%),
        radial-gradient(900px 480px at 60% 70%, rgba(255,255,255,.05), transparent 65%);
      filter:blur(12px);
      opacity:.72;
      animation:pulseGlow 4.8s ease-in-out infinite;
    }

    @keyframes pulseGlow{
      0%,100%{ opacity:.58; transform:translateY(0) scale(1); }
      50%{ opacity:.92; transform:translateY(-6px) scale(1.01); }
    }

    /* ─── Game Table Grid ─── */
    .scene{
      position:relative;
      z-index:1;
      width:100%;
      height:100%;
      display:grid;
      grid-template-columns: clamp(80px,10vw,130px) 1fr clamp(80px,10vw,130px);
      gap:14px;
      padding:20px;
      align-items:center;
    }

    /* ─── Side Columns ─── */
    .videoColLeft,
    .videoColRight{
      display:flex;
      flex-direction:column;
      gap:10px;
      align-self:stretch;
      justify-content:center;
    }

    /* ─── Placeholder (empty slot) ─── */
    .videoColPlaceholder{
      position:relative;
      width:100%;
      aspect-ratio:1/1;
      border:1px solid rgba(255,255,255,.10);
      border-radius:16px;
      background:#000;
      display:grid;
      place-items:center;
      overflow:hidden;
      box-shadow:
        0 0 5px  rgba(255,255,255,.10),
        0 0 14px rgba(255,255,255,.06),
        0 0 30px rgba(255,255,255,.02),
        inset 0 0 10px rgba(255,255,255,.05);
      animation:whiteGlowPulse 7s ease-in-out infinite;
    }

    @keyframes whiteGlowPulse{
      0%,100%{
        border-color:rgba(255,255,255,.10);
        box-shadow:
          0 0 5px rgba(255,255,255,.10),
          0 0 14px rgba(255,255,255,.06),
          0 0 30px rgba(255,255,255,.02),
          inset 0 0 10px rgba(255,255,255,.05);
      }
      50%{
        border-color:rgba(255,255,255,.28);
        box-shadow:
          0 0 5px rgba(255,255,255,.25),
          0 0 14px rgba(255,255,255,.16),
          0 0 30px rgba(255,255,255,.08),
          inset 0 0 10px rgba(255,255,255,.12);
      }
    }

    /* ─── Video Tiles ─── */
    .videoTile{
      position:relative;
      width:100%;
      aspect-ratio:1/1;
      background:
        radial-gradient(circle at 50% 0%, rgba(215,176,107,.06), transparent 50%),
        linear-gradient(180deg, #0f0b08, #060504);
      border:1px solid var(--line);
      border-radius:16px;
      overflow:hidden;
      box-shadow:
        0 6px 22px rgba(0,0,0,.50),
        inset 0 1px 0 rgba(255,255,255,.04);
    }

    .videoTile video,
    .videoTile audio{
      width:100%; height:100%;
      object-fit:cover;
      display:block;
      background:#000;
    }

    .videoTileLabel{
      position:absolute;
      left:8px; bottom:8px;
      max-width:calc(100% - 16px);
      padding:5px 9px;
      border-radius:999px;
      background:rgba(0,0,0,.60);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter:blur(4px);
      color:#fff;
      font-size:11px;
      font-weight:700;
      letter-spacing:.03em;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      font-family:ui-sans-serif, system-ui, sans-serif;
    }

    /* ─── Center Column ─── */
    .cardCenter{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px;
    }

    /* ─── Ritual Card Wrap ─── */
    .ritualCardWrap{
      position:relative;
      height:55vh;
      aspect-ratio:5/7;
      flex-shrink:0;
      transform:rotateX(3deg);
      transform-style:preserve-3d;
    }

    @keyframes whiteGlowPulseCard{
      0%,100%{
        box-shadow:
          0 14px 22px rgba(0,0,0,.75),
          0 0 8px rgba(255,255,255,.12),
          0 0 22px rgba(255,255,255,.08),
          0 0 50px rgba(255,255,255,.04),
          inset 0 0 14px rgba(255,255,255,.07);
      }
      50%{
        box-shadow:
          0 14px 22px rgba(0,0,0,.75),
          0 0 8px rgba(255,255,255,.32),
          0 0 22px rgba(255,255,255,.20),
          0 0 50px rgba(255,255,255,.10),
          inset 0 0 14px rgba(255,255,255,.18);
      }
    }

    .ritualVisualCard{
      width:100%; height:100%;
      position:relative;
      border-radius:20px;
      overflow:hidden;
      backface-visibility:hidden;
      background:
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,.008) 2px, rgba(255,255,255,.008) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(255,255,255,.006) 3px, rgba(255,255,255,.006) 6px),
        radial-gradient(ellipse 80% 30% at 50% -10%, rgba(255,248,220,.18), transparent 60%),
        radial-gradient(ellipse 60% 60% at 50% 40%, rgba(205,163,92,.07), transparent 70%),
        linear-gradient(160deg, #1e1810 0%, #17120c 30%, #100d08 60%, #0d0b07 100%);
      border:1px solid rgba(215,176,107,.55);
      outline:1px solid rgba(0,0,0,.8);
      outline-offset:-3px;
      animation:whiteGlowPulseCard 7s ease-in-out infinite;
    }

    .ritualVisualCard::before{
      content:"";
      position:absolute;
      inset:8px;
      border-radius:14px;
      border:1px solid rgba(215,176,107,.38);
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,.5),
        0 0 0 1px rgba(215,176,107,.10);
      pointer-events:none;
      z-index:2;
    }

    .ritualVisualCard::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:20px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.13) 0%, rgba(255,255,255,.04) 20%, transparent 45%),
        linear-gradient(to bottom, transparent 75%, rgba(215,176,107,.06) 100%);
      pointer-events:none;
      z-index:3;
    }

    .ritualCardFrame{
      position:relative;
      z-index:4;
      height:100%;
      padding:16px 14px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:space-between;
      text-align:center;
      color:#f7f3ea;
      overflow:hidden;
    }

    .ritualTopOrnaments{
      width:100%;
      display:grid;
      grid-template-columns:1fr auto auto auto 1fr;
      align-items:center;
      gap:7px;
    }

    .ritualLine{
      height:1px;
      background:linear-gradient(90deg, transparent, rgba(215,176,107,.5) 30%, rgba(255,240,180,.9) 50%, rgba(215,176,107,.5) 70%, transparent);
    }

    .ritualStars{
      color:#f3eee3;
      font-size:10px;
      letter-spacing:.20em;
      white-space:nowrap;
      opacity:.90;
    }

    .ritualSigil{
      color:#e8d5a3;
      font-size:18px;
      line-height:1;
      text-shadow:0 0 12px rgba(215,176,107,.6), 0 1px 0 rgba(0,0,0,.8);
    }

    .ritualCardNumber{
      font-size:10px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:rgba(215,176,107,.80);
      text-shadow:0 1px 2px rgba(0,0,0,.6);
      font-family:ui-sans-serif, system-ui, sans-serif;
    }

    .ritualCardMainTitle{
      font-size:clamp(16px, 1.5vw, 24px);
      line-height:1.05;
      font-weight:700;
      letter-spacing:.03em;
      text-align:center;
      color:#fff8ee;
      text-transform:uppercase;
      word-break:break-word;
      font-family:Georgia, "Times New Roman", serif;
      text-shadow:0 2px 8px rgba(0,0,0,.8), 0 0 20px rgba(215,176,107,.25);
    }

    .ritualMainInstruction{
      font-size:clamp(0.72rem, 1.6vh, 1rem);
      line-height:1.4;
      text-align:center;
      color:rgba(245,238,220,.92);
      text-shadow:0 1px 3px rgba(0,0,0,.7);
      font-family:Georgia, "Times New Roman", serif;
    }

    .ritualMidDetails{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:5px;
    }

    .ritualMiniDivider{
      width:72%;
      display:flex;
      align-items:center;
      gap:8px;
    }

    .ritualMiniDivider span{
      flex:1;
      height:1px;
      background:linear-gradient(90deg, transparent, rgba(215,176,107,.75), transparent);
    }

    .ritualMiniDivider i{
      width:7px; height:7px;
      border-radius:50%;
      display:block;
      background:radial-gradient(circle, #fff8e0 0%, #d4a84b 50%, transparent 75%);
      box-shadow:0 0 6px rgba(215,176,107,.5);
    }

    .ritualRuleText{
      font-size:clamp(9px, 1.1vh, 12px);
      line-height:1.35;
      color:rgba(240,232,210,.88);
      text-shadow:0 1px 2px rgba(0,0,0,.6);
      font-family:ui-sans-serif, system-ui, sans-serif;
    }

    .ritualRuleText strong{
      display:inline-block;
      margin-top:1px;
      font-size:clamp(9px, 1.1vh, 12px);
      letter-spacing:.04em;
      color:#fff;
      text-shadow:0 0 8px rgba(255,255,255,.3);
    }

    .ritualRuleText.subtle{
      font-size:clamp(8px, 1vh, 11px);
      opacity:.85;
    }

    .goldText{ color:#e7c57f !important; text-shadow:0 0 8px rgba(215,176,107,.4) !important; }

    .ritualWhiteDivider{
      width:76%; height:1px;
      background:linear-gradient(90deg, transparent, rgba(255,255,255,.5) 30%, rgba(255,255,255,.9) 50%, rgba(255,255,255,.5) 70%, transparent);
      box-shadow:0 0 6px rgba(255,255,255,.2);
    }

    .ritualFinalPhrase{
      font-size:clamp(8px, 1vh, 10px);
      line-height:1.35;
      letter-spacing:.10em;
      text-transform:uppercase;
      color:rgba(215,176,107,.75);
      text-shadow:0 1px 3px rgba(0,0,0,.7);
      font-family:ui-sans-serif, system-ui, sans-serif;
    }

    .ritualFingerprint{
      position:relative;
      width:44px; height:44px;
      flex-shrink:0;
      opacity:.65;
    }

    .ritualFingerprint .finger{
      position:absolute;
      inset:0;
      border:1.5px solid rgba(215,176,107,.80);
      border-color:rgba(215,176,107,.80) transparent transparent rgba(215,176,107,.80);
      border-radius:58% 42% 60% 40% / 50% 46% 54% 50%;
      transform-origin:center;
    }

    .ritualFingerprint .finger1{ inset:3px; }
    .ritualFingerprint .finger2{ inset:8px; }
    .ritualFingerprint .finger3{ inset:13px; }
    .ritualFingerprint .finger4{ inset:18px; }
    .ritualFingerprint .finger5{ inset:23px; }

    .ritualBottomOrnaments{
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:10px;
    }

    .ritualBottomSet{
      width:35%;
      display:flex;
      flex-direction:column;
      gap:4px;
    }

    .ritualBottomSet span{
      display:block;
      height:1.5px;
      border-radius:999px;
      background:linear-gradient(90deg, rgba(215,176,107,.85), transparent);
    }

    .ritualBottomSet.left span:nth-child(1){ width:100%; }
    .ritualBottomSet.left span:nth-child(2){ width:70%; }
    .ritualBottomSet.left span:nth-child(3){ width:48%; }

    .ritualBottomSet.right{ align-items:flex-end; }
    .ritualBottomSet.right span{ background:linear-gradient(90deg, transparent, rgba(215,176,107,.85)); }

    /* ─── Card with facedown placeholder text ─── */
    .cardWaiting{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:10px;
      height:100%;
      opacity:.55;
      font-size:13px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:rgba(215,176,107,.8);
      font-family:ui-sans-serif, system-ui, sans-serif;
    }

    /* ─── Self (center-bottom) Video Tile ─── */
    .videoSelfSlot{
      width:100%;
      display:flex;
      justify-content:center;
    }

    .videoSelfSlot .videoTile{
      width:min(220px,100%);
      aspect-ratio:4/3;
      border:2px solid var(--gold) !important;
      box-shadow:
        0 0 24px rgba(215,176,107,.32),
        0 8px 28px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.06) !important;
    }
  </style>
</head>
<body>
  <div class="scene">

    <!-- Left column: players 1 & 2 -->
    <div class="videoColLeft" id="colLeft">
      <div class="videoColPlaceholder" id="slotL1"></div>
      <div class="videoColPlaceholder" id="slotL2"></div>
    </div>

    <!-- Center: ritual card + player 5 below -->
    <div class="cardCenter">
      <div class="ritualCardWrap">
        <article class="ritualVisualCard">
          <div class="ritualCardFrame">

            <div class="ritualTopOrnaments">
              <div class="ritualLine"></div>
              <div class="ritualStars">✦ ✦ ✦</div>
              <div class="ritualSigil">△</div>
              <div class="ritualStars">✦ ✦ ✦</div>
              <div class="ritualLine"></div>
            </div>

            <div class="ritualCardNumber" id="ritualCardType">AGUARDANDO</div>
            <h3 class="ritualCardMainTitle" id="ritualCardTitle">O SextoLugar</h3>

            <div class="ritualMainInstruction" id="ritualCardText">
              Aguardando o anfitrião iniciar.<br>
              Depois disso, a carta se transforma.
            </div>

            <div class="ritualMidDetails">
              <div class="ritualMiniDivider"><span></span><i></i><span></span></div>
              <p class="ritualRuleText" id="ritualRuleText"></p>
              <div class="ritualMiniDivider"><span></span><i></i><span></span></div>
              <p class="ritualRuleText subtle" id="ritualRuleSubtle"></p>
            </div>

            <div class="ritualWhiteDivider"></div>

            <p class="ritualFinalPhrase" id="ritualFinalPhrase"></p>

            <div class="ritualFingerprint">
              <div class="finger finger1"></div>
              <div class="finger finger2"></div>
              <div class="finger finger3"></div>
              <div class="finger finger4"></div>
              <div class="finger finger5"></div>
            </div>

            <div class="ritualBottomOrnaments">
              <div class="ritualBottomSet left">
                <span></span><span></span><span></span>
              </div>
              <div class="ritualBottomSet right">
                <span></span><span></span><span></span>
              </div>
            </div>

          </div>
        </article>
      </div>

      <div class="videoSelfSlot" id="slotCenter"></div>
    </div>

    <!-- Right column: players 3 & 4 -->
    <div class="videoColRight" id="colRight">
      <div class="videoColPlaceholder" id="slotR1"></div>
      <div class="videoColPlaceholder" id="slotR2"></div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    import { Room, RoomEvent } from "https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.esm.mjs";

    const BACKEND_BASE_URL = "https://osl-video-server-production.up.railway.app";
    const LIVEKIT_URL      = "wss://osextolugar-eqa7q1iz.livekit.cloud";

    const firebaseConfig = {
      apiKey:"AIzaSyC8sSvA7_1HPYRFGfgdgzstkP_yQHadY-c",
      authDomain:"osextolugar-game.firebaseapp.com",
      projectId:"osextolugar-game",
      storageBucket:"osextolugar-game.firebasestorage.app",
      messagingSenderId:"947922328721",
      appId:"1:947922328721:web:989522c99e16ab449f3330"
    };

    const params   = new URLSearchParams(window.location.search);
    const roomCode = params.get("room") || params.get("sala") || "SL-0001";

    // ── Firestore: sync current card ────────────────────────────────────
    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    const cardTypeEl    = document.getElementById("ritualCardType");
    const cardTitleEl   = document.getElementById("ritualCardTitle");
    const cardTextEl    = document.getElementById("ritualCardText");
    const ruleTextEl    = document.getElementById("ritualRuleText");
    const ruleSubtleEl  = document.getElementById("ritualRuleSubtle");
    const finalPhraseEl = document.getElementById("ritualFinalPhrase");

    onSnapshot(doc(db, "salas", roomCode, "ritual", "state"), (snap) => {
      if (!snap.exists()) return;
      const card = snap.data().currentCard || null;
      if (!card) return;

      cardTypeEl.textContent    = card.type   ? `CARTA — ${card.type.toUpperCase()}` : "CARTA RITUAL";
      cardTitleEl.textContent   = card.title  || "";
      cardTextEl.innerHTML      = String(card.text || "").replace(/\n/g, "<br>");
      ruleTextEl.innerHTML      = card.rule   ? String(card.rule).replace(/\n/g, "<br>") : "";
      ruleSubtleEl.innerHTML    = card.subtle ? String(card.subtle).replace(/\n/g, "<br>") : "";
      finalPhraseEl.textContent = card.phrase || "";
    });

    // ── Slot assignment ──────────────────────────────────────────────────
    // Order: L1, L2, R1, R2, CENTER (5 spots)
    const SLOT_IDS = ["slotL1", "slotL2", "slotR1", "slotR2", "slotCenter"];
    const slotByIdentity = new Map(); // identity → slotId
    const freeSlots = [...SLOT_IDS];

    function escapeHtml(s){
      return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function getOrAssignSlot(identity){
      if (slotByIdentity.has(identity)) return slotByIdentity.get(identity);
      if (freeSlots.length === 0) return null;
      const slotId = freeSlots.shift();
      slotByIdentity.set(identity, slotId);
      return slotId;
    }

    function releaseSlot(identity){
      const slotId = slotByIdentity.get(identity);
      if (!slotId) return;
      slotByIdentity.delete(identity);
      freeSlots.unshift(slotId); // return to front so next join reuses it
      // restore placeholder
      const el = document.getElementById(slotId);
      if (el){
        const isSelf = slotId === "slotCenter";
        if (isSelf){
          el.innerHTML = "";
          el.className = "videoSelfSlot";
          el.id = slotId;
        } else {
          el.innerHTML = "";
          el.className = "videoColPlaceholder";
          el.id = slotId;
        }
      }
    }

    function buildTile(identity, label){
      const tile = document.createElement("div");
      tile.className = "videoTile";
      tile.dataset.identity = identity;

      const media = document.createElement("div");
      media.className = "videoMedia";
      media.style.cssText = "position:absolute;inset:0;overflow:hidden;";

      const lbl = document.createElement("div");
      lbl.className = "videoTileLabel";
      lbl.innerHTML = escapeHtml(label || "Jogador");

      tile.appendChild(media);
      tile.appendChild(lbl);
      return tile;
    }

    function ensureTile(identity, label){
      // Check if tile already exists in any slot
      const existing = document.querySelector(`.videoTile[data-identity="${CSS.escape(identity)}"]`);
      if (existing){
        const lbl = existing.querySelector(".videoTileLabel");
        if (lbl) lbl.innerHTML = escapeHtml(label || "Jogador");
        return existing;
      }

      const slotId = getOrAssignSlot(identity);
      if (!slotId) return null;

      const slot = document.getElementById(slotId);
      if (!slot) return null;

      const tile = buildTile(identity, label);

      if (slotId === "slotCenter"){
        // Self slot: wrap in videoSelfSlot div
        slot.innerHTML = "";
        slot.className = "videoSelfSlot";
        slot.id = slotId;
        slot.appendChild(tile);
      } else {
        // Replace placeholder div with tile directly
        slot.replaceWith(tile);
        tile.id = slotId;
      }

      return tile;
    }

    function attachTrack(identity, track, label){
      const tile = ensureTile(identity, label);
      if (!tile) return;

      const media = tile.querySelector(".videoMedia");
      if (!media) return;

      if (media.querySelector(`[data-track-sid="${track.sid}"]`)) return;

      const el = track.attach();
      el.dataset.trackSid = track.sid;

      if (track.kind === "video"){ el.autoplay = true; el.playsInline = true; el.muted = true; }
      if (track.kind === "audio"){ el.autoplay = true; }

      media.appendChild(el);
    }

    function detachTrack(identity, track){
      const tile = document.querySelector(`.videoTile[data-identity="${CSS.escape(identity)}"]`);
      if (!tile) return;
      const el = tile.querySelector(`[data-track-sid="${track.sid}"]`);
      if (el) el.remove();
    }

    // ── LiveKit connection ───────────────────────────────────────────────
    async function getToken(){
      const identity = `rec_bot_${Math.random().toString(36).slice(2,9)}`;
      const res = await fetch(
        `${BACKEND_BASE_URL}/token?room=${encodeURIComponent(roomCode)}&user=${encodeURIComponent(identity)}`
      );
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.token) throw new Error(data?.error || "TOKEN_INVALIDO");
      return data.token;
    }

    async function connectRoom(){
      const token = await getToken();
      const room  = new Room({ adaptiveStream:true, dynacast:true });

      room.on(RoomEvent.ParticipantConnected, (p) => {
        ensureTile(p.identity, p.name || "Jogador");
      });

      room.on(RoomEvent.TrackSubscribed, (track, _pub, p) => {
        attachTrack(p.identity, track, p.name || "Jogador");
      });

      room.on(RoomEvent.TrackUnsubscribed, (track, _pub, p) => {
        detachTrack(p.identity, track);
      });

      room.on(RoomEvent.ParticipantDisconnected, (p) => {
        releaseSlot(p.identity);
      });

      await room.connect(LIVEKIT_URL, token, { autoSubscribe:true });

      // Attach already-present participants
      for (const p of room.remoteParticipants.values()){
        ensureTile(p.identity, p.name || "Jogador");
        for (const pub of p.trackPublications.values()){
          if (pub.track) attachTrack(p.identity, pub.track, p.name || "Jogador");
        }
      }
    }

    connectRoom().catch(err => console.error("recording connect error:", err));
  </script>
</body>
