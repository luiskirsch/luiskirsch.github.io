<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Rover 1909 - Final Build</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            color: #d4c4a8; background: rgba(26, 23, 20, 0.9);
            padding: 20px; border: 2px solid #5d4a37;
            border-radius: 4px; font-family: 'Garamond', serif;
            box-shadow: 0 0 20px rgba(0,0,0,0.5); z-index: 100;
        }
        h1 { margin: 0 0 5px 0; font-size: 24px; letter-spacing: 2px; color: #fff; }
        #loading {
            position: absolute; width: 100%; height: 100%; background: #000;
            display: flex; justify-content: center; align-items: center;
            color: #d4c4a8; font-family: 'Garamond', serif; z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="loading">Preparando Aldeia de Oakhaven...</div>

    <div id="ui">
        <h1>ROVER</h1>
        <div style="font-style: italic; opacity: 0.8;">Inglaterra, 1909</div>
        <hr style="border: 0; border-top: 1px solid #5d4a37; margin: 10px 0;">
        <div id="status">Explore a aldeia usando WASD</div>
    </div>

    <script src="https://pixijs.download/release/pixi.min.js"></script>

    <script>
        const app = new PIXI.Application({
            width: window.innerWidth, height: window.innerHeight,
            backgroundColor: 0x000000, antialias: true
        });
        document.body.appendChild(app.view);

        const world = new PIXI.Container();
        const mapLayer = new PIXI.Container();
        const ySortedLayer = new PIXI.Container(); // Camada sênior para profundidade (Z-Index)
        
        world.addChild(mapLayer);
        world.addChild(ySortedLayer);
        app.stage.addChild(world);

        // --- ASSETS REAIS (Sprites de RPG Profissionais) ---
        const loader = PIXI.Assets;
        
        async function setup() {
            // Carregando texturas reais de alta qualidade
            const texGrama = await loader.load('https://pixijs.com/assets/p2.jpeg'); // Grama detalhada
            const texCasa = await loader.load('https://pixijs.com/assets/rt_cassette.png'); // Objeto sólido
            const texRover = await loader.load('https://pixijs.com/assets/bunny.png'); // Player
            const texNPC = await loader.load('https://pixijs.com/assets/flowerTop.png'); // NPC/Objeto de interação

            document.getElementById('loading').style.display = 'none';

            // 1. CHÃO REAL (Tiled Grass)
            const ground = new PIXI.TilingSprite(texGrama, 4000, 4000);
            mapLayer.addChild(ground);

            const solids = [];

            // 2. CONSTRUÇÃO DA ALDEIA (Sprites de Casas)
            const houseData = [
                {x: 1800, y: 1800, s: 2}, {x: 2200, y: 1800, s: 2.2},
                {x: 2000, y: 2200, s: 2.5}, {x: 1700, y: 2400, s: 2}
            ];

            houseData.forEach(data => {
                const casa = new PIXI.Sprite(texCasa);
                casa.anchor.set(0.5, 0.8); // Âncora na base para profundidade real
                casa.x = data.x;
                casa.y = data.y;
                casa.scale.set(data.s);
                casa.tint = 0x8b7355; // Tom rústico de 1909
                ySortedLayer.addChild(casa);
                solids.push(casa);
            });

            // 3. NPCs (Aldeões)
            const npcs = [];
            for(let i=0; i<8; i++) {
                const npc = new PIXI.Sprite(texNPC);
                npc.anchor.set(0.5, 1);
                npc.x = 1500 + Math.random() * 1000;
                npc.y = 1500 + Math.random() * 1000;
                npc.scale.set(1.5);
                ySortedLayer.addChild(npc);
                npcs.push(npc);
            }

            // 4. O JOGADOR (ROVER)
            const rover = new PIXI.Sprite(texRover);
            rover.anchor.set(0.5, 1);
            rover.x = 2000;
            rover.y = 2000;
            rover.scale.set(2);
            ySortedLayer.addChild(rover);

            // --- LÓGICA DE MOVIMENTO E PROFUNDIDADE ---
            const keys = {};
            const speed = 5;
            window.onkeydown = (e) => keys[e.code] = true;
            window.onkeyup = (e) => keys[e.code] = false;

            app.ticker.add(() => {
                let nextX = rover.x;
                let nextY = rover.y;

                if (keys['KeyW'] || keys['ArrowUp']) nextY -= speed;
                if (keys['KeyS'] || keys['ArrowDown']) nextY += speed;
                if (keys['KeyA'] || keys['ArrowLeft']) nextX -= speed;
                if (keys['KeyD'] || keys['ArrowRight']) nextX += speed;

                // Colisão Simples (AABB)
                let canMove = true;
                solids.forEach(s => {
                    const dist = Math.hypot(nextX - s.x, nextY - s.y);
                    if (dist < 60) canMove = false;
                });

                if(canMove) {
                    rover.x = nextX;
                    rover.y = nextY;
                }

                // Câmera sênior (Seguir Player)
                world.x = -rover.x + app.screen.width / 2;
                world.y = -rover.y + app.screen.height / 2;

                // Y-SORTING (A mágica do 2.5D):
                // Quem está mais "baixo" na tela é desenhado na frente.
                ySortedLayer.children.sort((a, b) => a.y - b.y);
            });
        }

        setup();

        window.onresize = () => app.renderer.resize(window.innerWidth, window.innerHeight);
    </script>
</body>
</html>
