<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Resgate na Floresta - Versão Sênior</title>
    <style>
        :root {
            --bg-color: #0b1a0b;
            --forest-green: #1a331a;
            --player-color: #3498db; /* Azul para o menino */
            --family-color: #f1c40f; /* Amarelo para a família */
            --tree-color: #0d1f0d;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #ui {
            margin-bottom: 15px;
            text-align: center;
            width: 400px;
            display: flex;
            justify-content: space-between;
        }

        #timer { font-size: 24px; color: #e74c3c; font-weight: bold; }

        #viewport {
            position: relative;
            width: 400px;
            height: 400px;
            background-color: var(--forest-green);
            border: 4px solid #2d5a2d;
            border-radius: 10px;
            background-image: radial-gradient(#2d5a2d 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .entity {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 4px;
            transition: all 0.1s linear;
        }

        #player { background-color: var(--player-color); box-shadow: 0 0 10px var(--player-color); z-index: 10; }
        #family { background-color: var(--family-color); box-shadow: 0 0 15px var(--family-color); z-index: 5; }
        .tree { background-color: var(--tree-color); border-radius: 50%; }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div>Menino Perdido</div>
        <div id="timer">03:00</div>
    </div>

    <div id="viewport">
        <div id="overlay">
            <h1 id="msg">FIM DE JOGO</h1>
            <button onclick="location.reload()" style="padding: 10px 20px; cursor: pointer;">Tentar Novamente</button>
        </div>
        <div id="player" class="entity"></div>
        <div id="family" class="entity"></div>
    </div>

    <p style="margin-top: 20px; color: #666;">Use as setas do teclado para se mover pela floresta!</p>

<script>
    // Configurações e Estado
    const CONFIG = {
        gridSize: 20,
        mapLimit: 380,
        totalTime: 180, // 3 minutos em segundos
    };

    let state = {
        player: { x: 20, y: 20 },
        family: { x: 340, y: 340 },
        timeLeft: CONFIG.totalTime,
        isGameOver: false,
        trees: []
    };

    // Inicialização
    const playerEl = document.getElementById('player');
    const familyEl = document.getElementById('family');
    const timerEl = document.getElementById('timer');
    const overlay = document.getElementById('overlay');
    const msgEl = document.getElementById('msg');

    function init() {
        // Gerar árvores (obstáculos) aleatórios
        for(let i=0; i < 40; i++) {
            let tx = Math.floor(Math.random() * 19) * 20;
            let ty = Math.floor(Math.random() * 19) * 20;
            
            // Não colocar árvore em cima do player ou da família
            if ((tx < 60 && ty < 60) || (tx > 300 && ty > 300)) continue;

            const tree = document.createElement('div');
            tree.className = 'entity tree';
            tree.style.left = tx + 'px';
            tree.style.top = ty + 'px';
            document.getElementById('viewport').appendChild(tree);
            state.trees.push({x: tx, y: ty});
        }
        
        updateView();
        startTimer();
    }

    function startTimer() {
        const countdown = setInterval(() => {
            if (state.isGameOver) {
                clearInterval(countdown);
                return;
            }
            
            state.timeLeft--;
            let mins = Math.floor(state.timeLeft / 60);
            let secs = state.timeLeft % 60;
            timerEl.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

            if (state.timeLeft <= 0) {
                endGame("VOCÊ SE PERDEU NA ESCURIDÃO...");
                clearInterval(countdown);
            }
        }, 1000);
    }

    function updateView() {
        playerEl.style.left = state.player.x + 'px';
        playerEl.style.top = state.player.y + 'px';
        familyEl.style.left = state.family.x + 'px';
        familyEl.style.top = state.family.y + 'px';
    }

    function movePlayer(dx, dy) {
        if (state.isGameOver) return;

        const nextX = state.player.x + (dx * CONFIG.gridSize);
        const nextY = state.player.y + (dy * CONFIG.gridSize);

        // Colisão com Bordas
        if (nextX < 0 || nextX > CONFIG.mapLimit || nextY < 0 || nextY > CONFIG.mapLimit) return;

        // Colisão com Árvores
        const hitTree = state.trees.some(t => t.x === nextX && t.y === nextY);
        if (hitTree) return;

        state.player.x = nextX;
        state.player.y = nextY;
        
        updateView();
        checkVictory();
    }

    function checkVictory() {
        if (state.player.x === state.family.x && state.player.y === state.family.y) {
            endGame("VOCÊ ACHOU SUA FAMÍLIA!");
        }
    }

    function endGame(message) {
        state.isGameOver = true;
        msgEl.innerText = message;
        overlay.style.display = 'flex';
    }

    // Input Listeners
    window.addEventListener('keydown', (e) => {
        switch(e.key) {
            case 'ArrowUp':    movePlayer(0, -1); break;
            case 'ArrowDown':  movePlayer(0, 1);  break;
            case 'ArrowLeft':  movePlayer(-1, 0); break;
            case 'ArrowRight': movePlayer(1, 0);  break;
        }
    });

    init();
</script>
</body>
</html>
