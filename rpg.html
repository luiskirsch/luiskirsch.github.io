<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Limbo - Anatomia Real de Malha Única (Rigged)</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #info { position: absolute; top: 20px; width: 100%; text-align: center; color: #444; pointer-events: none; }
    </style>
</head>
<body>
    <div id="info">ANATOMIA REAL (SINGLE-MESH RIGGED) - Use SETAS</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- SETUP AMBIENTE SÊNIOR ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.FogExp2(0x050505, 0.15);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Luzes para destacar a deformação da malha
        const spotLight = new THREE.SpotLight(0xffffff, 50);
        spotLight.position.set(0, 5, 3);
        spotLight.castShadow = true;
        spotLight.angle = Math.PI/4;
        scene.add(spotLight);
        scene.add(new THREE.AmbientLight(0x202020, 0.5));

        // --- CONSTRUÇÃO DA MALHA ÚNICA (O "CORPO REAL") ---
        // Em vez de cápsulas, criamos uma geometria contínua (corpo e membros integrados)
        const bodyGeometry = new THREE.CylinderGeometry(0.2, 0.2, 1.2, 16, 12, true); // (topo, base, altura, segmentos, anéis, aberto)
        
        // Ajustamos os vértices para criar a forma orgânica (ombros, cintura)
        const positions = bodyGeometry.attributes.position;
        const vertex = new THREE.Vector3();
        for (let i = 0; i < positions.count; i++) {
            vertex.fromBufferAttribute(positions, i);
            const y = vertex.y;
            
            // Modelagem Procedural da Silhueta
            let scale = 1;
            if (y > 0.4) scale = THREE.MathUtils.lerp(1, 1.5, (y-0.4)/0.2); // Ombros largos
            if (y < 0.2 && y > -0.2) scale = 0.8; // Cintura fina
            if (y < -0.4) scale = 1.1; // Quadril

            vertex.x *= scale;
            vertex.z *= scale;
            positions.setXYZ(i, vertex.x, vertex.y, vertex.z);
        }

        // --- CRIAÇÃO DO ESQUELETO (BONES) ---
        const bones = [];
        const shoulder = new THREE.Bone();
        const elbow = new THREE.Bone();
        const hand = new THREE.Bone();

        shoulder.add(elbow);
        elbow.add(hand);
        shoulder.position.y = 0.5; // Posição do ombro na malha
        elbow.position.y = -0.4;   // Comprimento do bíceps
        hand.position.y = -0.4;    // Comprimento do antebraço
        bones.push(shoulder, elbow, hand);

        const skeleton = new THREE.Skeleton(bones);

        // --- SKINNING PROCEDURAL (A MÁGICA DO SÊNIOR) ---
        // Dizer ao código quais vértices são influenciados por quais ossos
        const skinIndices = [];
        const skinWeights = [];
        for (let i = 0; i < positions.count; i++) {
            vertex.fromBufferAttribute(positions, i);
            const y = vertex.y;

            // Vértices do ombro seguem o osso 0, cotovelo o osso 1, mão o osso 2
            if (y > 0.3) {
                skinIndices.push(0, 0, 0, 0);
                skinWeights.push(1, 0, 0, 0);
            } else if (y > -0.1) {
                skinIndices.push(1, 0, 0, 0);
                skinWeights.push(1, 0, 0, 0);
            } else {
                skinIndices.push(2, 0, 0, 0);
                skinWeights.push(1, 0, 0, 0);
            }
        }
        bodyGeometry.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(skinIndices, 4));
        bodyGeometry.setAttribute('skinWeight', new THREE.Float32BufferAttribute(skinWeights, 4));

        // --- MATERIAL E RENDER ---
        const boyMat = new THREE.MeshStandardMaterial({ 
            color: 0x000000, 
            roughness: 0.9, 
            skinning: true // Ativa a deformação por esqueleto
        });
        const boyMesh = new THREE.SkinnedMesh(bodyGeometry, boyMat);
        boyMesh.add(bones[0]); // Adiciona a raiz do esqueleto à malha
        boyMesh.bind(skeleton);
        scene.add(boyMesh);

        // --- OLHOS BRILHANTES (A ÚNICA COISA QUE SE VÊ) ---
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const createEye = (x, y) => {
            const eye = new THREE.Mesh(new THREE.CircleGeometry(0.04, 16), eyeMat);
            eye.position.set(x, y, 0.21);
            return eye;
        };
        boyMesh.add(createEye(-0.08, 0.75), createEye(0.08, 0.75));


        // --- CHÃO E AMBIENTE (SOMBRAS ABSOLUTAS) ---
        const blackMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const floor = new THREE.Mesh(new THREE.BoxGeometry(200, 1, 10), blackMat);
        floor.position.y = -1.1; // Ajuste para a altura do novo corpo
        scene.add(floor);

        // Árvores Distorcidas (Background)
        for(let i=0; i<40; i++) {
            const h = 5 + Math.random() * 15;
            const tree = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.3, h), blackMat);
            tree.position.set((Math.random()-0.5)*100, h/2 - 1.1, -3 - Math.random()*10);
            scene.add(tree);
        }

        // --- CONTROLES E ANIMAÇÃO ---
        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        let walkCycle = 0;

        function animate() {
            requestAnimationFrame(animate);

            const isMoving = (keys['ArrowLeft'] || keys['KeyA'] || keys['ArrowRight'] || keys['KeyD']);

            if(isMoving) {
                walkCycle += 0.12;
                const moveSpeed = 0.08;
                
                if(keys['ArrowLeft'] || keys['KeyA']) {
                    boyMesh.position.x -= moveSpeed;
                    boyMesh.rotation.y = -Math.PI/2;
                }
                if(keys['ArrowRight'] || keys['KeyD']) {
                    boyMesh.position.x += moveSpeed;
                    boyMesh.rotation.y = Math.PI/2;
                }

                // ANIMAÇÃO DE BRAÇO (DOBRANDO ORGANICAMENTE NO COTOVELO)
                elbow.rotation.x = Math.sin(walkCycle) * 0.4;
                hand.rotation.x = Math.sin(walkCycle) * 0.2; // Leve balanço da mão

            } else {
                elbow.rotation.x = THREE.MathUtils.lerp(elbow.rotation.x, 0, 0.1);
                hand.rotation.x = THREE.MathUtils.lerp(hand.rotation.x, 0, 0.1);
            }

            // Câmera segue
            camera.position.x = THREE.MathUtils.lerp(camera.position.x, boyMesh.position.x, 0.05);
            camera.lookAt(boyMesh.position.x, 1, 0);

            // Luz segue
            spotLight.position.x = boyMesh.position.x;
            spotLight.target = boyMesh;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
