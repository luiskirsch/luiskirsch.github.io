<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Rover - England 1909</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: 'Courier New', monospace; }
        #ui {
            position: absolute; bottom: 20px; left: 20px;
            color: white; background: rgba(0,0,0,0.7);
            padding: 15px; border-radius: 8px; pointer-events: none;
            border: 1px solid #444; z-index: 100;
        }
        .label { color: #aaa; font-size: 12px; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="label">Local original: <span style="color:white">Aldeia de Oakhaven</span></div>
        <div class="label">Ano: <span style="color:white">1909</span></div>
        <div style="margin-top:5px">Mova Rover com WASD ou Setas</div>
    </div>

    <script src="https://pixijs.download/release/pixi.min.js"></script>

    <script>
        // --- CONFIGURAÇÃO SÊNIOR DO PIXI ---
        const app = new PIXI.Application({
            width: window.innerWidth,
            height: window.innerHeight,
            backgroundColor: 0x1a2b1a, // Verde musgo base da floresta
            antialias: true,
            resolution: window.devicePixelRatio || 1,
        });
        document.body.appendChild(app.view);

        // --- HIERARQUIA DE CENA (Containers) ---
        const gameScene = new PIXI.Container();
        const mapContainer = new PIXI.Container(); // Onde o mundo é desenhado
        const uiContainer = new PIXI.Container();  // Camada de UI (Opcional no PIXI)
        
        gameScene.addChild(mapContainer);
        app.stage.addChild(gameScene);

        // --- CONFIGURAÇÃO DO MUNDO ---
        const WORLD_SIZE = 3000; // Tamanho do mapa (pixel)
        const GRID_SIZE = 50;   // Tamanho base de tiles/construções
        
        // --- DESENHANDO A CIDADE PROCEDURALMENTE (Simulando Texturas Reais) ---
        function drawMap() {
            const mapGraphics = new PIXI.Graphics();
            mapContainer.addChild(mapGraphics);

            // 1. Chão base (Terra batida misturada com grama)
            mapGraphics.beginFill(0x2d3a2d);
            mapGraphics.drawRect(0, 0, WORLD_SIZE, WORLD_SIZE);
            mapGraphics.endFill();

            // 2. Estradas principais (Caminhos de terra)
            mapGraphics.beginFill(0x8b7355, 0.8);
            // Estrada Horizontal Principal
            mapGraphics.drawRect(0, WORLD_SIZE / 2 - 25, WORLD_SIZE, 50);
            // Estrada Vertical Principal
            mapGraphics.drawRect(WORLD_SIZE / 2 - 25, 0, 50, WORLD_SIZE);
            mapGraphics.endFill();

            // 3. Construções da Aldeia (Marrom/Cinza - Palha/Pedra)
            const buildingCoords = [
                {x: 1300, y: 1300}, {x: 1400, y: 1300}, // Casas perto do centro
                {x: 1550, y: 1300}, {x: 1650, y: 1300},
                {x: 1300, y: 1550}, {x: 1400, y: 1550},
                {x: 1550, y: 1550}, {x: 1650, y: 1550},
                // Igreja/Prefeitura (Maior)
                {x: 1450, y: 1400, w: 100, h: 100}
            ];

            mapGraphics.beginFill(0x5d4037); // Cor de madeira escura
            buildingCoords.forEach(c => {
                const w = c.w || GRID_SIZE;
                const h = c.h || GRID_SIZE;
                mapGraphics.drawRect(c.x, c.y, w, h);
            });
            mapGraphics.endFill();

            // Telhados (Cinza)
            mapGraphics.beginFill(0x424242);
            buildingCoords.forEach(c => {
                const w = c.w || GRID_SIZE;
                const h = c.h || GRID_SIZE;
                mapGraphics.drawRect(c.x + 5, c.y + 5, w - 10, h - 10);
            });
            mapGraphics.endFill();


            // 4. Árvores e Vegetação (Círculos verdes densos)
            mapGraphics.beginFill(0x0d1f0d, 0.9);
            for (let i = 0; i < 200; i++) {
                const x = Math.random() * WORLD_SIZE;
                const y = Math.random() * WORLD_SIZE;
                // Não colocar árvores no centro da cidade/estradas
                if (x > 1200 && x < 1800 && y > 1200 && y < 1800) continue;
                
                const radius = 10 + Math.random() * 20;
                mapGraphics.drawCircle(x, y, radius);
            }
            mapGraphics.endFill();
        }

        drawMap();

        // --- O JOGADOR (ROVER) ---
        const rover = new PIXI.Graphics();
        rover.beginFill(0x3498db); // Azul
        rover.drawCircle(0, 0, 10); // Raio 10
        rover.endFill();
        
        // Posição inicial no centro da aldeia
        rover.x = WORLD_SIZE / 2;
        rover.y = WORLD_SIZE / 2;
        
        mapContainer.addChild(rover);


        // --- CONTROLES E MOVIMENTO ---
        const keys = {};
        const speed = 5;

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // --- GAME LOOP (60 FPS) ---
        app.ticker.add((delta) => {
            // Movimento do Rover
            if (keys['ArrowUp'] || keys['KeyW']) rover.y -= speed * delta;
            if (keys['ArrowDown'] || keys['KeyS']) rover.y += speed * delta;
            if (keys['ArrowLeft'] || keys['KeyA']) rover.x -= speed * delta;
            if (keys['ArrowRight'] || keys['KeyD']) rover.x += speed * delta;

            // Limites do Mundo (Colisão com a borda do mapa)
            rover.x = Math.max(10, Math.min(WORLD_SIZE - 10, rover.x));
            rover.y = Math.max(10, Math.min(WORLD_SIZE - 10, rover.y));

            // --- LÓGICA DA CÂMERA (Seguir o Player) ---
            // Centraliza a câmera no Rover
            gameScene.x = -rover.x + app.screen.width / 2;
            gameScene.y = -rover.y + app.screen.height / 2;

            // Limites da Câmera (Não mostrar além da borda do mapa)
            gameScene.x = Math.min(0, Math.max(-WORLD_SIZE + app.screen.width, gameScene.x));
            gameScene.y = Math.min(0, Math.max(-WORLD_SIZE + app.screen.height, gameScene.y));
        });

        // Ajuste de janela (Responsive Sênior)
        window.addEventListener('resize', () => {
            app.renderer.resize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
