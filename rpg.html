<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Limbo Woods - Vertical Slice (Production Build)</title>
    <style>
        :root { --main-bg: #030303; --main-fog: #070707; }
        body { margin: 0; overflow: hidden; background: var(--main-bg); }
        #overlay-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        #timer {
            font-size: 3rem; color: #fff; font-family: 'serif'; letter-spacing: 5px; opacity: 0.1; transition: opacity 2s; font-weight: 100;
        }
        /* Efeito de Vinheta (Noir) */
        #vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 100%);
            z-index: 50; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="vignette"></div>
    <div id="overlay-ui">
        <div id="timer">03:00</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- PRODUCTION SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.FogExp2(0x050505, 0.12);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- AUDIO DESIGN SÊNIOR ---
        const listener = new THREE.AudioListener();
        camera.add(listener);

        const stepSound = new THREE.Audio(listener);
        const audioLoader = new THREE.AudioLoader();
        // NOTA: Em produção, substitua por arquivos locais reais (.ogg/.mp3)
        // Usando um placeholder de áudio (silêncio) para demonstração funcional
        const stepBuffer = await audioLoader.loadAsync('https://threejs.org/examples/sounds/358232_j_s_st_4_j_s_single_step_1_on_wood.ogg');
        stepSound.setBuffer(stepBuffer);
        stepSound.setVolume(0.3);

        const ambientSound = new THREE.Audio(listener);
        //Placeholder de ambiente floresta
        const ambientBuffer = await audioLoader.loadAsync('https://threejs.org/examples/sounds/180628_b_s_night_birds_1_on_the_lake.ogg');
        ambientSound.setBuffer(ambientBuffer);
        ambientSound.setLoop(true);
        ambientSound.setVolume(0.1);

        document.body.addEventListener('click', () => {
            ambientSound.play(); // Inicia o som de ambiente ao clicar na tela
            document.getElementById('timer').style.opacity = '1';
        }, { once: true });


        // --- ILUMINAÇÃO ATMOSFÉRICA ---
        // Luz que "engole" as sombras
        const hemiLight = new THREE.HemisphereLight(0x000000, 0x050505, 1);
        scene.add(hemiLight);

        // Luz de Contraste Lateral (Vinda da Esquerda)
        const backLight = new THREE.PointLight(0xffffff, 10, 30);
        backLight.position.set(-10, 5, -5);
        scene.add(backLight);

        // --- O MENINO (REFINADO) ---
        const boy = new THREE.Group();
        const boyMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        
        const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 0.4, 4, 8), boyMat);
        torso.position.y = 0.5;
        boy.add(torso);

        // Olhos Brilhantes com Bloom Procedural
        const eyeGroup = new THREE.Group();
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const eyeGlowMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.1 });

        const createEye = (x, y) => {
            const eye = new THREE.Mesh(new THREE.CircleGeometry(0.04, 16), eyeMat);
            const glow = new THREE.Mesh(new THREE.CircleGeometry(0.1, 16), eyeGlowMat); // Brilho extra
            eye.position.set(x, y, 0.21);
            glow.position.set(x, y, 0.2);
            eyeGroup.add(eye, glow);
        };
        createEye(-0.08, 0.75);
        createEye(0.08, 0.75);
        boy.add(eyeGroup);

        scene.add(boy);


        // --- CHÃO E OBSTÁCULOS (SOMBRAS ABSOLUTAS) ---
        const blackMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        
        const floor = new THREE.Mesh(new THREE.BoxGeometry(200, 1, 10), blackMat);
        floor.position.y = -0.5;
        scene.add(floor);

        // Árvores Distorcidas (Background Parallax)
        for(let i=0; i<60; i++) {
            const h = 5 + Math.random() * 15;
            const tree = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.3, h), blackMat);
            tree.position.set((Math.random()-0.5)*100, h/2 - 0.5, -3 - Math.random()*10);
            scene.add(tree);
        }

        // --- PARTÍCULAS DE NÉVOA VIVA ---
        const dustGeo = new THREE.BufferGeometry();
        const dustArr = new Float32Array(800 * 3);
        for(let i=0; i<2400; i++) dustArr[i] = (Math.random()-0.5) * 60;
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustArr, 3));
        const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({color: 0x333333, size: 0.05, transparent: true, opacity: 0.5}));
        scene.add(dust);


        // --- GAME LOOP E FÍSICA ---
        let velocityY = 0;
        let isGrounded = true;
        let targetRotationY = 0;
        const keys = {};

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function animate() {
            requestAnimationFrame(animate);

            const isMoving = (keys['ArrowLeft'] || keys['KeyA'] || keys['ArrowRight'] || keys['KeyD']);

            // Movimento Lateral
            if(keys['ArrowLeft'] || keys['KeyA']) {
                boy.position.x -= 0.08;
                targetRotationY = -Math.PI/2; // Quer virar para a esquerda
            }
            if(keys['ArrowRight'] || keys['KeyD']) {
                boy.position.x += 0.08;
                targetRotationY = Math.PI/2; // Quer virar para a direita
            }

            // Polimento de Rotação (Inércia suave)
            boy.rotation.y = THREE.MathUtils.lerp(boy.rotation.y, targetRotationY, 0.1);

            // Som de passos (Verificação de tempo para não repetir)
            if (isMoving && isGrounded && !stepSound.isPlaying) {
                stepSound.play();
            }

            // Pulo (Gravidade)
            if((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && isGrounded) {
                velocityY = 0.15;
                isGrounded = false;
            }

            if(!isGrounded) {
                boy.position.y += velocityY;
                velocityY -= 0.008; // Gravidade
                if(boy.position.y <= 0) {
                    boy.position.y = 0;
                    isGrounded = true;
                }
            }

            // Câmera Dinâmica Estilo Limbo (Pura lateral)
            camera.position.x = THREE.MathUtils.lerp(camera.position.x, boy.position.x, 0.08);
            camera.position.y = 1.5;
            camera.position.z = 8;
            camera.lookAt(boy.position.x, 1, 0);

            // BackLight segue o player suavemente
            backLight.position.x = THREE.MathUtils.lerp(backLight.position.x, boy.position.x - 5, 0.1);

            // Partículas flutuando
            dust.rotation.y += 0.001;
            dust.position.y = Math.sin(Date.now() * 0.001) * 0.2;

            renderer.render(scene, camera);
        }

        animate();

        // Ajuste de Janela (Responsive Sênior)
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
