<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Resgate 3D - Forest Survival</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui {
            position: absolute; top: 20px; width: 100%;
            display: flex; justify-content: center;
            pointer-events: none; z-index: 10;
        }
        #timer {
            background: rgba(0,0,0,0.7); padding: 10px 20px;
            border-radius: 20px; color: #ff4444; font-size: 24px;
            border: 2px solid #ff4444; box-shadow: 0 0 15px #ff4444;
        }
        #instructions {
            position: absolute; bottom: 20px; width: 100%;
            text-align: center; color: white; font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="ui"><div id="timer">03:00</div></div>
    <div id="instructions">Use as SETAS ou WASD para caminhar</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- CONFIGURAÇÃO SÊNIOR DA CENA ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020502);
        scene.fog = new THREE.Fog(0x020502, 5, 25); // Névoa para mistério

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- ILUMINAÇÃO ---
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);

        const spotLight = new THREE.SpotLight(0xffffff, 50);
        spotLight.position.set(0, 10, 0);
        spotLight.castShadow = true;
        scene.add(spotLight);

        // --- CHÃO DA FLORESTA ---
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a2b1a });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- CRIAÇÃO DO "MENINO" (Estilo Low-Poly Among Us) ---
        const playerGroup = new THREE.Group();
        
        // Corpo
        const body = new THREE.Mesh(
            new THREE.CapsuleGeometry(0.4, 0.6, 4, 12),
            new THREE.MeshStandardMaterial({ color: 0x3498db })
        );
        body.position.y = 0.7;
        body.castShadow = true;
        playerGroup.add(body);

        // Visor (Olhos)
        const visor = new THREE.Mesh(
            new THREE.BoxGeometry(0.5, 0.2, 0.2),
            new THREE.MeshStandardMaterial({ color: 0x222222 })
        );
        visor.position.set(0, 0.9, 0.35);
        playerGroup.add(visor);

        scene.add(playerGroup);

        // --- FAMÍLIA (O Objetivo - Brilhando) ---
        const familyGeo = new THREE.TorusKnotGeometry(0.4, 0.1, 64, 8);
        const familyMat = new THREE.MeshStandardMaterial({ color: 0xf1c40f, emissive: 0xf1c40f });
        const family = new THREE.Mesh(familyGeo, familyMat);
        family.position.set(15, 1, -15);
        scene.add(family);

        // --- ÁRVORES ---
        for(let i=0; i<80; i++) {
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.2, 0.2, 3),
                new THREE.MeshStandardMaterial({ color: 0x2d1a0d })
            );
            const x = (Math.random() - 0.5) * 60;
            const z = (Math.random() - 0.5) * 60;
            if(Math.abs(x) < 3 && Math.abs(z) < 3) continue; // Não nasce no player

            trunk.position.set(x, 1.5, z);
            trunk.castShadow = true;
            scene.add(trunk);
        }

        // --- CONTROLES E LÓGICA ---
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        let timeLeft = 180;
        const timerDiv = document.getElementById('timer');

        setInterval(() => {
            if(timeLeft > 0) {
                timeLeft--;
                let m = Math.floor(timeLeft/60);
                let s = timeLeft%60;
                timerDiv.innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            }
        }, 1000);

        // --- GAME LOOP (60 FPS) ---
        function animate() {
            requestAnimationFrame(animate);

            const speed = 0.15;
            if (keys['ArrowUp'] || keys['KeyW']) playerGroup.position.z -= speed;
            if (keys['ArrowDown'] || keys['KeyS']) playerGroup.position.z += speed;
            if (keys['ArrowLeft'] || keys['KeyA']) playerGroup.position.x -= speed;
            if (keys['ArrowRight'] || keys['KeyD']) playerGroup.position.x += speed;

            // Rotação suave do personagem para onde ele caminha
            if(keys['ArrowLeft'] || keys['KeyA']) playerGroup.rotation.y = Math.PI/2;
            if(keys['ArrowRight'] || keys['KeyD']) playerGroup.rotation.y = -Math.PI/2;
            if(keys['ArrowUp'] || keys['KeyW']) playerGroup.rotation.y = 0;
            if(keys['ArrowDown'] || keys['KeyS']) playerGroup.rotation.y = Math.PI;

            // Câmera seguindo (Estilo Third Person)
            camera.position.set(playerGroup.position.x, playerGroup.position.y + 8, playerGroup.position.z + 8);
            camera.lookAt(playerGroup.position);

            // Luz segue o player (lanterna)
            spotLight.position.set(playerGroup.position.x, 10, playerGroup.position.z);
            spotLight.target = playerGroup;

            // Animação da Família
            family.rotation.y += 0.02;

            renderer.render(scene, camera);
        }

        animate();

        // Ajuste de janela
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
