<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Limbo - Force Start Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #ui {
            position: absolute; top: 40px; width: 100%; text-align: center;
            color: #333; font-family: 'Courier New', Courier, monospace;
            font-size: 30px; letter-spacing: 10px; z-index: 100;
        }
    </style>
</head>
<body>
    <div id="ui" id="timer">03:00</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 1. Cena e Câmera
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.FogExp2(0x050505, 0.15);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 7);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. O Menino (Silhueta de Luxo)
        const boy = new THREE.Group();
        const blackMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

        // Corpo
        const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 0.5, 4, 8), blackMat);
        torso.position.y = 0.6;
        boy.add(torso);

        // Olhos (Sempre visíveis)
        const eyeL = new THREE.Mesh(new THREE.CircleGeometry(0.04, 16), whiteMat);
        const eyeR = new THREE.Mesh(new THREE.CircleGeometry(0.04, 16), whiteMat);
        eyeL.position.set(-0.08, 0.85, 0.21);
        eyeR.position.set(0.08, 0.85, 0.21);
        boy.add(eyeL, eyeR);
        
        scene.add(boy);

        // 3. Chão
        const floor = new THREE.Mesh(new THREE.BoxGeometry(100, 1, 10), blackMat);
        floor.position.y = -0.5;
        scene.add(floor);

        // 4. Árvores (Background)
        for(let i=0; i<40; i++) {
            const tree = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.4, 10), blackMat);
            tree.position.set((Math.random()-0.5)*60, 4.5, -Math.random()*10 - 2);
            scene.add(tree);
        }

        // 5. Controles
        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function animate() {
            requestAnimationFrame(animate);

            if(keys['ArrowLeft'] || keys['KeyA']) {
                boy.position.x -= 0.1;
                boy.rotation.y = -Math.PI/2;
            }
            if(keys['ArrowRight'] || keys['KeyD']) {
                boy.position.x += 0.1;
                boy.rotation.y = Math.PI/2;
            }

            // Câmera segue
            camera.position.x = THREE.MathUtils.lerp(camera.position.x, boy.position.x, 0.1);
            camera.lookAt(boy.position.x, 1, 0);

            renderer.render(scene, camera);
        }

        animate();

        // Ajuste de tela
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
