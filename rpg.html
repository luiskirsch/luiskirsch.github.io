<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Limbo Woods - O Menino Perfeito (SVG)</title>
    <style>
        :root { --main-bg: #070707; --main-black: #000; --glow-white: #fff; }
        body { margin: 0; overflow: hidden; background: var(--main-bg); }
        
        #vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 100%);
            z-index: 50; pointer-events: none;
        }

        #game-container {
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
        }

        svg {
            width: 800px; height: 600px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            background: #111;
        }

        /* Animação dos Vagalumes (Poeira Atmosférica) */
        @keyframes fireflyPulse {
            0% { opacity: 0.2; transform: translateY(0) scale(1); }
            50% { opacity: 0.8; transform: translateY(-10px) scale(1.1); }
            100% { opacity: 0.2; transform: translateY(-20px) scale(1); }
        }

        .firefly {
            opacity: 0.2;
            animation: fireflyPulse 3s infinite ease-in-out;
        }

        /* Animação dos Olhos (Bloom Procedural) */
        @keyframes eyeGlow {
            0%, 100% { filter: blur(2px) brightness(1.2); opacity: 0.8; }
            50% { filter: blur(4px) brightness(1.5); opacity: 1; }
        }

        #eye-left, #eye-right {
            filter: blur(2px) brightness(1.2);
            opacity: 0.8;
            animation: eyeGlow 2s infinite ease-in-out;
        }

    </style>
</head>
<body>

    <div id="vignette"></div>
    <div id="game-container">
        <svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            
            <defs>
                <filter id="bloom">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>

            <rect width="800" height="600" fill="#111" />
            
            <linearGradient id="fogGradient" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#111" />
                <stop offset="100%" stop-color="#050505" />
            </linearGradient>
            <rect width="800" height="600" fill="url(#fogGradient)" opacity="0.8"/>

            <circle class="firefly" cx="150" cy="150" r="1.5" fill="var(--glow-white)" style="animation-delay: 0s;"/>
            <circle class="firefly" cx="250" cy="200" r="1.2" fill="var(--glow-white)" style="animation-delay: 1.5s;"/>
            <circle class="firefly" cx="650" cy="300" r="1.8" fill="var(--glow-white)" style="animation-delay: 0.8s;"/>
            <circle class="firefly" cx="550" cy="400" r="1.3" fill="var(--glow-white)" style="animation-delay: 2s;"/>

            <g transform="translate(400, 300)">
                <ellipse cx="0" cy="-60" rx="40" ry="50" fill="var(--main-black)" />
                <rect x="-8" y="-30" width="16" height="30" rx="5" fill="var(--main-black)" />
                
                <circle id="eye-left" cx="-15" cy="-65" r="5" fill="var(--main-black)" stroke="var(--glow-white)" stroke-width="2" filter="url(#bloom)" />
                <circle id="eye-right" cx="15" cy="-65" r="5" fill="var(--main-black)" stroke="var(--glow-white)" stroke-width="2" filter="url(#bloom)"/>

                <rect x="-30" y="-10" width="60" height="80" rx="20" fill="var(--main-black)" />
                <ellipse cx="0" cy="70" rx="30" ry="30" fill="var(--main-black)" />

                <path d="M -25 -5 Q -35 25, -25 55" fill="none" stroke="var(--main-black)" stroke-width="8" stroke-linecap="round" />
                <path d="M 25 -5 Q 35 25, 25 55" fill="none" stroke="var(--main-black)" stroke-width="8" stroke-linecap="round" />

                <rect x="-15" y="80" width="10" height="40" rx="4" fill="var(--main-black)" />
                <rect x="5" y="80" width="10" height="40" rx="4" fill="var(--main-black)" />
                <rect x="-25" y="115" width="20" height="8" rx="3" fill="var(--main-black)" />
                <rect x="5" y="115" width="20" height="8" rx="3" fill="var(--main-black)" />
            </g>

            <path d="M 0 550 C 150 500, 350 600, 500 550 C 650 500, 800 600, 800 600 V 600 H 0 Z" fill="var(--main-black)" />
            
            <path d="M 200 520 Q 205 500, 210 520" fill="none" stroke="var(--main-black)" stroke-width="2" />
            <path d="M 220 525 Q 225 505, 230 525" fill="none" stroke="var(--main-black)" stroke-width="2" />
            <path d="M 580 520 Q 585 500, 590 520" fill="none" stroke="var(--main-black)" stroke-width="2" />
            <path d="M 600 525 Q 605 505, 610 525" fill="none" stroke="var(--main-black)" stroke-width="2" />
            
        </svg>
    </div>

<script>
    // Script Sênior para Responsive (Opcional, mas recomendado para venda)
    window.addEventListener('resize', () => {
        const svg = document.querySelector('svg');
        const container = document.getElementById('game-container');
        const ratio = 800 / 600;
        
        let width = container.clientWidth;
        let height = container.clientHeight;
        
        if (width / height > ratio) {
            width = height * ratio;
        } else {
            height = width / ratio;
        }
        
        svg.style.width = width + 'px';
        svg.style.height = height + 'px';
    });
</script>
</body>
</html>
