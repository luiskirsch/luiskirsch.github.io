<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Forest Rescue - Premium Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #overlay-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
            padding: 30px; box-sizing: border-box; z-index: 10;
        }
        #timer {
            font-size: 3rem; color: #fff; text-shadow: 0 0 20px #ff0000;
            font-weight: 800; text-align: right;
        }
        .label { color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 2px; font-size: 12px; }
    </style>
</head>
<body>

    <div id="overlay-ui">
        <div>
            <div class="label">Status: Perdido</div>
            <div style="color: #00ffcc; font-weight: bold;">MISSÃO DE RESGATE</div>
        </div>
        <div id="timer">03:00</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- SETUP SÊNIOR ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020502, 0.08);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- ILUMINAÇÃO CINEMATOGRÁFICA ---
        const hemiLight = new THREE.HemisphereLight(0x000000, 0x020502, 1);
        scene.add(hemiLight);

        // Lanterna do Menino
        const flashlight = new THREE.SpotLight(0xffffff, 100, 20, Math.PI/4, 0.5, 1);
        flashlight.castShadow = true;
        scene.add(flashlight);

        // --- TEXTURAS REAIS (Via Procedural Design) ---
        const loader = new THREE.TextureLoader();
        // Usamos um canvas para gerar uma textura de grama/terra sem precisar de arquivos externos
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#1a2b1a'; ctx.fillRect(0,0,256,256);
        for(let i=0; i<2000; i++) {
            ctx.fillStyle = `rgba(0,${Math.random()*50},0,0.5)`;
            ctx.fillRect(Math.random()*256, Math.random()*256, 2, 2);
        }
        const grassTex = new THREE.CanvasTexture(canvas);
        grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
        grassTex.repeat.set(50, 50);

        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(200, 200),
            new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.8 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- PERSONAGEM PREMIUM ---
        const playerGroup = new THREE.Group();
        const bodyMat = new THREE.MeshPhysicalMaterial({ 
            color: 0x0077ff, metalness: 0.6, roughness: 0.2, clearcoat: 1 
        });
        
        const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.5, 8, 16), bodyMat);
        body.position.y = 0.6;
        body.castShadow = true;
        playerGroup.add(body);

        const visor = new THREE.Mesh(
            new THREE.SphereGeometry(0.2, 16, 16, 0, Math.PI*2, 0, Math.PI/2),
            new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 1, roughness: 0 })
        );
        visor.rotation.x = Math.PI/2;
        visor.position.set(0, 0.8, 0.2);
        playerGroup.add(visor);

        scene.add(playerGroup);

        // --- VAGALUMES (Partículas Vivas) ---
        const firefliesGeo = new THREE.BufferGeometry();
        const firefliesCount = 100;
        const posArray = new Float32Array(firefliesCount * 3);
        for(let i=0; i<firefliesCount*3; i++) posArray[i] = (Math.random() - 0.5) * 50;
        firefliesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const firefliesMat = new THREE.PointsMaterial({ color: 0x00ffcc, size: 0.1, transparent: true, opacity: 0.8 });
        const fireflies = new THREE.Points(firefliesGeo, firefliesMat);
        scene.add(fireflies);

        // --- ÁRVORES REAIS (Troncos com Geometria Variada) ---
        for(let i=0; i<120; i++) {
            const h = 3 + Math.random() * 5;
            const tree = new THREE.Mesh(
                new THREE.CylinderGeometry(0.1 + Math.random()*0.2, 0.3, h),
                new THREE.MeshStandardMaterial({ color: 0x110500 })
            );
            const x = (Math.random() - 0.5) * 80;
            const z = (Math.random() - 0.5) * 80;
            if(Math.sqrt(x*x + z*z) < 5) continue;
            tree.position.set(x, h/2, z);
            tree.castShadow = true;
            scene.add(tree);
        }

        // --- LOGICA DE MOVIMENTO PREMIUM ---
        const keys = {};
        let velocity = new THREE.Vector3();
        const accel = 0.02, friction = 0.9;

        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        let timeLeft = 180;
        setInterval(() => {
            if(timeLeft > 0) {
                timeLeft--;
                const m = Math.floor(timeLeft/60), s = timeLeft%60;
                document.getElementById('timer').innerText = `${m}:${s.toString().padStart(2,'0')}`;
            }
        }, 1000);

        function animate() {
            requestAnimationFrame(animate);

            // Inércia
            if (keys['ArrowUp'] || keys['KeyW']) velocity.z -= accel;
            if (keys['ArrowDown'] || keys['KeyS']) velocity.z += accel;
            if (keys['ArrowLeft'] || keys['KeyA']) velocity.x -= accel;
            if (keys['ArrowRight'] || keys['KeyD']) velocity.x += accel;

            playerGroup.position.add(velocity);
            velocity.multiplyScalar(friction); // Desaceleração suave

            // Rotação baseada na velocidade
            if(velocity.length() > 0.01) {
                const angle = Math.atan2(velocity.x, velocity.z);
                playerGroup.rotation.y = THREE.MathUtils.lerp(playerGroup.rotation.y, angle, 0.1);
            }

            // Câmera Dinâmica
            camera.position.lerp(new THREE.Vector3(playerGroup.position.x, 12, playerGroup.position.z + 10), 0.05);
            camera.lookAt(playerGroup.position);

            // Lanterna Dinâmica
            flashlight.position.copy(playerGroup.position).add(new THREE.Vector3(0, 2, 0));
            flashlight.target.position.copy(playerGroup.position).add(velocity.clone().multiplyScalar(50));
            flashlight.target.updateMatrixWorld();

            // Animar Vagalumes
            fireflies.rotation.y += 0.001;
            fireflies.position.y = Math.sin(Date.now() * 0.001) * 0.5;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
