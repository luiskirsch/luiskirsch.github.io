<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Rover: Oakhaven 1909 - Vertical Slice</title>
    <style>
        :root { --main-bg: #1a1a1a; --main-black: #000; --glow-white: #fff; }
        body { margin: 0; overflow: hidden; background: var(--main-bg); font-family: 'Segoe UI', sans-serif; }
        
        #overlay-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
            padding: 30px; box-sizing: border-box; z-index: 100;
        }

        #timer { font-size: 3rem; color: #fff; font-family: 'Courier New', monospace; letter-spacing: 5px; opacity: 0.1; transition: opacity 2s; font-weight: 100; text-align: right;}
        .vignette { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 100%); z-index: 50; pointer-events: none; }
        
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: black; color: #aaa; display: flex; justify-content: center;
            align-items: center; z-index: 200; font-size: 20px;
        }
    </style>
</head>
<body>

    <div id="loading-overlay">Carregando texturas reais da Inglaterra de 1909...</div>

    <div class="vignette"></div>
    <div id="overlay-ui">
        <div id="status">Explore a Aldeia usando WASD</div>
        <div id="timer">03:00</div>
    </div>

    <script src="https://pixijs.download/release/pixi.min.js"></script>

    <script>
        // --- PRODUCTION SETUP ---
        const app = new PIXI.Application({
            width: window.innerWidth,
            height: window.innerHeight,
            backgroundColor: 0x070707, // Preto base
            antialias: true,
            resolution: window.devicePixelRatio || 1,
        });
        document.body.appendChild(app.view);

        // --- HIERARQUIA DE CENA (Containers) ---
        const gameScene = new PIXI.Container();
        const mapLayer = new PIXI.Container(); // Chão e Ruas
        const objectLayer = new PIXI.Container(); // Casas e Árvores (Z-Sorting)
        const npcLayer = new PIXI.Container();
        
        gameScene.addChild(mapLayer);
        gameScene.addChild(objectLayer);
        gameScene.addChild(npcLayer);
        app.stage.addChild(gameScene);

        // --- CONFIGURAÇÃO DO MUNDO ---
        const WORLD_SIZE = 3000;
        
        // Arrays sênior para gerenciamento de objetos
        const solidObjects = [];
        const npcs = [];

        // --- SISTEMA DE CARREGAMENTO ASSÍNCRONO (Assets Sênior) ---
        // NOTA: Em produção, substitua estas URLs pelos seus arquivos locais.
        // Usei placeholders funcionais do Three.js para demonstração imediata.
        const assets = {
            'player': 'https://threejs.org/examples/textures/crate.gif', // Placeholder para Rover
            'house': 'https://threejs.org/examples/textures/floors/FloorsCheckerboard_S_Normal.png', // Placeholder para Casa Rústica
            'npc': 'https://threejs.org/examples/textures/sprite.png', // Placeholder para NPC
            'tree': 'https://threejs.org/examples/textures/grasslight-big.jpg' // Placeholder para Chão (Grama/Terra)
        };

        const loader = new PIXI.Loader();
        Object.keys(assets).forEach(key => loader.add(key, assets[key]));
        
        loader.load((loader, resources) => {
            document.getElementById('loading-overlay').style.display = 'none';
            initGame(resources);
        });


        // --- INICIALIZAÇÃO DO JOGO SÊNIOR ---
        function initGame(resources) {
            
            // 1. DESENHAR O MAPA COM TEXTURAS REAIS
            const treeTexture = resources['tree'].texture; // Usando grama como chão
            const houseTexture = resources['house'].texture;
            
            // Chão Base (Tiling Sprite para textura repetível)
            const groundSprite = new PIXI.TilingSprite(treeTexture, WORLD_SIZE, WORLD_SIZE);
            mapLayer.addChild(groundSprite);

            // Criar Ruas de Terra batida (Simulando com Graphics para layout, deve ser PNG)
            const roadGraphics = new PIXI.Graphics();
            roadGraphics.beginFill(0x8b7355, 0.8);
            roadGraphics.drawRect(0, WORLD_SIZE / 2 - 25, WORLD_SIZE, 50);
            roadGraphics.drawRect(WORLD_SIZE / 2 - 25, 0, 50, WORLD_SIZE);
            roadGraphics.endFill();
            mapLayer.addChild(roadGraphics);


            // Criar a Aldeia rústica (Casas Reais)
            const houseCoords = [
                {x: 1000, y: 1000}, {x: 1200, y: 1000}, {x: 1400, y: 1000},
                {x: 1150, y: 1150, scale: 2.2} // Prefeitura/Igreja maior
            ];

            houseCoords.forEach(c => {
                const h = new PIXI.Sprite(houseTexture);
                h.anchor.set(0.5, 0.9); // Âncora na base para Z-Sorting Sênior
                h.x = c.x;
                h.y = c.y;
                h.scale.set(c.scale || 1.1);
                objectLayer.addChild(h);
                solidObjects.push(h);
            });


            // 2. ADICIONAR NPCS (SILHUETAS DO LIMBO COMO INVASORES)
            const npcTexture = resources['npc'].texture;
            
            const npcPositions = [
                {x: 900, y: 1050}, {x: 1100, y: 1050},
                {x: 1500, y: 1400}, {x: 1300, y: 1600}
            ];

            npcPositions.forEach(p => {
                const npc = new PIXI.Sprite(npcTexture);
                npc.anchor.set(0.5, 1);
                npc.x = p.x;
                npc.y = p.y;
                npc.scale.set(0.18);
                npcLayer.addChild(npc);
                npcs.push(npc);
            });


            // 3. O JOGADOR (ROVER PREMIUM)
            const playerTexture = resources['player'].texture;
            const rover = new PIXI.Sprite(playerTexture);
            rover.anchor.set(0.5, 1); // Âncora nos pés
            rover.scale.set(0.12);
            rover.x = WORLD_SIZE / 2;
            rover.y = WORLD_SIZE / 2;
            gameScene.addChild(rover);


            // --- FÍSICA E MOVIMENTO PREMIUM (Inércia) ---
            const keys = {};
            const speed = 7;
            const acceleration = 0.3;
            const friction = 0.9;
            let velocityX = 0;
            let velocityY = 0;

            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);

            // --- GAME LOOP (60 FPS) ---
            app.ticker.add((delta) => {
                
                // Inércia: Rover tem aceleração e desaceleração suave
                if (keys['ArrowUp'] || keys['KeyW']) velocityY -= acceleration * delta;
                if (keys['ArrowDown'] || keys['KeyS']) velocityY += acceleration * delta;
                if (keys['ArrowLeft'] || keys['KeyA']) velocityX -= acceleration * delta;
                if (keys['ArrowRight'] || keys['KeyD']) velocityX += acceleration * delta;

                // Atrito constante (Friction)
                velocityX *= friction;
                velocityY *= friction;

                // Limitar velocidade máxima
                velocityX = Math.max(-speed, Math.min(speed, velocityX));
                velocityY = Math.max(-speed, Math.min(speed, velocityY));

                // Previsão de colisão no eixo X
                let collisionX = false;
                solidObjects.forEach(obj => {
                    const bounds1 = rover.getBounds();
                    const bounds2 = obj.getBounds();
                    
                    // Verificação de colisão simples AABB
                    if (rover.x + velocityX > obj.x - obj.width/2 - bounds1.width/2 &&
                        rover.x + velocityX < obj.x + obj.width/2 + bounds1.width/2 &&
                        rover.y > obj.y - obj.height/2 - bounds1.height/2 &&
                        rover.y < obj.y + obj.height/2 + bounds1.height/2) {
                        collisionX = true;
                    }
                });

                // Previsão de colisão no eixo Y
                let collisionY = false;
                solidObjects.forEach(obj => {
                    const bounds1 = rover.getBounds();
                    const bounds2 = obj.getBounds();
                    
                    // Verificação de colisão simples AABB
                    if (rover.x > obj.x - obj.width/2 - bounds1.width/2 &&
                        rover.x < obj.x + obj.width/2 + bounds1.width/2 &&
                        rover.y + velocityY > obj.y - obj.height/2 - bounds1.height/2 &&
                        rover.y + velocityY < obj.y + obj.height/2 + bounds1.height/2) {
                        collisionY = true;
                    }
                });

                // Move Rover apenas se não houver colisão na direção
                if (!collisionX) rover.x += velocityX * delta;
                if (!collisionY) rover.y += velocityY * delta;

                // Limites do Mundo (Colisão com a borda do mapa)
                rover.x = Math.max(20, Math.min(WORLD_SIZE - 20, rover.x));
                rover.y = Math.max(20, Math.min(WORLD_SIZE - 20, rover.y));

                // --- LÓGICA DA CÂMERA (Seguir o Player) ---
                gameScene.x = -rover.x + app.screen.width / 2;
                gameScene.y = -rover.y + app.screen.height / 2;

                // Limites da Câmera (Não mostrar além da borda do mapa)
                gameScene.x = Math.min(0, Math.max(-WORLD_SIZE + app.screen.width, gameScene.x));
                gameScene.y = Math.min(0, Math.max(-WORLD_SIZE + app.screen.height, gameScene.y));

                // Animar Vagalumes (Partículas Atmosféricas)
                // (Código para partículas flutuando aqui)
            });
        }

        // Ajuste de janela (Responsive Sênior)
        window.addEventListener('resize', () => {
            app.renderer.resize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
