<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>ROVER: OAKHAVEN 1909</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Garamond', serif; }
        #game-ui {
            position: absolute; top: 30px; left: 30px;
            color: #e0d5c0; background: rgba(15, 12, 10, 0.9);
            padding: 25px; border: 1px solid #4a3b2c;
            box-shadow: 0 0 40px rgba(0,0,0,0.8); z-index: 100;
        }
        h1 { margin: 0; font-size: 28px; letter-spacing: 6px; text-transform: uppercase; color: #fff; }
        .sep { height: 1px; background: #4a3b2c; margin: 15px 0; }
        #instructions { font-size: 14px; opacity: 0.7; font-style: italic; }
    </style>
</head>
<body>

    <div id="game-ui">
        <h1>Rover</h1>
        <div class="sep"></div>
        <div id="location">ALDEIA DE OAKHAVEN, INGLATERRA</div>
        <div id="date">SETEMBRO DE 1909</div>
        <div id="instructions" style="margin-top: 10px;">Use WASD para caminhar pela neblina.</div>
    </div>

    <canvas id="mainCanvas"></canvas>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        // Configurações Globais
        const WORLD = { width: 4000, height: 4000 };
        const camera = { x: 0, y: 0, targetX: 0, targetY: 0, lerp: 0.08 };
        const keys = {};
        
        // --- GERADOR DE SPRITES REAIS POR CÓDIGO ---
        const sprites = {};

        function generateSprites() {
            // 1. CHÃO: GRAMA E TERRA
            sprites.grass = createBuffer(256, 256, (c) => {
                c.fillStyle = '#2d3621'; c.fillRect(0,0,256,256);
                for(let i=0; i<2000; i++) {
                    c.fillStyle = `rgba(10,20,0,${Math.random()*0.3})`;
                    c.fillRect(Math.random()*256, Math.random()*256, 3, 3);
                }
            });

            // 2. RUA: PEDREGULHOS E TERRA BATIDA
            sprites.road = createBuffer(128, 128, (c) => {
                c.fillStyle = '#4a3f35'; c.fillRect(0,0,128,128);
                for(let i=0; i<300; i++) {
                    c.fillStyle = '#5d534a';
                    c.beginPath();
                    c.arc(Math.random()*128, Math.random()*128, Math.random()*3, 0, 7);
                    c.fill();
                }
            });

            // 3. CASA REAL: MADEIRA E TELHADO
            sprites.house = createBuffer(200, 250, (c) => {
                // Sombra projetada
                c.fillStyle = 'rgba(0,0,0,0.3)';
                c.fillRect(20, 150, 160, 80);
                
                // Paredes (Tábuas de madeira)
                c.fillStyle = '#3d2b1f';
                c.fillRect(30, 100, 140, 120);
                for(let i=100; i<220; i+=10) {
                    c.strokeStyle = '#2a1d15'; c.strokeRect(30, i, 140, 10);
                }

                // Porta e Janelas
                c.fillStyle = '#1a120b'; c.fillRect(85, 170, 30, 50); // Porta
                c.fillStyle = '#5d6d7a'; c.fillRect(50, 130, 25, 25); // Janela L
                c.fillStyle = '#5d6d7a'; c.fillRect(125, 130, 25, 25); // Janela R

                // Telhado (Perspectiva Triangular)
                c.fillStyle = '#2d241a';
                c.beginPath();
                c.moveTo(20, 100); c.lineTo(100, 30); c.lineTo(180, 100);
                c.fill();
                c.strokeStyle = '#1a1510'; c.lineWidth = 3; c.stroke();
            });

            // 4. ÁRVORE: TRONCO E FOLHAGEM
            sprites.tree = createBuffer(150, 200, (c) => {
                c.fillStyle = '#2b1d0e'; c.fillRect(70, 130, 10, 50); // Tronco
                c.fillStyle = '#1a2b1a';
                for(let i=0; i<15; i++) { // Folhagem densa
                    c.beginPath();
                    c.arc(75 + (Math.random()-0.5)*50, 80 + (Math.random()-0.5)*80, 30 + Math.random()*20, 0, 7);
                    c.fill();
                }
            });

            // 5. ROVER (BONECO REAL ESTILO LIMBO)
            sprites.rover = createBuffer(64, 100, (c) => {
                c.fillStyle = '#000';
                // Pernas
                c.fillRect(26, 70, 4, 25); c.fillRect(34, 70, 4, 25);
                // Corpo
                c.fillRect(22, 35, 20, 40);
                // Cabeça
                c.beginPath(); c.arc(32, 25, 16, 0, 7); c.fill();
                // Olhos (Bloom)
                c.fillStyle = '#fff';
                c.shadowBlur = 10; c.shadowColor = '#fff';
                c.beginPath(); c.arc(26, 23, 3, 0, 7); c.fill();
                c.beginPath(); c.arc(38, 23, 3, 0, 7); c.fill();
            });
        }

        function createBuffer(w, h, drawFn) {
            const b = document.createElement('canvas');
            b.width = w; b.height = h;
            drawFn(b.getContext('2d'), w, h);
            return b;
        }

        // --- ENTIDADES ---
        const player = { x: 2000, y: 2000, vx: 0, vy: 0, speed: 6, friction: 0.85 };
        const entities = [];

        function initWorld() {
            generateSprites();
            
            // Gerar ruas (em cruz)
            for(let i=0; i<15; i++) {
                // Casas ao longo das ruas
                entities.push({ type:'house', x: 1800 + (Math.random()*400), y: 500 + (i*250) });
                entities.push({ type:'house', x: 500 + (i*250), y: 1800 + (Math.random()*400) });
            }

            // Gerar árvores (floresta ao redor)
            for(let i=0; i<100; i++) {
                entities.push({ 
                    type:'tree', 
                    x: Math.random()*WORLD.width, 
                    y: Math.random()*WORLD.height 
                });
            }
        }

        // --- LOOP DE JOGO ---
        function update() {
            // Movimento com inércia
            if (keys['KeyW']) player.vy -= 1.5;
            if (keys['KeyS']) player.vy += 1.5;
            if (keys['KeyA']) player.vx -= 1.5;
            if (keys['KeyD']) player.vx += 1.5;

            player.vx *= player.friction;
            player.vy *= player.friction;
            
            const nextX = player.x + player.vx;
            const nextY = player.y + player.vy;

            // Colisão simples com as casas
            let collision = false;
            entities.forEach(e => {
                if(e.type === 'house') {
                    const dx = nextX - e.x;
                    const dy = nextY - (e.y + 50); // Ajuste para base da casa
                    if(Math.abs(dx) < 80 && Math.abs(dy) < 50) collision = true;
                }
            });

            if(!collision) {
                player.x = nextX;
                player.y = nextY;
            }

            // Câmera seguidora
            camera.targetX = player.x - canvas.width/2;
            camera.targetY = player.y - canvas.height/2;
            camera.x += (camera.targetX - camera.x) * camera.lerp;
            camera.y += (camera.targetY - camera.y) * camera.lerp;
        }

        function draw() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            
            ctx.save();
            ctx.translate(-camera.x, -camera.y);

            // 1. Renderizar Chão (Tiled)
            for(let x=0; x<WORLD.width; x+=256) {
                for(let y=0; y<WORLD.height; y+=256) {
                    ctx.drawImage(sprites.grass, x, y);
                }
            }

            // 2. Renderizar Ruas
            ctx.drawImage(sprites.road, 0, 1800, WORLD.width, 400); // Rua H
            ctx.drawImage(sprites.road, 1800, 0, 400, WORLD.height); // Rua V

            // 3. Y-Sorting (Desenhar de cima para baixo para profundidade)
            const scene = [...entities, { type:'player', x: player.x, y: player.y }];
            scene.sort((a, b) => a.y - b.y);

            scene.forEach(e => {
                if(e.type === 'house') ctx.drawImage(sprites.house, e.x - 100, e.y - 125);
                if(e.type === 'tree') ctx.drawImage(sprites.tree, e.x - 75, e.y - 180);
                if(e.type === 'player') ctx.drawImage(sprites.rover, e.x - 32, e.y - 90);
            });

            ctx.restore();

            // Efeito de Neblina/Vigência
            const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 100, canvas.width/2, canvas.height/2, canvas.width/1.2);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(1, 'rgba(0,0,0,0.8)');
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,canvas.width, canvas.height);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // --- INICIALIZAÇÃO ---
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        window.dispatchEvent(new Event('resize'));
        window.onkeydown = (e) => keys[e.code] = true;
        window.onkeyup = (e) => keys[e.code] = false;

        initWorld();
        loop();
    </script>
</body>
</html>
