<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento não concluído | O SextoLugar</title>

<style>
body{
  margin:0;
  font-family:"Segoe UI",sans-serif;
  background:#0b0b0f;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.box{
  background:#12121a;
  padding:40px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 0 40px rgba(0,0,0,.6);
  border:1px solid rgba(255,255,255,.05);
  max-width:400px;
}

h1{
  margin-bottom:15px;
}

p{
  color:rgba(255,255,255,.7);
  margin-bottom:25px;
}

button{
  padding:14px 20px;
  border:none;
  border-radius:8px;
  background:#a33;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
  <h1>Pagamento não concluído</h1>
  <p>Algo deu errado durante o pagamento. Você pode tentar novamente.</p>

  <button onclick="tentar()">Tentar novamente</button>
</div>

<script>
function tentar(){
  window.location.href = "/vendas.html";
}
</script>

</body>
</html>
