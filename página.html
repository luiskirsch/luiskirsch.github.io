  <style>
:root {
  --gold: #e6c07b;
  --gold2: rgba(230,192,123,.75);
  --gold3: rgba(230,192,123,.22);
  --text: rgba(255,255,255,.90);
  --text2: rgba(255,255,255,.60);
  --text3: rgba(255,255,255,.38);
  --input-bg: rgba(0,0,0,.32);
  --ok: rgba(155,227,122,.92);
  --err: rgba(255,77,77,.92);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
html { background: #000006; overscroll-behavior: none; }
body {
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
  color: var(--text);
  font-family: ui-serif, Georgia, "Times New Roman", serif;
  background: #000;
}

/* ── Stars canvas ── */
#stars {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  opacity: .88;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  contain: paint;
  transition: filter .35s ease, opacity .35s ease;
}

/* ── Moon ── */
.moonWrap {
  position: fixed;
  left: 50%;
  top: max(32px, env(safe-area-inset-top));
  transform: translateX(-50%);
  z-index: 4;
  width: min(148px, 20vw);
  aspect-ratio: 1;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: filter .35s ease, opacity .35s ease;
}
.moonGlow { display: none; }
.moon { width: 100%; height: 100%; object-fit: contain; }

/* ── Transmission field ── */
#transmissionField {
  position: fixed;
  left: 0;
  right: calc(50vw + 198px);
  margin: auto;
  top: 50%;
  width: min(420px, calc(50vw - 228px));
  min-height: 96px;
  z-index: 90;
  pointer-events: none;
  opacity: 0;
  transform: translateY(calc(-50% + 12px));
  transition: opacity .35s ease, transform .35s ease;
  contain: layout style;
}
#transmissionField.isActive { opacity: 1; transform: translateY(-50%); }
#transmissionField::before {
  content: "";
  position: absolute;
  inset: -22px;
  border-radius: 40px;
  pointer-events: none;
  background: radial-gradient(120% 100% at 50% 50%, rgba(230,192,123,.16) 0%, rgba(230,192,123,.06) 44%, rgba(230,192,123,0) 78%);
  filter: blur(22px);
  opacity: 0;
  transition: opacity .35s ease;
}
#transmissionField.isActive::before { opacity: 1; }
.tfNoise { position: absolute; inset: 0; border-radius: 18px; overflow: hidden; opacity: .55; }
.tfNoise::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 18px;
  background: repeating-linear-gradient(180deg, rgba(255,255,255,0) 0px, rgba(255,255,255,0) 4px, rgba(255,255,255,.055) 5px, rgba(255,255,255,0) 6px);
  animation: tfFlicker .10s linear infinite;
}
.tfNoise::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 18px;
  background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(230,192,123,.18) 42%, rgba(255,255,255,0) 62%);
  transform: translateX(-100%);
  filter: blur(10px);
  opacity: .7;
  animation: tfSweep 1.35s linear infinite;
}
#transmissionField.isTyping .tfNoise::after { animation: none !important; opacity: 0 !important; }
.tfCore {
  position: relative;
  border-radius: 18px;
  padding: 16px 18px 14px;
  border: 1px solid rgba(230,192,123,.16);
  background: linear-gradient(180deg, rgba(20,20,24,.78), rgba(8,8,12,.72));
  box-shadow: 0 0 0 1px rgba(255,255,255,.025) inset, 0 0 28px rgba(230,192,123,.06);
  overflow: hidden;
}
.tfCore::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 18px;
  background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0));
  pointer-events: none;
}
.tfTitle {
  position: relative;
  z-index: 2;
  font-family: "Courier New", monospace;
  font-size: 11px;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: rgba(230,192,123,.84);
  margin-bottom: 10px;
  text-shadow: 0 0 8px rgba(230,192,123,.18);
  min-height: 14px;
}
.tfMessage {
  position: relative;
  z-index: 2;
  min-height: 32px;
  font-family: "Courier New", monospace;
  font-size: clamp(13px, 1.2vw, 18px);
  line-height: 1.45;
  letter-spacing: .08em;
  color: rgba(245,245,245,.96);
  text-shadow: 0 0 8px rgba(255,255,255,.12), 0 0 18px rgba(230,192,123,.16);
  white-space: pre-wrap;
  word-break: break-word;
}
.tfGhost {
  position: absolute;
  inset: auto 18px 14px 18px;
  font-family: "Courier New", monospace;
  font-size: clamp(13px, 1.2vw, 18px);
  line-height: 1.45;
  letter-spacing: .08em;
  color: rgba(255,255,255,.05);
  filter: blur(.65px);
  white-space: pre-wrap;
  word-break: break-word;
  pointer-events: none;
}
@keyframes tfFlicker { 0%{opacity:.18} 35%{opacity:.48} 100%{opacity:.24} }
@keyframes tfSweep { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }

/* ── Sound panel ── */
.soundPanel {
  position: fixed;
  right: max(14px, env(safe-area-inset-right));
  top: max(14px, env(safe-area-inset-top));
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,.10);
  background: rgba(8,8,12,.88);
  box-shadow: 0 18px 60px rgba(0,0,0,.45);
  transition: opacity .25s ease, transform .25s ease;
  transform: translateZ(0);
  contain: paint;
}
.soundPanel.isHidden { opacity: 0; transform: translateY(-10px); pointer-events: none; }
.soundToggle {
  border: 0;
  background: transparent;
  color: rgba(255,255,255,.78);
  font-family: "Courier New", monospace;
  font-size: 11px;
  letter-spacing: .10em;
  text-transform: uppercase;
  cursor: pointer;
  padding: 0;
  min-width: 84px;
  user-select: none;
}
.soundToggle strong { color: var(--gold); }
.soundVolume {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-left: 12px;
  border-left: 1px solid rgba(255,255,255,.10);
}
.volLabel { font-size: 11px; letter-spacing: .12em; color: var(--text3); text-transform: uppercase; }
#volumeSlider {
  width: 130px;
  min-width: 130px;
  height: 16px;
  padding: 0;
  background: transparent;
  -webkit-appearance: none;
  appearance: none;
  outline: none;
  touch-action: pan-y;
}
#volumeSlider::-webkit-slider-runnable-track { height: 4px; background: rgba(255,255,255,.25); border-radius: 999px; }
#volumeSlider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #e6c07b; margin-top: -5px; cursor: pointer; box-shadow: 0 0 10px rgba(230,192,123,.55); }
#volumeSlider::-moz-range-track { height: 4px; background: rgba(255,255,255,.25); border-radius: 999px; }
#volumeSlider::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #e6c07b; border: none; cursor: pointer; }

/* ── Transmission focus (mobile blur) ── */
body.transmissionFocus #stars,
body.transmissionFocus .moonWrap,
body.transmissionFocus .gate,
body.transmissionFocus .soundPanel {
  filter: blur(10px) brightness(.42);
  opacity: .35;
}

/* ══ GATE — auth layout ══ */
.gate {
  position: relative;
  z-index: 5;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding:
    max(120px, calc(env(safe-area-inset-top) + 110px))
    max(20px, env(safe-area-inset-left))
    max(20px, env(safe-area-inset-bottom));
  overflow: hidden;
  animation: gateIn .65s .06s ease both;
}
@keyframes gateIn {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Brand ── */
.gateHeader {
  text-align: center;
  margin-bottom: 10px;
}
.gateKicker {
  display: block;
  font-family: "Courier New", monospace;
  font-size: 12px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--gold2);
  margin-bottom: 5px;
}
.gateTitle {
  font-size: clamp(22px, 3.4vw, 48px);
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  line-height: 1;
  color: transparent;
  background-image: linear-gradient(
    90deg,
    rgba(230,192,123,.58) 0%,
    rgba(230,192,123,.92) 28%,
    rgba(255,255,255,.92) 48%,
    rgba(230,192,123,.92) 58%,
    rgba(230,192,123,.58) 100%
  );
  background-size: 260% 100%;
  background-position: -35% 50%;
  -webkit-background-clip: text;
  background-clip: text;
  animation: shineText 7.8s linear infinite;
}
@keyframes shineText {
  0%   { background-position: -35% 50%; }
  22%  { background-position: -35% 50%; }
  58%  { background-position: 135% 50%; }
  100% { background-position: 135% 50%; }
}

/* ── Tagline ── */
.gateTagline {
  text-align: center;
  font-size: clamp(13px, 1.25vw, 16px);
  color: var(--text2);
  letter-spacing: .06em;
  line-height: 1.62;
  max-width: 40ch;
  margin-bottom: 14px;
}
.gateTagline em {
  display: block;
  margin-top: 6px;
  font-style: normal;
  font-family: "Courier New", monospace;
  font-size: .85em;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--text3);
  animation: breathe 3.2s ease-in-out infinite;
}
@keyframes breathe {
  0%,100% { opacity: .30; }
  50%      { opacity: 1; }
}

/* ── Auth card ── */
.authCard {
  width: min(396px, 100%);
  background: linear-gradient(180deg, rgba(16,16,22,.96), rgba(8,8,14,.95));
  border-radius: 22px;
  border: 1px solid rgba(255,255,255,.08);
  box-shadow:
    inset 0 1px 0 rgba(230,192,123,.18),
    0 2px 0 rgba(230,192,123,.07),
    0 44px 110px rgba(0,0,0,.75);
  overflow: hidden;
}
@keyframes cardGlow {
  0%,100% { box-shadow: inset 0 1px 0 rgba(230,192,123,.18), 0 2px 0 rgba(230,192,123,.07), 0 44px 110px rgba(0,0,0,.75); }
  50%      { box-shadow: inset 0 1px 0 rgba(230,192,123,.26), 0 2px 0 rgba(230,192,123,.12), 0 44px 110px rgba(0,0,0,.75), 0 0 64px rgba(230,192,123,.06); }
}

/* ── Tabs ── */
.authTabs {
  display: flex;
  border-bottom: 1px solid rgba(255,255,255,.07);
  position: relative;
}
.authTab {
  flex: 1;
  padding: 15px 12px;
  background: none;
  border: none;
  color: rgba(255,255,255,.58);
  cursor: pointer;
  font-family: "Courier New", monospace;
  font-size: 11px;
  letter-spacing: .20em;
  text-transform: uppercase;
  transition: color .2s ease;
  position: relative;
  z-index: 1;
}
.authTab.active { color: var(--gold); }
.authTabBar {
  position: absolute;
  bottom: 0;
  height: 1px;
  width: 50%;
  background: linear-gradient(90deg, transparent, var(--gold) 35%, var(--gold) 65%, transparent);
  left: 0;
  transition: left .22s cubic-bezier(.4,0,.2,1);
}

/* ── Panels ── */
.authPanel { display: none; padding: 26px 24px 30px; }
.authPanel.active { display: block; }
.authPanel.connectedPanel { text-align: center; }

/* ── Form ── */
.authGroup { margin-bottom: 16px; }
.authLabel {
  display: block;
  font-family: "Courier New", monospace;
  font-size: 11px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 8px;
}
.authInput {
  width: 100%;
  background: var(--input-bg);
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 10px;
  color: var(--text);
  padding: 14px 16px;
  font-family: inherit;
  font-size: 16px;
  outline: none;
  transition: border-color .18s;
  -webkit-appearance: none;
  appearance: none;
}
.authInput:focus { border-color: rgba(230,192,123,.36); }
.authInput::placeholder { color: rgba(255,255,255,.22); }
.authRow2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ── Messages ── */
.authMsg {
  font-family: "Courier New", monospace;
  font-size: 11px;
  letter-spacing: .06em;
  color: var(--text3);
  text-align: center;
  min-height: 18px;
  margin-bottom: 14px;
  line-height: 1.45;
}
.authMsg.ok  { color: var(--ok); }
.authMsg.err { color: var(--err); }

/* ── Buttons ── */
.authBtn {
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, rgba(230,192,123,.13), rgba(201,156,74,.09));
  border: 1px solid rgba(230,192,123,.28);
  border-radius: 10px;
  color: var(--gold);
  font-family: "Courier New", monospace;
  font-size: 10px;
  letter-spacing: .24em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background .18s, border-color .18s, transform .12s;
}
.authBtn:hover:not(:disabled) {
  background: linear-gradient(135deg, rgba(230,192,123,.22), rgba(201,156,74,.16));
  border-color: rgba(230,192,123,.48);
  transform: translateY(-1px);
}
.authBtn:active { transform: translateY(0); }
.authBtn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.authBtn.secondary {
  background: transparent;
  border-color: rgba(255,255,255,.10);
  color: var(--text2);
  margin-top: 8px;
}
.authBtn.secondary:hover:not(:disabled) {
  background: rgba(255,255,255,.04);
  border-color: rgba(255,255,255,.18);
}
.authLink {
  display: block;
  text-align: center;
  margin-top: 11px;
  font-size: 11px;
  letter-spacing: .05em;
  color: var(--text3);
  cursor: pointer;
  background: none;
  border: none;
  font-family: inherit;
  text-decoration: underline;
  text-decoration-color: rgba(255,255,255,.14);
  transition: color .18s;
}
.authLink:hover { color: var(--text2); }

/* ── Connected state ── */
.connectedAvatar {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(230,192,123,.17), rgba(201,156,74,.11));
  border: 1px solid rgba(230,192,123,.22);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 14px;
  color: var(--gold);
}
.connectedName {
  font-size: clamp(15px, 1.7vw, 18px);
  color: var(--text);
  margin-bottom: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 100%;
}
.connectedSub {
  font-family: "Courier New", monospace;
  font-size: 9px;
  letter-spacing: .20em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 20px;
}

/* ── Footer ── */
.gateFooter {
  margin-top: 12px;
  text-align: center;
  font-size: 9px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--text3);
  opacity: .55;
}
.gateFooter .brand { color: rgba(230,192,123,.62); font-weight: 700; }

/* ── Responsive ── */
@media (max-width: 700px) {
  .moonWrap { width: min(100px, 22vw); }
  .gate { padding-top: max(100px, calc(env(safe-area-inset-top) + 90px)); }
  .soundPanel { right: 10px; left: 10px; width: auto; justify-content: space-between; border-radius: 14px; }
  #volumeSlider { width: 96px; min-width: 96px; }
  #transmissionField { left: 50%; top: 50%; width: min(86vw, 400px); transform: translate(-50%, calc(-50% + 12px)); }
  #transmissionField.isActive { transform: translate(-50%, -50%); }
  .tfMessage, .tfGhost { font-size: clamp(13px, 3.8vw, 17px); }
}
@media (max-width: 480px) {
  .gate { padding-top: max(90px, calc(env(safe-area-inset-top) + 80px)); }
  .gateTagline { font-size: 13px; }
  .authCard { border-radius: 18px; }
  .authPanel { padding: 18px 18px 22px; }
  .authRow2 { grid-template-columns: 1fr; }
}
@media (hover: none) and (pointer: coarse) {
  .authCard { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
  #transmissionField { mix-blend-mode: normal !important; }
}
@media (prefers-reduced-motion: reduce) {
  .gateTitle, .gateTagline em, .authCard { animation: none !important; }
  .gate { animation: none !important; }
  #stars { display: none; }
}

/* ── Rotating phrases ── */
.gatePhrase {
  text-align: center;
  font-family: "Courier New", monospace;
  font-size: clamp(10px, 1.1vw, 13px);
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 18px;
  min-height: 16px;
  opacity: 0;
  transition: opacity .8s ease;
}
.gatePhrase.visible { opacity: 1; }

/* ── Context banner ── */
.ctxBanner {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 50;
  padding: 11px 20px;
  background: linear-gradient(90deg, rgba(230,192,123,.10), rgba(230,192,123,.07), rgba(230,192,123,.10));
  border-bottom: 1px solid rgba(230,192,123,.18);
  text-align: center;
  font-family: "Courier New", monospace;
  font-size: 11px;
  letter-spacing: .14em;
  color: rgba(230,192,123,.82);
  transform: translateY(-100%);
  transition: transform .45s ease;
  pointer-events: none;
  display: none;
}
.ctxBanner.ctxVisible { transform: translateY(0); pointer-events: auto; display: block; }

/* ── World state bar ── */
.worldBar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 22px;
  padding-bottom: max(14px, env(safe-area-inset-bottom));
  background: linear-gradient(to top, rgba(0,0,0,.62) 0%, rgba(0,0,0,0) 100%);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.6s ease;
}
.worldBar.wbVisible { opacity: 1; }
.worldBarItem {
  font-family: "Courier New", monospace;
  font-size: 10px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--text3);
  padding: 10px 0;
  white-space: nowrap;
}
.wbDot {
  display: inline-block;
  vertical-align: middle;
  width: 6px; height: 6px;
  border-radius: 50%;
  margin-right: 4px;
  background: rgba(155,227,122,.78);

function starColor(temp,alpha){var b=clamp(-temp,0,1);var g=clamp(temp,0,1);var R=255-Math.floor(b*18)+Math.floor(g*14);var G=255-Math.floor(b*8)+Math.floor(g*10);var B=255+Math.floor(b*18)-Math.floor(g*18);return "rgba("+R+","+G+","+B+","+alpha.toFixed(3)+")";}

earGradient(x-dx,y-dy,x+dx,y+dy);lg.addColorStop(0.00,"rgba(255,255,255,0)");lg.addColorStop(0.46,"rgba(255,255,255,0)");lg.addColorStop(0.50,"rgba(255,255,255,"+peak+")");lg.addColorStop(0.54,"rgba(255,255,255,0)");lg.addColorStop(1.00,"rgba(255,255,255,0)");ctx.strokeStyle=lg;ctx.beginPath();ctx.moveTo(x-dx,y-dy);ctx.lineTo(x+dx,y+dy);ctx.stroke();}ray(0,L,"0.95");ray(Math.PI/2,L,"0.90");ctx.globalAlpha=aSp*0.38;ray(Math.PI/4,L*0.56,"0.78");ray(-Math.PI/4,L*0.56,"0.78");}ctx.restore();}
function drawStars(arr,px,py,parScale,animate){for(var i=0;i<arr.length;i++){var s=arr[i];if(animate){s.y+=s.v;if(s.y>h+12){s.y=-12;s.x=Math.random()*w;}s.ph+=s.tw;}var tw=(Math.sin(s.ph)*0.5+0.5);var a=s.a+(tw-0.5)*s.twa;var x=s.x+(px*parScale);var y=s.y+(py*parScale);if(x<-30) x+=(w+60);if(x>w+30) x-=(w+60);var chroma=(Math.sin(s.ph*0.85+s.x*0.002)*0.5+0.5);var tempShift=(chroma-0.5)*0.20;var tempNow=clamp(s.temp+tempShift,-1,1);drawStar(x,y,s.r,clamp(a,0,1),tempNow,s.ph,animate);}}

function drawRocks(px,py,animate){var moonX=moonMask?moonMask.x:w*0.5;var moonY=moonMask?moonMask.y:h*0.18;var moonR=moonMask?moonMask.r:40;for(var i=0;i<rocks.length;i++){var r=rocks[i];if(animate){r.ph+=r.wob;r.x+=r.vx+(Math.cos(r.ph)*0.03);r.y+=r.vy+(Math.sin(r.ph)*0.03);r.rot+=r.rv;if(r.mode==="moon"){var dxm=moonX-r.x;var dym=moonY-r.y;r.x+=dxm*r.moonPull*(1.10-Math.min(0.95,r.z*0.55));r.y+=dym*r.moonPull*(1.10-Math.min(0.95,r.z*0.55));r.z-=r.vz*0.40;}else if(r.mode==="deep"){r.x+=r.deepDriftX;r.y+=r.deepDriftY;r.z-=r.vz;}else{r.z-=r.vz*0.18;}if(r.x<-260||r.x>w+260||r.y<-260||r.y>h+260||r.z<=0.06){respawnRock(r,false);}}var depthScale=clamp(r.z,0.03,1.25);var worldScale=Math.pow(depthScale,1.22);var rr=r.baseR*worldScale;var P=6.0*depthScale;var x=r.x+(px*P*0.10);var y=r.y+(py*P*0.10);if(rr<0.8) continue;var dxMoon=x-moonX;var dyMoon=y-moonY;var distMoon=Math.sqrt(dxMoon*dxMoon+dyMoon*dyMoon);if(distMoon<moonR*1.10){var backFactor=clamp((moonR*1.10-distMoon)/(moonR*1.10),0,1);var shrink=lerp(1,0.30,backFactor);rr*=shrink;worldScale*=shrink;}if(rr<0.45) continue;var alpha=clamp(depthScale*r.fadeBias,0.08,1);ctx.save();ctx.globalCompositeOperation="source-over";ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.rotate(r.rot);ctx.beginPath();var pts=r.pts;ctx.moveTo(pts[0].x*worldScale,pts[0].y*worldScale);for(var k=1;k<pts.length;k++) ctx.lineTo(pts[k].x*worldScale,pts[k].y*worldScale);ctx.closePath();ctx.fillStyle="rgb(20,20,26)";ctx.fill();var g=ctx.createRadialGradient(-rr*0.35,-rr*0.35,rr*0.15,0,0,rr*1.25);g.addColorStop(0,"rgba(255,255,255,0.10)");g.addColorStop(0.45,"rgba(255,255,255,0.04)");g.addColorStop(1,"rgba(0,0,0,0.65)");ctx.fillStyle=g;ctx.fill();ctx.lineWidth=Math.max(0.6,0.9*worldScale);ctx.strokeStyle="rgba(0,0,0,0.75)";ctx.stroke();ctx.restore();}}
function spawnMeteor(){var edge=Math.floor(rand(0,4));var x,y,angle,speed=rand(8.5,14.5);if(edge===0){x=rand(-w*0.2,w*1.2);y=-60;angle=rand(0.35,1.20);}else if(edge===1){x=w+60;y=rand(-h*0.2,h*0.8);angle=rand(2.20,3.70);}else if(edge===2){x=rand(-w*0.2,w*1.2);y=h+60;angle=rand(3.80,5.50);}else{x=-60;y=rand(-h*0.2,h*0.8);angle=rand(-0.50,1.10);}meteors.push({x:x,y:y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:0,maxLife:rand(28,46),len:rand(90,170),a:rand(0.30,0.70),w:rand(1.0,2.2)});}

function spawnFlyby(){var startFromLeft=Math.random()<0.5;var y=rand(h*0.12,h*0.82);var x=startFromLeft?-120:w+120;var dir=startFromLeft?1:-1;var vx=rand(10.5,16.5)*dir;var vy=rand(-0.8,0.8);var targetShrink=rand(0.88,0.94);flybys.push({x:x,y:y,vx:vx,vy:vy,life:0,maxLife:rand(24,34),size:rand(18,34),rot:rand(0,Math.PI*2),rv:rand(-0.08,0.08),a:rand(0.18,0.34),shrinkTo:targetShrink,len:rand(70,140)});}

<script>
(function(){

var radioTimer=null;var transmissionPlayedThisLoad=false;var activeTransmissionNodes=[];

function buildTransmissionStatic(){if(!audioCtx||!master) return function(){};stopTransmissionStatic();var now=audioCtx.currentTime;var noise=createBrownNoise(audioCtx);var hp=audioCtx.createBiquadFilter();hp.type="highpass";hp.frequency.setValueAtTime(210+Math.random()*45,now);hp.Q.setValueAtTime(0.8,now);var bp=audioCtx.createBiquadFilter();bp.type="bandpass";bp.frequency.setValueAtTime(1060+Math.random()*120,now);bp.Q.setValueAtTime(1.35,now);var lp=audioCtx.createBiquadFilter();lp.type="lowpass";lp.frequency.setValueAtTime(1850+Math.random()*160,now);lp.Q.setValueAtTime(0.8,now);var staticGain=audioCtx.createGain();staticGain.gain.setValueAtTime(0.00001,now);staticGain.gain.exponentialRampToValueAtTime(0.66,now+0.25);noise.connect(hp);hp.connect(bp);bp.connect(lp);lp.connect(staticGain);staticGain.connect(master);noise.start(now);activeTransmissionNodes.push(noise,hp,bp,lp,staticGain);var flutterLFO=audioCtx.createOscillator();flutterLFO.type="sine";flutterLFO.frequency.setValueAtTime(0.20,now);var flutterGain=audioCtx.createGain();flutterGain.gain.setValueAtTime(95,now);flutterLFO.connect(flutterGain);flutterGain.connect(bp.frequency);flutterLFO.start(now);activeTransmissionNodes.push(flutterLFO,flutterGain);var shimmerNoise=createBrownNoise(audioCtx);var shimmerHP=audioCtx.createBiquadFilter();shimmerHP.type="highpass";shimmerHP.frequency.setValueAtTime(1700,now);var shimmerBP=audioCtx.createBiquadFilter();shimmerBP.type="bandpass";shimmerBP.frequency.setValueAtTime(2100,now);shimmerBP.Q.setValueAtTime(3.1,now);var shimmerGain=audioCtx.createGain();shimmerGain.gain.setValueAtTime(0.00001,now);shimmerGain.gain.exponentialRampToValueAtTime(0.120,now+0.8);shimmerNoise.connect(shimmerHP);shimmerHP.connect(shimmerBP);shimmerBP.connect(shimmerGain);shimmerGain.connect(master);shimmerNoise.start(now);activeTransmissionNodes.push(shimmerNoise,shimmerHP,shimmerBP,shimmerGain);var clickTimers=[];function scheduleClick(){if(!audioCtx||!master) return;var delay=700+Math.random()*600;var timer=setTimeout(function(){try{var tt=audioCtx.currentTime+0.02;var cOsc=audioCtx.createOscillator();cOsc.type="triangle";cOsc.frequency.setValueAtTime(1200+Math.random()*800,tt);var cBP=audioCtx.createBiquadFilter();cBP.type="bandpass";cBP.frequency.setValueAtTime(1550+Math.random()*500,tt);cBP.Q.setValueAtTime(7,tt);var cGain=audioCtx.createGain();cGain.gain.setValueAtTime(0.00001,tt);cGain.gain.exponentialRampToValueAtTime(0.004+Math.random()*0.003,tt+0.008);cGain.gain.exponentialRampToValueAtTime(0.00001,tt+0.040);cOsc.connect(cBP);cBP.connect(cGain);cGain.connect(master);cOsc.start(tt);cOsc.stop(tt+0.05);}catch(e){}scheduleClick();},delay);clickTimers.push(timer);}scheduleClick();return function(){for(var i=0;i<clickTimers.length;i++){try{clearTimeout(clickTimers[i]);}catch(e){}}try{if(staticGain&&audioCtx){var endNow=audioCtx.currentTime;staticGain.gain.cancelScheduledValues(endNow);staticGain.gain.setValueAtTime(Math.max(0.00001,staticGain.gain.value),endNow);staticGain.gain.exponentialRampToValueAtTime(0.00001,endNow+0.28);}}catch(e){}try{if(shimmerGain&&audioCtx){var endNow2=audioCtx.currentTime;shimmerGain.gain.cancelScheduledValues(endNow2);shimmerGain.gain.setValueAtTime(Math.max(0.00001,shimmerGain.gain.value),endNow2);shimmerGain.gain.exponentialRampToValueAtTime(0.00001,endNow2+0.22);}}catch(e){}setTimeout(function(){stopTransmissionStatic();},380);};}
function playTransmissionMessageOnly(){if(!audioCtx||!master||transmissionPlayedThisLoad) return;transmissionPlayedThisLoad=true;var text="Olá, visitante. Seja bem-vindo. Você acaba de chegar a um lugar inédito e curioso. Preste muita atenção nas informações e siga em frente. Até logo.";var title="UMA TRANSMISSÃO RECEBIDA";var transmissionStaticStopper=null;function startStatic(){if(transmissionStaticStopper) return;transmissionStaticStopper=buildTransmissionStatic();}function stopStatic(){if(!transmissionStaticStopper) return;transmissionStaticStopper();transmissionStaticStopper=null;}if(window.showTransmissionSequence){window.showTransmissionSequence(title,text,{openDelay:5000,closeDelay:3000,typingSpeed:95,startStatic:startStatic,stopStatic:stopStatic});}}

<!-- ── Pull to refresh ── -->
<script>
(function(){
var mm=window.matchMedia?window.matchMedia("(prefers-reduced-motion: reduce)"):null;
var reduced=mm?mm.matches:false;
if(reduced) return;
var startY=0,pulling=false,dist=0,THRESH=85;
function atTop(){return(window.scrollY||0)<=0;}
function onStart(e){if(!atTop()) return;if(!e.touches||!e.touches[0]) return;startY=e.touches[0].clientY;pulling=true;dist=0;}
function onMove(e){if(!pulling) return;if(!e.touches||!e.touches[0]) return;var y=e.touches[0].clientY;dist=y-startY;if(dist>0){e.preventDefault();}}
function onEnd(){if(!pulling) return;pulling=false;if(dist>=THRESH){window.location.reload();}dist=0;}
window.addEventListener("touchstart",onStart,{passive:true});
window.addEventListener("touchmove",onMove,{passive:false});
window.addEventListener("touchend",onEnd,{passive:true});
window.addEventListener("touchcancel",onEnd,{passive:true});
})();
</script>

<script>
(function(){

  "Seis lugares. Uma única noite.",
  "Nada é encenação aqui dentro",
  "O jogo começa antes das cartas",
  "Você vai lembrar desta noite"
];
var phraseEl=document.getElementById("gatePhrase");
var phraseIdx=0;

  if(!phraseEl) return;
  phraseEl.classList.remove("visible");
  setTimeout(function(){phraseEl.textContent=text;phraseEl.classList.add("visible");},800);
}
function cyclePhrase(){showPhrase(phrases[phraseIdx++%phrases.length]);}
setTimeout(function(){cyclePhrase();setInterval(cyclePhrase,5400);},2600);

var params=new URLSearchParams(window.location.search);
var bannerEl=document.getElementById("ctxBanner");
if(bannerEl){
  var inviteCode=params.get("invite");
  var reconnect=params.has("reconnect");
  if(inviteCode){
    bannerEl.textContent="▰ Você foi convidado — código "+inviteCode.slice(0,12).toUpperCase()+" · Entre para confirmar";
    setTimeout(function(){bannerEl.classList.add("ctxVisible");},600);

    bannerEl.textContent="▰ Sua sessão foi interrompida — entre para retomar de onde parou";

<!-- ── Firebase Auth ── -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  sendPasswordResetEmail,
  updateProfile,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC8sSvA7_1HPYRFGFgdgzstkP_yQHadY-c",
  authDomain: "osextolugar-game.firebaseapp.com",
  projectId: "osextolugar-game",
  storageBucket: "osextolugar-game.firebasestorage.app",
  messagingSenderId: "947922328721",
  appId: "1:947922328721:web:989522c99e16ab449f3330",
  measurementId: "G-D6HG779ZFR"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

function validEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

function mapErr(code) {
  return ({
    "auth/invalid-email":          "E-mail inválido.",
    "auth/user-not-found":         "Usuário não encontrado.",
    "auth/wrong-password":         "Senha incorreta.",
    "auth/invalid-credential":     "E-mail ou senha incorretos.",
    "auth/email-already-in-use":   "E-mail já cadastrado.",
    "auth/weak-password":          "Senha fraca. Use ao menos 6 caracteres.",
    "auth/too-many-requests":      "Muitas tentativas. Aguarde e tente novamente.",
    "auth/network-request-failed": "Erro de conexão. Verifique sua internet.",
  })[code] || "Erro inesperado. Tente novamente.";
}

function setMsg(id, text, type) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.className = "authMsg" + (type ? " " + type : "");
}

function setBtn(formId, disabled) {
  const btn = document.querySelector("#" + formId + " .authBtn[type=submit]");
  if (btn) btn.disabled = disabled;
}

/* Connected state */
function showConnected(user) {
  const authTabs = document.getElementById("authTabs");
  const panelLogin = document.getElementById("panelLogin");
  const panelRegister = document.getElementById("panelRegister");
  const panelConnected = document.getElementById("panelConnected");
  const connectedName = document.getElementById("connectedName");
  if (authTabs) authTabs.style.display = "none";
  if (panelLogin) panelLogin.classList.remove("active");
  if (panelRegister) panelRegister.classList.remove("active");
  if (panelConnected) { panelConnected.style.display = ""; panelConnected.classList.add("active"); }
  if (connectedName) {
    connectedName.textContent = (user.displayName || "").trim() || user.email || "Minha conta";
  }
}

function showAuth() {
  const authTabs = document.getElementById("authTabs");
  const panelLogin = document.getElementById("panelLogin");
  const panelConnected = document.getElementById("panelConnected");
  if (authTabs) authTabs.style.display = "";
  if (panelLogin) panelLogin.classList.add("active");
  if (panelConnected) { panelConnected.style.display = "none"; panelConnected.classList.remove("active"); }
}

/* Login */
const loginForm = document.getElementById("loginForm");
if (loginForm) {
  loginForm.addEventListener("submit", async function(e) {
    e.preventDefault();
    const email = (document.getElementById("loginEmail")?.value || "").trim().toLowerCase();
    const pass  = (document.getElementById("loginPass")?.value || "");
    if (!email || !validEmail(email)) { setMsg("loginMsg","Preencha um e-mail válido.","err"); return; }
    if (!pass)                        { setMsg("loginMsg","Preencha a senha.","err"); return; }
    setBtn("loginForm", true);
    setMsg("loginMsg","Verificando…");
    try {
      const cred = await signInWithEmailAndPassword(auth, email, pass);
      if (cred.user) localStorage.setItem("osl_auth_uid", cred.user.uid);
      setMsg("loginMsg","Acesso autorizado.","ok");
      setTimeout(() => { window.location.href = "./entrada.html"; }, 600);
    } catch(err) {
      setMsg("loginMsg", mapErr(err.code), "err");
      setBtn("loginForm", false);
    }
  });
}

/* Forgot password */
document.getElementById("btnForgot")?.addEventListener("click", async function() {
  const email = (document.getElementById("loginEmail")?.value || "").trim().toLowerCase();
  if (!email || !validEmail(email)) { setMsg("loginMsg","Digite seu e-mail acima primeiro.","err"); return; }
  try {
    await sendPasswordResetEmail(auth, email);
    setMsg("loginMsg","E-mail de recuperação enviado.","ok");
  } catch(err) {
    setMsg("loginMsg", mapErr(err.code), "err");
  }
});

/* Register */
const registerForm = document.getElementById("registerForm");
if (registerForm) {
  registerForm.addEventListener("submit", async function(e) {
    e.preventDefault();
    const nome    = (document.getElementById("regNome")?.value    || "").trim().slice(0, 80);
    const email   = (document.getElementById("regEmail")?.value   || "").trim().toLowerCase();
    const pass    = (document.getElementById("regPass")?.value    || "");
    const confirm = (document.getElementById("regConfirm")?.value || "");
    if (!email || !validEmail(email)) { setMsg("registerMsg","Preencha um e-mail válido.","err"); return; }
    if (!pass || pass.length < 6)    { setMsg("registerMsg","Senha deve ter ao menos 6 caracteres.","err"); return; }
    if (pass !== confirm)            { setMsg("registerMsg","As senhas não coincidem.","err"); return; }
    setBtn("registerForm", true);
    setMsg("registerMsg","Criando conta…");
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      if (nome) await updateProfile(cred.user, { displayName: nome });
      if (cred.user) localStorage.setItem("osl_auth_uid", cred.user.uid);
      setMsg("registerMsg","Conta criada! Redirecionando…","ok");
      setTimeout(() => { window.location.href = "./entrada.html"; }, 800);
    } catch(err) {
      setMsg("registerMsg", mapErr(err.code), "err");
      setBtn("registerForm", false);
    }
  });
}

/* Connected panel */
document.getElementById("btnPainel")?.addEventListener("click", () => { window.location.href = "./entrada.html"; });
document.getElementById("btnLogout")?.addEventListener("click", async () => { try { await signOut(auth); } catch(e) {} localStorage.removeItem("osl_auth_uid"); });

/* Auth state */
onAuthStateChanged(auth, (user) => {
  if (user && !user.isAnonymous) {
    localStorage.setItem("osl_auth_uid", user.uid);
    showConnected(user);
  } else {
    showAuth();
  }
});
</script>
