<style>
:root {
  --gold: #e6c07b;
  --gold2: rgba(230,192,123,.75);
  --gold3: rgba(230,192,123,.22);
  --text: rgba(255,255,255,.90);
  --text2: rgba(255,255,255,.60);
  --text3: rgba(255,255,255,.38);
  --ok: rgba(155,227,122,.92);
  --err: rgba(255,77,77,.92);
  --nav-h: 58px;
  --mob-h: 56px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
html { background: #000006; overscroll-behavior: none; }
body {
  min-height: 100vh; min-height: 100dvh;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
  color: var(--text);
  font-family: ui-serif, Georgia, "Times New Roman", serif;
  background: #000;
}

/* ── Stars ── */
#stars {
  position: fixed; inset: 0;
  z-index: 2;
  pointer-events: none;
  opacity: .88;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  contain: paint;
}

/* ── Moon ── */
.moonWrap {
  position: fixed;
  right: max(5vw, 44px);
  top: calc(var(--nav-h) + max(28px, 3vh));
  z-index: 4;
  width: min(88px, 10vw);
  aspect-ratio: 1;
  pointer-events: none;
  opacity: .55;
}
.moon { width: 100%; height: 100%; object-fit: contain; }

/* ── Loading veil ── */
.loadVeil {
  position: fixed; inset: 0;
  z-index: 400;
  background: rgba(0,0,4,.97);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity .55s ease;
}
.loadVeil.out { opacity: 0; pointer-events: none; }
.ldDots { display: flex; gap: 8px; }
.ldDot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: rgba(230,192,123,.5);
  animation: ldPulse 1.3s ease-in-out infinite;
}
.ldDot:nth-child(2) { animation-delay: .2s; }
.ldDot:nth-child(3) { animation-delay: .4s; }
@keyframes ldPulse { 0%,80%,100%{opacity:.12} 40%{opacity:.88} }

/* ── Top nav ── */
.hubNav {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 60;
  height: var(--nav-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left));
  background: linear-gradient(180deg, rgba(0,0,6,.80) 0%, rgba(0,0,6,0) 100%);
  border-bottom: 1px solid rgba(255,255,255,.04);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.hubLogo {
  font-family: "Courier New", monospace;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .24em;
  color: var(--gold);
  text-decoration: none;
  user-select: none;
  flex-shrink: 0;
}
.navCenter {
  display: flex;
  gap: 26px;
}
.navLink {
  font-family: "Courier New", monospace;
  font-size: 9px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--text3);
  text-decoration: none;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  transition: color .18s;
}
.navLink:hover { color: var(--text2); }
.navLink.current { color: var(--gold); }
.navRight {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.navIco {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text3);
  font-size: 15px;
  padding: 5px;
  line-height: 1;
  transition: color .18s;
  position: relative;
}
.navIco:hover { color: var(--text2); }
.navBadge {
  position: absolute;
  top: 0; right: 0;
  min-width: 14px; height: 14px;
  padding: 0 3px;
  border-radius: 7px;
  background: var(--err);
  color: #fff;
  font-family: "Courier New", monospace;
  font-size: 7.5px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1.5px solid #000006;
  display: none;
}

/* ── Hub main ── */
.hubMain {
  position: relative;
  z-index: 5;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding:
    calc(var(--nav-h) + 28px)
    max(24px, 5vw)
    calc(var(--mob-h) + 20px);
  animation: hubIn .65s .08s ease both;
}
@keyframes hubIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Greeting */
.hubGreeting { text-align: center; }
.hubSaudacao {
  display: block;
  font-family: "Courier New", monospace;
  font-size: 9px;
  letter-spacing: .30em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 5px;
}
.hubNome {
  font-size: clamp(18px, 2.4vw, 30px);
  font-weight: 700;
  letter-spacing: .10em;
  text-transform: uppercase;
  color: var(--text);
  line-height: 1.1;
}

/* World status */
.hubMundo {
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: "Courier New", monospace;
  font-size: 10px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--text3);
}
.mundoDot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(155,227,122,.78);
  box-shadow: 0 0 6px rgba(155,227,122,.55);
  flex-shrink: 0;
  animation: mdPulse 2.4s ease-in-out infinite;
}
@keyframes mdPulse { 0%,100%{opacity:.55} 50%{opacity:1} }

/* ── Context card ── */
.ctxCard {
  width: min(440px, 100%);
  background: linear-gradient(180deg, rgba(16,16,22,.97), rgba(8,8,14,.96));
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,.07);
  box-shadow: inset 0 1px 0 rgba(230,192,123,.14), 0 40px 100px rgba(0,0,0,.70);
  padding: 26px 26px 24px;
  animation: ctxGlow 5s ease-in-out infinite;
}
@keyframes ctxGlow {
  0%,100% { box-shadow: inset 0 1px 0 rgba(230,192,123,.14), 0 40px 100px rgba(0,0,0,.70); }
  50%      { box-shadow: inset 0 1px 0 rgba(230,192,123,.22), 0 40px 100px rgba(0,0,0,.70), 0 0 55px rgba(230,192,123,.07); }
}
.cardTag {
  font-family: "Courier New", monospace;
  font-size: 9px;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: var(--gold2);
  margin-bottom: 10px;
}
.cardTitle {
  font-size: clamp(15px, 1.9vw, 21px);
  font-weight: 700;
  letter-spacing: .05em;
  color: var(--text);
  line-height: 1.2;
  margin-bottom: 7px;
}
.cardMeta {
  font-family: "Courier New", monospace;
  font-size: 10px;
  letter-spacing: .08em;
  color: var(--text3);
  margin-bottom: 20px;
  line-height: 1.6;
}
.cardBtn {
  width: 100%;
  padding: 13px 16px;
  background: linear-gradient(135deg, rgba(230,192,123,.15), rgba(201,156,74,.09));
  border: 1px solid rgba(230,192,123,.28);
  border-radius: 10px;
  color: var(--gold);
  font-family: "Courier New", monospace;
  font-size: 10px;
  letter-spacing: .24em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background .18s, border-color .18s, transform .12s;
}
.cardBtn:hover {
  background: linear-gradient(135deg, rgba(230,192,123,.24), rgba(201,156,74,.15));
  border-color: rgba(230,192,123,.50);
  transform: translateY(-1px);
}
.cardBtn:active { transform: translateY(0); }
.cardBtn.sec {
  margin-top: 8px;
  background: transparent;
  border-color: rgba(255,255,255,.08);
  color: var(--text2);
}
.cardBtn.sec:hover {
  background: rgba(255,255,255,.04);
  border-color: rgba(255,255,255,.16);
}

/* ── Ritual ── */
.ritualBox {
  width: min(440px, 100%);
  text-align: center;
  padding: 18px 24px 16px;
  border: 1px solid rgba(255,255,255,.05);
  border-radius: 14px;
  background: rgba(255,255,255,.018);
}
.ritualTag {
  display: block;
  font-family: "Courier New", monospace;
  font-size: 9px;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 9px;
}
.ritualQ {
  font-size: clamp(13px, 1.25vw, 15px);
  font-style: italic;
  color: var(--text2);
  letter-spacing: .03em;
  line-height: 1.6;
  margin-bottom: 14px;
}
.ritualCta {
  display: inline-block;
  padding: 8px 22px;
  background: transparent;
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 999px;
  color: var(--text3);
  font-family: "Courier New", monospace;
  font-size: 9px;
  letter-spacing: .20em;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color .18s, color .18s;
}
.ritualCta:hover { border-color: rgba(255,255,255,.24); color: var(--text2); }

/* ── Season chip ── */
.seasonChip {
  font-family: "Courier New", monospace;
  font-size: 9px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--text3);
  opacity: .45;
  text-align: center;
}

/* ── Mobile bottom nav ── */
.mobNav {
  display: none;
  position: fixed;
  inset: auto 0 0 0;
  z-index: 60;
  height: var(--mob-h);
  padding-bottom: env(safe-area-inset-bottom);
  background: rgba(0,0,4,.92);
  border-top: 1px solid rgba(255,255,255,.05);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.mobNavRow {
  display: flex;
  height: 100%;
}
.mobNavBtn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: none;
  border: none;
  color: var(--text3);
  font-family: "Courier New", monospace;
  font-size: 7px;
  letter-spacing: .10em;
  text-transform: uppercase;
  cursor: pointer;
  padding: 8px 2px;
  transition: color .18s;
  text-decoration: none;
}
.mobNavBtn.cur { color: var(--gold); }
.mobNavBtn.play { color: var(--gold); font-size: 8px; letter-spacing: .14em; }
.mobNavIco { font-size: 17px; line-height: 1; }

/* ── Onboarding overlay ── */
.obVeil {
  position: fixed; inset: 0;
  z-index: 200;
  background: rgba(0,0,4,.96);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px max(24px, env(safe-area-inset-left));
  opacity: 0;
  pointer-events: none;
  transition: opacity .5s ease;
}
.obVeil.on { opacity: 1; pointer-events: auto; }

.obStep {
  display: none;
  flex-direction: column;
  align-items: center;
  text-align: center;
  width: 100%;
  max-width: 400px;
}
.obStep.vis { display: flex; animation: hubIn .45s ease both; }

.obKicker {
  font-family: "Courier New", monospace;
  font-size: 12px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--text2);
  margin-bottom: 22px;
}
.obHeadline {
  font-size: clamp(28px, 5vw, 46px);
  font-weight: 700;
  letter-spacing: .06em;
  color: var(--text);
  margin-bottom: 14px;
  line-height: 1.1;
}
.obBody {
  font-size: clamp(14px, 1.5vw, 17px);
  color: var(--text2);
  line-height: 1.65;
  letter-spacing: .03em;
  margin-bottom: 36px;
  max-width: 28ch;
}
.obQ {
  font-family: "Courier New", monospace;
  font-size: 10px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--gold2);
  margin-bottom: 22px;
}
.obChoices {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
}
.obChoice {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 15px 20px;
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 12px;
  color: var(--text2);
  font-family: ui-serif, Georgia, serif;
  font-size: clamp(14px, 1.4vw, 16px);
  cursor: pointer;
  text-align: left;
  transition: background .16s, border-color .16s, color .16s;
}
.obChoice:hover {
  background: rgba(230,192,123,.05);
  border-color: rgba(230,192,123,.20);
  color: var(--text);
}
.obChoice.sel {
  background: rgba(230,192,123,.09);
  border-color: rgba(230,192,123,.38);
  color: var(--gold);
}
.obRadio {
  width: 8px; height: 8px;
  border-radius: 50%;
  border: 1.5px solid currentColor;
  flex-shrink: 0;
  transition: background .16s;
}
.obChoice.sel .obRadio { background: currentColor; }
.obCta {
  margin-top: 26px;
  padding: 13px 32px;

  border-radius: 10px;

  font-size: 10px;
  letter-spacing: .24em;
  text-transform: uppercase;

.obCta.rdy { opacity: 1; pointer-events: auto; }

/* ── Responsive ── */
@media (max-width: 700px) {
  .navCenter { display: none; }
  .mobNav { display: block; }
  .hubMain { gap: 13px; }
  .moonWrap { right: 12px; top: calc(var(--nav-h) + 10px); width: min(58px, 13vw); }
}

  .ctxCard, .ritualBox { border-radius: 14px; padding: 20px 18px 18px; }

<div class="moonWrap" aria-hidden="true">

</div>

<!-- Loading veil -->
<div class="loadVeil" id="loadVeil" aria-hidden="true">
  <div class="ldDots">
    <div class="ldDot"></div>
    <div class="ldDot"></div>
    <div class="ldDot"></div>
  </div>

<nav class="hubNav" aria-label="Navegação">

  <nav class="navCenter">
    <a class="navLink current" href="./hub.html">Hub</a>
    <button class="navLink" id="navSocial">Social</button>
    <button class="navLink" id="navMundo">Mundo</button>
    <a class="navLink" href="./entrada.html">Jogar</a>
  </nav>
  <div class="navRight">
    <button class="navIco" id="btnNotif" title="Notificações">

</nav>

  </div>

  <div class="ctxCard" id="ctxCard">
    <div class="cardTag">CARREGANDO</div>
    <div class="cardTitle">—</div>
  </div>

  <div class="ritualBox" id="ritualBox">

</main>

<!-- Onboarding -->

    <span class="obKicker">Seu lugar foi reservado</span>
    <h2 class="obHeadline">BEM&#8209;VINDO.</h2>
    <p class="obBody">O SextoLugar<br>já esperava por você.</p>

    <p class="obQ">COMO VOCÊ QUER COMEÇAR?</p>

    </div>
    <button class="obCta" id="ob1btn">CONTINUAR</button>
  </div>

  <!-- Step 2: social -->
  <div class="obStep" id="obStep2">
    <p class="obQ">COM QUEM VOCÊ PRETENDE JOGAR?</p>
    <div class="obChoices" id="ob2choices">
      <button class="obChoice" data-v="amigos"><span class="obRadio"></span>Amigos</button>
      <button class="obChoice" data-v="novos"><span class="obRadio"></span>Pessoas novas</button>
      <button class="obChoice" data-v="indefinido"><span class="obRadio"></span>Ainda não sei</button>
    </div>
    <button class="obCta" id="ob2btn">ENTRAR</button>
  </div>

</div>

<!-- Stars canvas -->
<script>
(function(){
try{
var canvas=document.getElementById("stars");
if(!canvas||!canvas.getContext) return;
var ctx=canvas.getContext("2d",{alpha:true});
if(!ctx) return;
var device=window.__PRELUDIO_DEVICE__||{kind:"desktop",finalTier:"max",prefersReduced:false,forceStaticUniverse:false};
if(device.prefersReduced) return;
var tier=device.finalTier||device.initialTier||"balanced";
var kind=device.kind||"desktop";
var staticUniverse=!!device.forceStaticUniverse;
var PERF_BY_TIER={max:{dprCap:kind==="tablet"?1.9:2,farMul:1,midMul:1,nearMul:1,dustMul:1,rockMul:1,parLerp:0.045,tickSkip:0,meteorChanceMul:1,starCross:true,flybyChance:1},balanced:{dprCap:kind==="tablet"?1.7:1.45,farMul:0.82,midMul:0.80,nearMul:0.84,dustMul:0.72,rockMul:0.74,parLerp:0.032,tickSkip:1,meteorChanceMul:0.82,starCross:false,flybyChance:0.75},lite:{dprCap:1.15,farMul:0.58,midMul:0.56,nearMul:0.60,dustMul:0.42,rockMul:0.46,parLerp:0.022,tickSkip:2,meteorChanceMul:0.62,starCross:false,flybyChance:0.45}};
var PERF=PERF_BY_TIER[tier]||PERF_BY_TIER.balanced;
if(staticUniverse){PERF.dprCap=1;PERF.parLerp=0;PERF.tickSkip=999999;}
var w=0,h=0,dpr=1,raf=0,t=0,frame=0;
var par={x:0,y:0,tx:0,ty:0};
var starsFar=[],starsMid=[],starsNear=[],dust=[],rocks=[],meteors=[],flybys=[];
var nextMeteorAt=0,nextFlybyAt=0,moonMask=null;
function rand(min,max){return min+Math.random()*(max-min);}
function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
function lerp(a,b,t){return a+(b-a)*t;}
var lastW=0,lastH=0;
function shouldResize(nw,nh){if(!lastW||!lastH) return true;var dw=Math.abs(nw-lastW);var dh=Math.abs(nh-lastH);if(dw>2) return true;if(dh<140) return false;return true;}
function updateMoonMask(){var moonEl=document.querySelector(".moonWrap");if(!moonEl) return;var rect=moonEl.getBoundingClientRect();moonMask={x:rect.left+rect.width*0.5,y:rect.top+rect.height*0.5,r:Math.min(rect.width,rect.height)*0.42};}
function resize(force){dpr=Math.max(1,Math.min(PERF.dprCap,(window.devicePixelRatio||1)));var nw=Math.floor(document.documentElement.clientWidth||window.innerWidth);var nh=Math.floor(window.innerHeight);if(!force&&!shouldResize(nw,nh)) return;lastW=nw;lastH=nh;w=nw;h=nh;canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);canvas.style.width=w+"px";canvas.style.height=h+"px";ctx.setTransform(dpr,0,0,dpr,0,0);buildScene();updateMoonMask();}
function makeStars(count,rMin,rMax,vMin,vMax,aMin,aMax,tempBias){var arr=[];var heroChance=tier==="max"?0.06:(tier==="balanced"?0.04:0.025);for(var i=0;i<count;i++){var temp=rand(-1,1)*tempBias;var twBase=rand(0.002,0.010);var twAmp=rand(0.02,0.20);var hero=(Math.random()<heroChance);arr.push({x:Math.random()*w,y:Math.random()*h,r:rand(rMin,rMax)*(hero?rand(1.10,1.60):1),v:rand(vMin,vMax),a:rand(aMin,aMax)*(hero?1.08:1),tw:twBase,twa:twAmp,ph:Math.random()*Math.PI*2,hero:hero,temp:temp});}return arr;}
function buildRockShape(size){var spikes=Math.floor(rand(9,14));var pts=[];for(var k=0;k<spikes;k++){var a=(Math.PI*2)*(k/spikes);var rr=size*rand(0.86,1.14);pts.push({x:Math.cos(a)*rr,y:Math.sin(a)*rr});}return pts;}
function pickRockMode(){var roll=Math.random();if(roll<0.3333) return "moon";if(roll<0.6666) return "normal";return "deep";}
function respawnRock(r,initial){var M=180;var side=Math.floor(rand(0,4));var x,y,ang;if(side===0){x=rand(-M,w+M);y=-M;ang=rand(Math.PI*0.18,Math.PI*0.82);}else if(side===1){x=w+M;y=rand(-M,h+M);ang=rand(Math.PI*0.70,Math.PI*1.30);}else if(side===2){x=rand(-M,w+M);y=h+M;ang=rand(Math.PI*1.18,Math.PI*1.82);}else{x=-M;y=rand(-M,h+M);ang=rand(-Math.PI*0.30,Math.PI*0.30);}var baseZ=initial?rand(0.65,1.08):rand(0.88,1.18);var base=rand(0.12,0.30)*(0.55+baseZ);r.x=x;r.y=y;r.vx=Math.cos(ang)*base;r.vy=Math.sin(ang)*base;r.rot=rand(0,Math.PI*2);r.rv=rand(-0.006,0.006);r.ph=rand(0,Math.PI*2);r.wob=rand(0.0006,0.0018);r.baseR=rand(4.0,12.0);r.pts=buildRockShape(r.baseR);r.z=baseZ;r.vz=rand(0.0010,0.0026)*(tier==="lite"?0.8:1);r.fadeBias=rand(0.78,1.00);r.mode=pickRockMode();r.attractMoon=(r.mode==="moon");r.moonPull=rand(0.0012,0.0038);r.deepDriftX=rand(-0.22,0.22);r.deepDriftY=rand(-0.22,0.22);}
function buildScene(){var area=w*h;var farCount=clamp(Math.floor(area/14500*PERF.farMul),46,260);var midCount=clamp(Math.floor(area/17500*PERF.midMul),32,190);var nearCount=clamp(Math.floor(area/23500*PERF.nearMul),20,130);starsFar=makeStars(farCount,0.28,0.95,0.016,0.045,0.12,0.34,0.08);starsMid=makeStars(midCount,0.38,1.20,0.040,0.085,0.14,0.46,0.10);starsNear=makeStars(nearCount,0.52,1.65,0.060,0.120,0.18,0.60,0.12);dust=[];var dustCount=clamp(Math.floor(area/90000*PERF.dustMul),4,28);for(var i=0;i<dustCount;i++){dust.push({x:rand(-w*0.2,w*1.2),y:rand(-h*0.2,h*1.2),r:rand(0.7,1.8),a:rand(0.01,0.045),vx:rand(0.03,0.10),vy:rand(0.008,0.038)});}rocks=[];var rockCount=clamp(Math.floor(area/90000*PERF.rockMul),4,34);for(var j=0;j<rockCount;j++){var rock={};respawnRock(rock,true);rocks.push(rock);}meteors=[];flybys=[];nextMeteorAt=Math.floor(rand(140,340)/PERF.meteorChanceMul);nextFlybyAt=t+Math.floor(rand(260,620)/PERF.flybyChance);if(staticUniverse){renderFrame(true);}}
function onPointerMove(clientX,clientY){if(staticUniverse) return;var nx=(clientX/w)*2-1;var ny=(clientY/h)*2-1;par.tx=clamp(nx,-1,1);par.ty=clamp(ny,-1,1);}
window.addEventListener("mousemove",function(e){onPointerMove(e.clientX,e.clientY);},{passive:true});
window.addEventListener("touchmove",function(e){if(!e.touches||!e.touches[0]) return;onPointerMove(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
function starColor(temp,alpha){var b=clamp(-temp,0,1);var g=clamp(temp,0,1);var R=255-Math.floor(b*18)+Math.floor(g*14);var G=255-Math.floor(b*8)+Math.floor(g*10);var B=255+Math.floor(b*18)-Math.floor(g*18);return "rgba("+R+","+G+","+B+","+alpha.toFixed(3)+")";}
function drawStar(x,y,r,alpha,temp,phase,animate){var flick=0.86+0.14*Math.sin(phase*1.75+x*0.012);var flick2=0.92+0.08*Math.cos(phase*2.25+y*0.010);var aNow=clamp(alpha*flick*flick2,0,1);if(animate){var jit=0.08+r*0.04;x+=Math.sin(phase*3.10+x*0.006)*jit;y+=Math.cos(phase*2.85+y*0.006)*jit;}var glow=r*3.0;var core=Math.max(0.55,r*0.62);var wob=0.45+r*0.12;var ox=Math.sin(phase*1.10)*wob;var oy=Math.cos(phase*1.04)*wob;ctx.save();ctx.globalCompositeOperation="screen";var g=ctx.createRadialGradient(x,y,0,x,y,glow);g.addColorStop(0,starColor(temp,clamp(aNow*0.95,0,1)));g.addColorStop(0.22,starColor(temp,clamp(aNow*0.30,0,1)));g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,glow,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation="lighter";ctx.fillStyle=starColor(temp,clamp(aNow*1.05,0,1));ctx.beginPath();ctx.arc(x,y,core,0,Math.PI*2);ctx.fill();var strength=r*aNow;if(strength>0.46&&PERF.starCross){var L=clamp(4.5+r*4.8,7,14);var aSp=clamp((strength-0.36)*1.05,0,0.55);ctx.globalCompositeOperation="screen";ctx.globalAlpha=aSp;ctx.lineWidth=0.9;function ray(angle,len,peak){var dx=Math.cos(angle)*len;var dy=Math.sin(angle)*len;var lg=ctx.createLinearGradient(x-dx,y-dy,x+dx,y+dy);lg.addColorStop(0.00,"rgba(255,255,255,0)");lg.addColorStop(0.46,"rgba(255,255,255,0)");lg.addColorStop(0.50,"rgba(255,255,255,"+peak+")");lg.addColorStop(0.54,"rgba(255,255,255,0)");lg.addColorStop(1.00,"rgba(255,255,255,0)");ctx.strokeStyle=lg;ctx.beginPath();ctx.moveTo(x-dx,y-dy);ctx.lineTo(x+dx,y+dy);ctx.stroke();}ray(0,L,"0.95");ray(Math.PI/2,L,"0.90");}ctx.restore();}
function drawStars(arr,px,py,parScale,animate){for(var i=0;i<arr.length;i++){var s=arr[i];if(animate){s.y+=s.v;if(s.y>h+12){s.y=-12;s.x=Math.random()*w;}s.ph+=s.tw;}var tw=(Math.sin(s.ph)*0.5+0.5);var a=s.a+(tw-0.5)*s.twa;var x=s.x+(px*parScale);var y=s.y+(py*parScale);if(x<-30) x+=(w+60);if(x>w+30) x-=(w+60);drawStar(x,y,s.r,clamp(a,0,1),s.temp,s.ph,animate);}}
function drawDust(px,py,animate){for(var i=0;i<dust.length;i++){var d=dust[i];if(animate){d.x+=d.vx;d.y+=d.vy;if(d.x>w+80){d.x=-80;d.y=rand(-h*0.2,h*1.2);}if(d.y>h+80){d.y=-80;d.x=rand(-w*0.2,w*1.2);}}var x=d.x+(px*10);var y=d.y+(py*10);ctx.fillStyle="rgba(255,255,255,"+d.a.toFixed(3)+")";ctx.beginPath();ctx.arc(x,y,d.r,0,Math.PI*2);ctx.fill();}}
function drawRocks(px,py,animate){var moonX=moonMask?moonMask.x:w*0.5;var moonY=moonMask?moonMask.y:h*0.18;var moonR=moonMask?moonMask.r:40;for(var i=0;i<rocks.length;i++){var r=rocks[i];if(animate){r.ph+=r.wob;r.x+=r.vx+(Math.cos(r.ph)*0.03);r.y+=r.vy+(Math.sin(r.ph)*0.03);r.rot+=r.rv;if(r.mode==="moon"){var dxm=moonX-r.x;var dym=moonY-r.y;r.x+=dxm*r.moonPull;r.y+=dym*r.moonPull;r.z-=r.vz*0.40;}else if(r.mode==="deep"){r.x+=r.deepDriftX;r.y+=r.deepDriftY;r.z-=r.vz;}else{r.z-=r.vz*0.18;}if(r.x<-260||r.x>w+260||r.y<-260||r.y>h+260||r.z<=0.06){respawnRock(r,false);}}var depthScale=clamp(r.z,0.03,1.25);var worldScale=Math.pow(depthScale,1.22);var rr=r.baseR*worldScale;var P=6.0*depthScale;var x=r.x+(px*P*0.10);var y=r.y+(py*P*0.10);if(rr<0.8) continue;var dxMoon=x-moonX;var dyMoon=y-moonY;var distMoon=Math.sqrt(dxMoon*dxMoon+dyMoon*dyMoon);if(distMoon<moonR*1.10){var backFactor=clamp((moonR*1.10-distMoon)/(moonR*1.10),0,1);var shrink=lerp(1,0.30,backFactor);rr*=shrink;worldScale*=shrink;}if(rr<0.45) continue;var alpha=clamp(depthScale*r.fadeBias,0.08,1);ctx.save();ctx.globalCompositeOperation="source-over";ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.rotate(r.rot);ctx.beginPath();var pts=r.pts;ctx.moveTo(pts[0].x*worldScale,pts[0].y*worldScale);for(var k=1;k<pts.length;k++) ctx.lineTo(pts[k].x*worldScale,pts[k].y*worldScale);ctx.closePath();ctx.fillStyle="rgb(20,20,26)";ctx.fill();var g=ctx.createRadialGradient(-rr*0.35,-rr*0.35,rr*0.15,0,0,rr*1.25);g.addColorStop(0,"rgba(255,255,255,0.10)");g.addColorStop(0.45,"rgba(255,255,255,0.04)");g.addColorStop(1,"rgba(0,0,0,0.65)");ctx.fillStyle=g;ctx.fill();ctx.lineWidth=Math.max(0.6,0.9*worldScale);ctx.strokeStyle="rgba(0,0,0,0.75)";ctx.stroke();ctx.restore();}}
function spawnMeteor(){var edge=Math.floor(rand(0,4));var x,y,angle,speed=rand(8.5,14.5);if(edge===0){x=rand(-w*0.2,w*1.2);y=-60;angle=rand(0.35,1.20);}else if(edge===1){x=w+60;y=rand(-h*0.2,h*0.8);angle=rand(2.20,3.70);}else if(edge===2){x=rand(-w*0.2,w*1.2);y=h+60;angle=rand(3.80,5.50);}else{x=-60;y=rand(-h*0.2,h*0.8);angle=rand(-0.50,1.10);}meteors.push({x:x,y:y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:0,maxLife:rand(28,46),len:rand(90,170),a:rand(0.30,0.70),w:rand(1.0,2.2)});}
function drawMeteors(animate){for(var j=meteors.length-1;j>=0;j--){var m=meteors[j];if(animate){m.x+=m.vx;m.y+=m.vy;m.life++;}var k=Math.min(1,m.life/7);var a=m.a*k*(1-(m.life/m.maxLife));var norm=Math.sqrt(m.vx*m.vx+m.vy*m.vy)||1;var tx=m.x-(m.vx/norm)*m.len;var ty=m.y-(m.vy/norm)*m.len;var grad=ctx.createLinearGradient(m.x,m.y,tx,ty);grad.addColorStop(0,"rgba(255,255,255,"+(a*1.6).toFixed(3)+")");grad.addColorStop(1,"rgba(255,255,255,0)");ctx.strokeStyle=grad;ctx.lineWidth=m.w*1.9;ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(tx,ty);ctx.stroke();if(animate&&(m.life>m.maxLife||m.x<-m.len-120||m.x>w+m.len+120||m.y<-m.len-120||m.y>h+m.len+120)){meteors.splice(j,1);}}}
function spawnFlyby(){var startFromLeft=Math.random()<0.5;var y=rand(h*0.12,h*0.82);var x=startFromLeft?-120:w+120;var dir=startFromLeft?1:-1;var vx=rand(10.5,16.5)*dir;var vy=rand(-0.8,0.8);flybys.push({x:x,y:y,vx:vx,vy:vy,life:0,maxLife:rand(24,34),size:rand(18,34),rot:rand(0,Math.PI*2),rv:rand(-0.08,0.08),a:rand(0.18,0.34),shrinkTo:rand(0.88,0.94),len:rand(70,140)});}
function drawFlybys(px,py,animate){for(var i=flybys.length-1;i>=0;i--){var f=flybys[i];if(animate){f.life++;f.x+=f.vx;f.y+=f.vy;f.rot+=f.rv;}var progress=clamp(f.life/f.maxLife,0,1);var scale=lerp(1,f.shrinkTo,progress);var alpha=f.a*(1-progress);var headX=f.x+px*0.16;var headY=f.y+py*0.16;var tailX=headX-f.vx*(f.len/Math.max(1,Math.abs(f.vx)));var tailY=headY-f.vy*(f.len/Math.max(1,Math.abs(f.vx)));ctx.save();ctx.globalCompositeOperation="screen";ctx.globalAlpha=alpha;var grad=ctx.createLinearGradient(headX,headY,tailX,tailY);grad.addColorStop(0,"rgba(220,220,255,0.75)");grad.addColorStop(1,"rgba(255,255,255,0)");ctx.strokeStyle=grad;ctx.lineWidth=Math.max(1,f.size*0.18*scale);ctx.beginPath();ctx.moveTo(headX,headY);ctx.lineTo(tailX,tailY);ctx.stroke();ctx.restore();if(animate&&(f.life>=f.maxLife||headX<-220||headX>w+220)){flybys.splice(i,1);}}}
function renderFrame(forceStatic){var animateUniverse=!staticUniverse&&!forceStatic;if(!staticUniverse){par.x+=(par.tx-par.x)*PERF.parLerp;par.y+=(par.ty-par.y)*PERF.parLerp;}else{par.x=0;par.y=0;}var px=par.x*18;var py=par.y*12;ctx.clearRect(0,0,w,h);ctx.fillStyle="#000";ctx.fillRect(0,0,w,h);drawStars(starsFar,px,py,0.12,animateUniverse);drawStars(starsMid,px,py,0.28,animateUniverse);drawStars(starsNear,px,py,0.52,animateUniverse);drawDust(px,py,animateUniverse);drawRocks(px,py,animateUniverse);if(animateUniverse){if(t>nextMeteorAt){spawnMeteor();nextMeteorAt=t+Math.floor(rand(100,260)/PERF.meteorChanceMul);}if(t>nextFlybyAt){spawnFlyby();nextFlybyAt=t+Math.floor(rand(320,760)/PERF.flybyChance);}}drawMeteors(animateUniverse);drawFlybys(px,py,animateUniverse);}
function tick(){t++;frame++;if(staticUniverse){if(frame===1){renderFrame(true);}raf=window.requestAnimationFrame(tick);return;}if(PERF.tickSkip===0||frame%(PERF.tickSkip+1)===0){renderFrame(false);}raf=window.requestAnimationFrame(tick);}

var resizeTimer=0;
window.addEventListener("resize",function(){clearTimeout(resizeTimer);resizeTimer=setTimeout(function(){updateMoonMask();start(false);},180);},{passive:true});
window.addEventListener("orientationchange",function(){updateMoonMask();start(true);},{passive:true});
document.addEventListener("visibilitychange",function(){if(!document.hidden){updateMoonMask();start(true);}});
window.addEventListener("load",function(){updateMoonMask();start(true);});
start(true);
}catch(e){}
})();

<!-- Hub logic -->
<script>
(function(){

function esc(s){if(!s) return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// Saudação por hora
function saudacao(){var h=new Date().getHours();if(h<12) return 'BOM DIA';if(h<18) return 'BOA TARDE';return 'BOA NOITE';}

// Formata tempo relativo
function tempoRelativo(ms){if(!ms) return '';var diff=Date.now()-ms;var m=Math.floor(diff/60000);if(m<2) return 'agora mesmo';if(m<60) return 'há '+m+' min';var h=Math.floor(m/60);if(h<24) return 'há '+h+'h';return 'ontem';}

// Esconde loading veil
window.hubHideVeil=function(){
  var v=document.getElementById('loadVeil');
  if(!v) return;
  v.classList.add('out');
  setTimeout(function(){v.remove();},620);
};

// Seta greeting
window.hubSetGreeting=function(displayName){
  var s=document.getElementById('hubSaudacao');
  var n=document.getElementById('hubNome');
  if(s) s.textContent=saudacao();
  if(n){
    var nome=(displayName||'').trim();
    n.textContent=nome?nome.split(' ')[0].toUpperCase():'—';
  }
};

// Context resolver: renderiza card principal
function renderCtxCard(data){
  var card=document.getElementById('ctxCard');
  if(!card) return;
  var html='';

  // 1. Fragmento pendente
  if(data.fragment){
    html='<div class="cardTag">MISSÃO PENDENTE</div>'
        +'<div class="cardTitle">'+esc(data.fragment.card||'Carta especial')+'</div>'
        +'<div class="cardMeta">Você ainda não completou esta missão.</div>'
        +'<button class="cardBtn" onclick="location.href=\'./entrada.html\'">CONTINUAR MISSÃO</button>';
    card.innerHTML=html; return;
  }

  // 2. Amigo online
  var online=(data.friends||[]).find(function(f){return f.online;});
  if(online){
    var nome=esc(online.displayName||'Alguém');
    var atividade=esc(tempoRelativo(online.lastSeenMs));
    html='<div class="cardTag">CONEXÃO ATIVA</div>'
        +'<div class="cardTitle">'+nome.toUpperCase()+' ESTÁ ONLINE</div>'
        +'<div class="cardMeta">Disponível'+( atividade?' · '+atividade:'')+'</div>'
        +'<button class="cardBtn" onclick="location.href=\'./entrada.html\'">CONVIDAR PARA JOGAR</button>'
        +'<button class="cardBtn sec" onclick="location.href=\'./entrada.html\'">CRIAR UMA SALA</button>';
    card.innerHTML=html; return;
  }

  // 3. Última sessão recente (< 48h)
  if(data.lastSession&&data.lastSession.roomName){
    var ls=data.lastSession;
    var ageMs=ls.sessionAt?(Date.now()-ls.sessionAt):null;
    var ageStr=ageMs!==null?tempoRelativo(ls.sessionAt):'';
    var meta=[ageStr,ls.playerCount?(ls.playerCount+' jogadores'):''].filter(Boolean).join(' · ');
    html='<div class="cardTag">CONTINUAR</div>'
        +'<div class="cardTitle">'+esc(ls.roomName)+'</div>'
        +'<div class="cardMeta">'+esc(meta)+'</div>'
        +'<button class="cardBtn" onclick="location.href=\'./entrada.html\'">ENTRAR</button>'
        +'<button class="cardBtn sec" onclick="location.href=\'./entrada.html\'">NOVA SALA</button>';
    card.innerHTML=html; return;
  }

  // 4. Grupo recorrente
  if(data.myGroups&&data.myGroups.length>0){
    var g=data.myGroups[0];
    html='<div class="cardTag">SEU GRUPO</div>'
        +'<div class="cardTitle">'+esc(g.roomName||'Grupo recorrente')+'</div>'
        +'<div class="cardMeta">Sessão recorrente ativa</div>'
        +'<button class="cardBtn" onclick="location.href=\'./entrada.html\'">VER GRUPO</button>';
    card.innerHTML=html; return;
  }

  // 5. Default
  html='<div class="cardTag">PRONTO PARA JOGAR</div>'
      +'<div class="cardTitle">O MUNDO ESPERA POR VOCÊ</div>'
      +'<div class="cardMeta">Crie uma sala ou entre em uma existente.</div>'
      +'<button class="cardBtn" onclick="location.href=\'./entrada.html\'">JOGAR</button>';
  card.innerHTML=html;
}

// Ritual do dia
function renderRitual(daily){
  var q=document.getElementById('ritualQ');
  var btn=document.getElementById('ritualCta');
  if(daily&&daily.question){
    if(q) q.textContent='“'+daily.question+'”';
  }
  if(btn) btn.addEventListener('click',function(){location.href='./entrada.html';});
}

// Temporada
function renderSeason(season){
  var chip=document.getElementById('seasonChip');
  if(!chip) return;
  if(season){
    var partes=['TEMPORADA'+(season.number?' '+season.number:''),season.name||season.theme||'',season.daysLeft!=null?season.daysLeft+' DIAS':''].filter(Boolean);
    chip.textContent=partes.join(' · ');
  }
}

// Mundo status
function renderMundo(world){
  var el=document.getElementById('hubMundoText');
  if(!el||!world) return;
  var p=world.communityProgress||0;
  if(p>75) el.textContent='O mundo está em chamas.';
  else if(p>50) el.textContent='O mundo está desperto.';
  else if(p>25) el.textContent='O mundo está acordado.';
  else el.textContent='O mundo começa a acordar.';
}

// Badge de notificações
function renderBadge(unread){
  var badge=document.getElementById('notifBadge');
  if(!badge) return;
  if(unread>0){
    badge.textContent=unread>9?'9+':String(unread);
    badge.style.display='flex';
  }
}

// API pública chamada pelo Firebase module
window.hubRender=function(data){
  renderCtxCard(data);
  renderRitual(data.daily);
  renderSeason(data.season);
  renderMundo(data.world);
  renderBadge(data.unread||0);
};

// ── Onboarding ──
var obData={};
var obCurrent=0;

function obShowStep(n){
  document.querySelectorAll('.obStep').forEach(function(s){s.classList.remove('vis');});
  var step=document.getElementById('obStep'+n);
  if(step) step.classList.add('vis');
  obCurrent=n;
}

function setupObChoices(stepId,btnId){
  document.querySelectorAll('#'+stepId+' .obChoice').forEach(function(btn){
    btn.addEventListener('click',function(){
      document.querySelectorAll('#'+stepId+' .obChoice').forEach(function(b){b.classList.remove('sel');});
      btn.classList.add('sel');
      var next=document.getElementById(btnId);
      if(next) next.classList.add('rdy');
    });
  });
}

var ob0btn=document.getElementById('ob0btn');
if(ob0btn) ob0btn.addEventListener('click',function(){obShowStep(1);});

setupObChoices('obStep1','ob1btn');
var ob1btn=document.getElementById('ob1btn');
if(ob1btn) ob1btn.addEventListener('click',function(){
  var sel=document.querySelector('#obStep1 .obChoice.sel');
  if(!sel) return;
  obData.vibe=sel.dataset.v;
  obShowStep(2);
});

setupObChoices('obStep2','ob2btn');
var ob2btn=document.getElementById('ob2btn');
if(ob2btn) ob2btn.addEventListener('click',function(){
  var sel=document.querySelector('#obStep2 .obChoice.sel');
  if(!sel) return;
  obData.social=sel.dataset.v;
  try{localStorage.setItem('osl_onboarding_done','1');}catch(_){}
  try{localStorage.setItem('osl_player_vibe',obData.vibe||'');}catch(_){}
  try{localStorage.setItem('osl_player_social',obData.social||'');}catch(_){}
  var veil=document.getElementById('obVeil');
  if(veil){veil.classList.remove('on');setTimeout(function(){veil.style.display='none';},520);}
});

window.hubShowOnboarding=function(){
  var veil=document.getElementById('obVeil');
  if(!veil) return;
  veil.style.display='';
  setTimeout(function(){veil.classList.add('on');},10);
  obShowStep(0);
};

})();
</script>

<!-- Firebase module: auth check + hub API -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const API = "https://osl-video-server-production.up.railway.app";

const cfg = {
  apiKey: "AIzaSyC8sSvA7_1HPYRFGFgdgzstkP_yQHadY-c",
  authDomain: "osextolugar-game.firebaseapp.com",
  projectId: "osextolugar-game",
  storageBucket: "osextolugar-game.firebasestorage.app",
  messagingSenderId: "947922328721",
  appId: "1:947922328721:web:989522c99e16ab449f3330"
};

const app  = initializeApp(cfg);
const auth = getAuth(app);

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "./página.html";
    return;
  }

  // Greeting imediata (não espera API)
  window.hubSetGreeting && window.hubSetGreeting(user.displayName || user.email || "");

  // Fetch hub context
  let data = {};
  try {
    const token = await user.getIdToken();
    const res   = await fetch(API + "/hub", {
      headers: { "Authorization": "Bearer " + token }
    });
    if (res.ok) data = await res.json().catch(() => ({}));
  } catch (_) {}

  // Renderiza hub
  window.hubRender && window.hubRender(data);

  // Esconde loading
  window.hubHideVeil && window.hubHideVeil();

  // Onboarding: apenas para novos jogadores
  const done = (() => { try { return localStorage.getItem('osl_onboarding_done'); } catch(_){return null;} })();
  if (!done) {
    setTimeout(() => { window.hubShowOnboarding && window.hubShowOnboarding(); }, 700);
  }

  // Atualiza presença no backend (fire-and-forget)
  user.getIdToken().then(token =>
    fetch(API + "/hub/touch", { method: "POST", headers: { "Authorization": "Bearer " + token } })
  ).catch(() => {});
});
</script>
