<script src="./i18n/init.js?v=20260818" defer></script>
<link rel="preconnect" href="https://www.googleapis.com">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://firestore.googleapis.com">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title data-i18n="sucesso:title">Pagamento aprovado | SEXTOLUGAR</title>

  <style>
    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#0b0b0f;
      color:#fff;
      font-family:"Segoe UI",sans-serif;
      padding:24px;
    }

    .box{
      width:min(680px, 100%);
      background:#12121a;
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px;
      padding:32px 24px;
      text-align:center;
      box-shadow:0 0 40px rgba(0,0,0,.45);
    }

    h1{
      margin:0 0 12px;
      font-size:30px;
    }

    p{
      color:rgba(255,255,255,.75);
      line-height:1.6;
      margin:0;
    }

    .status{
      margin-top:18px;
      font-size:15px;
      color:rgba(255,255,255,.88);
      min-height:22px;
      line-height:1.5;
    }

    .code{
      margin-top:18px;
      padding:14px;
      border-radius:12px;
      background:#1b1b24;
      border:1px solid rgba(255,255,255,.08);
      font-size:14px;
      color:#e6c07b;
      word-break:break-word;
      text-align:left;
      line-height:1.7;
      display:none;
    }

    .actions{
      margin-top:18px;
      display:none;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
    }

    button{
      padding:14px 18px;
      border:none;
      border-radius:10px;
      background:linear-gradient(135deg,#e6c07b,#c99c4a);
      color:#000;
      font-weight:700;
      cursor:pointer;
      font-size:16px;
      min-width:220px;
    }

    .secondary{
      background:#1b1b24;
      color:#fff;
      border:1px solid rgba(255,255,255,.08);
    }

    .small{
      margin-top:14px;
      font-size:12px;
      color:rgba(255,255,255,.48);
      line-height:1.5;
    }

    .nextInfo{
      margin-top:18px;
      font-size:14px;
      color:rgba(255,255,255,.74);
      line-height:1.6;
      display:none;
    }

    .miniActions{
      margin-top:12px;
      display:none;
      gap:10px;
      flex-wrap:wrap;
      justify-content:center;
    }

    .miniBtn{
      min-width:auto;
      padding:10px 14px;
      font-size:14px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1 data-i18n="sucesso:heading">Pagamento aprovado</h1>
    <p id="subtitleEl" data-i18n="sucesso:subtitle.initial">Estamos validando seu pagamento...</p>

    <div class="status" id="status" data-i18n="sucesso:status.initial">Validando pagamento...</div>
    <div class="code" id="licenseBox"></div>

    <div class="miniActions" id="miniActions">
      <button class="miniBtn secondary" id="copyCodeBtn" type="button" data-i18n="sucesso:buttons.copyCode">Copiar código</button>
    </div>

    <div class="nextInfo" id="nextInfo"></div>

    <div class="actions" id="actions">
      <button id="primaryBtn" type="button" data-i18n="sucesso:buttons.primary">Entrar na sala</button>
      <button id="createAccountBtn" class="secondary" type="button" data-i18n="sucesso:buttons.createAccount">Criar conta</button>
      <button id="loginBtn" class="secondary" type="button" data-i18n="sucesso:buttons.login">Já tenho conta</button>
      <button id="panelBtn" class="secondary" type="button" data-i18n="sucesso:buttons.panel">Ir para o painel</button>
    </div>

    <div class="small" id="smallNote" data-i18n="sucesso:smallNote.default">
      Sua compra foi registrada e ficará salva para uso na sessão.
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const _fbApp  = initializeApp({
      apiKey: "AIzaSyC8sSvA7_1HPYRFGFgdgzstkP_yQHadY-c",
      authDomain: "osextolugar-game.firebaseapp.com",
      projectId: "osextolugar-game",
      storageBucket: "osextolugar-game.firebasestorage.app",
      messagingSenderId: "1042107749185",
      appId: "1:1042107749185:web:c4a53d6f61f2fe82b0c891"
    }, "sucesso-app");
    const _auth = getAuth(_fbApp);

    // Retorna o usuário logado (ou null) resolvendo a Promise
    function getLoggedUser() {
      return new Promise(function(resolve) {
        const unsub = onAuthStateChanged(_auth, function(u) { unsub(); resolve(u); });
      });
    }

    (async function () {
      const BACKEND_BASE_URL = "https://osl-video-server.onrender.com";
      const CREATE_ACCOUNT_URL = "./cadastro.html";
      const LOGIN_URL = "./login.html";
      const PANEL_URL = "./painel.html";
      const SALA_URL = "./entrada.html";

      const statusEl    = document.getElementById("status");
      const subtitleEl  = document.getElementById("subtitleEl");
      const licenseBox  = document.getElementById("licenseBox");
      const actionsEl   = document.getElementById("actions");
      const nextInfoEl  = document.getElementById("nextInfo");
      const miniActEl   = document.getElementById("miniActions");
      const smallNote   = document.getElementById("smallNote");

      const primaryBtn      = document.getElementById("primaryBtn");
      const createAccountBtn= document.getElementById("createAccountBtn");
      const loginBtn        = document.getElementById("loginBtn");
      const panelBtn        = document.getElementById("panelBtn");
      const copyCodeBtn     = document.getElementById("copyCodeBtn");

      let currentLicenseCode = "";

      function setStatus(text, isError = false) {
        statusEl.textContent = text;
        statusEl.style.color = isError ? "rgba(255,120,120,.95)" : "rgba(255,255,255,.88)";
      }

      // ── Salva uma compra não-licença no localStorage ──────────────────────
      function saveCompra(ref, produto, titulo) {
        let compras = [];
        try { compras = JSON.parse(localStorage.getItem("osl_compras") || "[]"); } catch(e){}
        // evita duplicatas
        if (!compras.find(function(c){ return c.ref === ref; })) {
          compras.push({ ref: ref, produto: produto, titulo: titulo, ts: Date.now() });
          localStorage.setItem("osl_compras", JSON.stringify(compras));
        }
      }

      // ── Verifica o pagamento pelo ref ─────────────────────────────────────
      async function verificarCompra(ref) {
        const res = await fetch(`${BACKEND_BASE_URL}/verificar-compra/${encodeURIComponent(ref)}`);
        return res.json().catch(function(){ return {}; });
      }

      // ── Aguarda o webhook processar (até 20s) ─────────────────────────────
      async function aguardarAprovacao(ref) {
        for (let i = 0; i < 10; i++) {
          const data = await verificarCompra(ref);
          if (data.approved) return data;
          await new Promise(function(r){ setTimeout(r, 2000); });
        }
        return null;
      }

      async function resolvePaymentId(paymentIdFromUrl, ref) {
        if (paymentIdFromUrl) return paymentIdFromUrl;
        if (!ref) return "";
        setStatus("Recuperando identificação do pagamento...");
        const data = await verificarCompra(ref);
        return data.approved ? String(data.paymentId || "") : "";
      }

      // ── Fluxo para licença (produto principal) ────────────────────────────
      async function handleLicenca(paymentId, fallbackRef) {
        subtitleEl.textContent = "Estamos validando seu pagamento e preparando sua licença.";
        setStatus("Emitindo licença...");

        const licRes = await fetch(`${BACKEND_BASE_URL}/emitir-licenca`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ paymentId })
        });
        const licData = await licRes.json().catch(function(){ return {}; });

        if (!licRes.ok || !licData.licenseToken || !licData.licenseCode) {
          console.error("Falha em /emitir-licenca:", licData);
          setStatus("Não foi possível emitir sua licença.", true);
          return;
        }

        localStorage.setItem("osl_license_token", licData.licenseToken || "");
        localStorage.setItem("osl_license_code",  licData.licenseCode  || "");
        localStorage.setItem("osl_license_email",  licData.email        || "");
        localStorage.setItem("osl_payment_id",     paymentId            || "");
        localStorage.setItem("osl_payment_ref",    licData.ref          || fallbackRef || "");
        localStorage.setItem("osl_checkout_email", licData.email        || "");
        localStorage.setItem("osl_checkout_ref",   licData.ref          || fallbackRef || "");
        const existingRefCode = localStorage.getItem("osl_checkout_ref_code");
        if (existingRefCode) localStorage.setItem("osl_last_ref_code", existingRefCode);

        currentLicenseCode = licData.licenseCode || "";
        licenseBox.style.display = "block";
        licenseBox.innerHTML =
          "<strong>Licença emitida com sucesso</strong><br><br>" +
          "Código: " + (licData.licenseCode || "—") + "<br>" +
          "E-mail: " + (licData.email        || "—") + "<br>" +
          "Referência: " + (licData.ref || fallbackRef || "—") + "<br>" +
          "Payment ID: " + paymentId;

        smallNote.textContent = "Guarde seu código de licença. Ele também fica salvo no servidor e pode ser usado depois no painel.";
        nextInfoEl.textContent = "Sua licença foi emitida e salva. Agora faça login ou crie sua conta para vinculá-la no painel.";
        nextInfoEl.style.display = "block";
        miniActEl.style.display = "flex";

        primaryBtn.style.display = "none";
        actionsEl.style.display = "flex";
        setStatus("Tudo pronto. Sua licença foi emitida.");
      }

      // ── Salva compra no servidor (se logado) ─────────────────────────────
      async function registrarNaConta(ref, titulo) {
        try {
          const user = await getLoggedUser();
          if (!user) return false;
          const idToken = await user.getIdToken();
          const r = await fetch(BACKEND_BASE_URL + "/registrar-compra", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + idToken },
            body: JSON.stringify({ ref })
          });
          return r.ok;
        } catch(e) { return false; }
      }

      // ── Fluxo para pacotes / consumáveis / cosméticos ─────────────────────
      async function handleCompra(ref, produto, tipo, titulo) {
        saveCompra(ref, produto, titulo);
        localStorage.setItem("osl_checkout_ref", ref);

        subtitleEl.textContent = "Sua compra foi confirmada!";
        setStatus("✓ " + titulo);

        var msg = "";
        if (tipo === "pack") {
          msg = "Seu pacote de cartas foi desbloqueado e já está disponível na sala.";
        } else if (tipo === "consumable") {
          msg = "Sua compra foi registrada e será aplicada na sessão atual.";
        } else if (tipo === "cosmetic") {
          msg = "Seu item cosmético foi desbloqueado e já está disponível na sala.";
        } else {
          msg = "Sua compra foi registrada com sucesso.";
        }

        // Tenta salvar na conta
        const savedInAccount = await registrarNaConta(ref, titulo);

        if (savedInAccount) {
          msg += " Salvo na sua conta — disponível em qualquer dispositivo.";
          loginBtn.style.display = "none";
          createAccountBtn.style.display = "none";
          panelBtn.style.display = "";
          panelBtn.textContent = "Ver meu painel";
        } else {
          msg += " Faça login para salvar na sua conta e acessar de qualquer dispositivo.";
          panelBtn.style.display = "none";
        }

        nextInfoEl.textContent = msg;
        nextInfoEl.style.display = "block";
        smallNote.textContent = "Referência: " + ref;

        primaryBtn.textContent = "Entrar na sala";
        primaryBtn.style.display = "";
        actionsEl.style.display = "flex";
      }

      // ─────────────────────────────────────────────────────────────────────
      primaryBtn.addEventListener("click",       function(){ window.location.href = SALA_URL; });
      createAccountBtn.addEventListener("click", function(){ window.location.href = CREATE_ACCOUNT_URL; });
      loginBtn.addEventListener("click",         function(){ window.location.href = LOGIN_URL; });
      panelBtn.addEventListener("click",         function(){ window.location.href = PANEL_URL; });
      copyCodeBtn.addEventListener("click",      async function(){
        if (!currentLicenseCode) return;
        try {
          await navigator.clipboard.writeText(currentLicenseCode);
          setStatus("Código copiado.");
        } catch(e) {
          setStatus("Copie manualmente o código acima.", true);
        }
      });

      // ─────────────────────────────────────────────────────────────────────
      const params = new URLSearchParams(window.location.search);
      const paymentIdFromUrl     = String(params.get("payment_id")        || "").trim();
      const paymentStatus        = String(params.get("status")            || "").trim().toLowerCase();
      const collectionStatus     = String(params.get("collection_status") || "").trim().toLowerCase();
      const externalReferenceUrl = String(params.get("external_reference")|| "").trim();

      const storedRef  = String(localStorage.getItem("osl_checkout_ref") || "").trim();
      const fallbackRef = externalReferenceUrl || storedRef;

      if (paymentStatus && paymentStatus !== "approved" && paymentStatus !== "success") {
        setStatus("O pagamento ainda não foi aprovado.", true);
        return;
      }
      if (collectionStatus && collectionStatus !== "approved" && collectionStatus !== "success") {
        setStatus("O pagamento ainda não foi confirmado.", true);
        return;
      }

      try {
        setStatus("Verificando compra...");

        // Aguarda o webhook processar o pagamento (até 20s)
        const compraData = fallbackRef ? await aguardarAprovacao(fallbackRef) : null;

        if (!compraData) {
          setStatus("Não foi possível confirmar o pagamento. Guarde sua referência: " + (fallbackRef || "—"), true);
          return;
        }

        const tipo    = compraData.tipo    || "license";
        const produto = compraData.produto || "osl_ritual_completo";
        const titulo  = compraData.titulo  || "SEXTOLUGAR";

        if (tipo === "license") {
          const paymentId = await resolvePaymentId(paymentIdFromUrl, fallbackRef);
          if (!paymentId) {
            setStatus("Não foi possível identificar o pagamento.", true);
            return;
          }
          await handleLicenca(paymentId, fallbackRef);
        } else {
          await handleCompra(fallbackRef, produto, tipo, titulo);
        }

      } catch (error) {
        console.error("Erro ao finalizar compra:", error);
        setStatus("Erro ao finalizar sua compra.", true);
      }
    })();
  </script>

<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
