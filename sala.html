<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  deleteDoc,
  collection,
  addDoc,
  onSnapshot,
  query,
  orderBy,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC8sSvA7_1HPYRFGfgdgzstkP_yQHadY-c",
  authDomain: "osextolugar-game.firebaseapp.com",
  projectId: "osextolugar-game",
  storageBucket: "osextolugar-game.firebasestorage.app",
  messagingSenderId: "947922328721",
  appId: "1:947922328721:web:989522c99e16ab449f3330",
  measurementId: "G-D6HG779ZFR"
};

const HEARTBEAT_MS = 15000;
const ACTIVE_WINDOW_MS = 40000;

const roomNameEl = document.getElementById('roomName');
const roomCodeEl = document.getElementById('roomCode');
const roomStatusEl = document.getElementById('roomStatus');
const playerListEl = document.getElementById('playerList');
const playersEmptyEl = document.getElementById('playersEmpty');
const playerCountEl = document.getElementById('playerCount');
const copyCodeBtn = document.getElementById('copyCodeBtn');
const leaveBtn = document.getElementById('leaveBtn');
const startBtn = document.getElementById('startBtn');
const sendBtn = document.getElementById('sendBtn');
const messageInput = document.getElementById('messageInput');
const messagesEl = document.getElementById('messages');
const chatEmptyEl = document.getElementById('chatEmpty');
const sessionLabelEl = document.getElementById('sessionLabel');
const footerStatusEl = document.getElementById('footerStatus');

const params = new URLSearchParams(window.location.search);

const playerName = (params.get('nome') || localStorage.getItem('osl_nome') || 'Visitante').trim().slice(0, 40);
const roomCode = (params.get('sala') || localStorage.getItem('osl_sala') || 'SL-0001')
  .trim()
  .toUpperCase()
  .replace(/[^A-Z0-9-]/g, '')
  .slice(0, 20);
const roomName = (params.get('nomeSala') || localStorage.getItem('osl_nome_sala') || 'Sala de Espera')
  .trim()
  .slice(0, 50);

localStorage.setItem('osl_nome', playerName);
localStorage.setItem('osl_sala', roomCode);
localStorage.setItem('osl_nome_sala', roomName);

const participantId = getParticipantId();
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const roomRef = doc(db, 'salas', roomCode);
const playerRef = doc(db, 'salas', roomCode, 'players', participantId);
const messagesRef = collection(db, 'salas', roomCode, 'messages');

let isHost = false;
let heartbeatTimer = null;
let roomUnsub = null;
let playersUnsub = null;
let messagesUnsub = null;
let leaving = false;

/* =========================
   ÁUDIO DE MENSAGEM
========================= */
let audioCtx = null;
let audioReady = false;
let initialMessagesLoaded = false;
let knownMessageIds = new Set();

function enableAudio(){
  if (audioReady) return;

  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return;

  try{
    audioCtx = new AudioContextClass();
    if (audioCtx.state === 'suspended'){
      audioCtx.resume().catch(() => {});
    }
    audioReady = true;
  }catch(e){}
}

window.addEventListener('pointerdown', enableAudio, { once:true });
window.addEventListener('touchstart', enableAudio, { once:true });
window.addEventListener('keydown', enableAudio, { once:true });

function playIncomingMessageSound(){
  if (!audioReady || !audioCtx) return;

  try{
    const now = audioCtx.currentTime;

    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    osc1.type = 'triangle';
    osc2.type = 'sine';

    osc1.frequency.setValueAtTime(920, now);
    osc1.frequency.exponentialRampToValueAtTime(680, now + 0.08);

    osc2.frequency.setValueAtTime(1320, now);
    osc2.frequency.exponentialRampToValueAtTime(980, now + 0.08);

    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1800, now);
    filter.Q.setValueAtTime(0.8, now);

    gain.gain.setValueAtTime(0.00001, now);
    gain.gain.exponentialRampToValueAtTime(0.045, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.00001, now + 0.14);

    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    osc1.start(now);
    osc2.start(now);

    osc1.stop(now + 0.15);
    osc2.stop(now + 0.15);
  }catch(e){}
}
/* ========================= */

function getParticipantId(){
  let id = sessionStorage.getItem('osl_participant_id');
  if(!id){
    id = 'p_' + Math.random().toString(36).slice(2, 11);
    sessionStorage.setItem('osl_participant_id', id);
  }
  return id;
}

function initials(name){
  const parts = String(name).trim().split(/\s+/).filter(Boolean);
  if(parts.length === 0) return '??';
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

function nowTimeFromDate(date){
  return date.toLocaleTimeString('pt-BR', {
    hour:'2-digit',
    minute:'2-digit'
  });
}

function escapeHtml(str){
  return String(str)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function hideChatEmpty(){
  if(chatEmptyEl) chatEmptyEl.style.display = 'none';
}

function showChatEmpty(text){
  if(!chatEmptyEl) return;
  chatEmptyEl.style.display = 'block';
  chatEmptyEl.innerHTML = text;
}

function renderPlayers(players){
  playerListEl.innerHTML = '';

  players.forEach(function(player){
    const div = document.createElement('div');
    div.className = 'player';
    div.innerHTML = `
      <div class="playerLeft">
        <div class="avatar">${initials(player.name)}</div>
        <div>
          <div class="playerName">${escapeHtml(player.name)}</div>
          <div class="playerRole">${player.isHost ? 'Anfitrião' : 'Participante'}</div>
        </div>
      </div>
      <div class="playerRole">Online</div>
    `;
    playerListEl.appendChild(div);
  });

  playerCountEl.textContent = String(players.length);
  playersEmptyEl.style.display = players.length > 1 ? 'none' : 'block';
}

function renderMessages(docs){
  messagesEl.innerHTML = '';

  if(!docs.length){
    showChatEmpty('A sala foi criada.<br>Quando houver mensagens ou eventos do sistema, eles aparecerão aqui.');
    return;
  }

  hideChatEmpty();

  docs.forEach(function(item){
    const div = document.createElement('div');

    if(item.type === 'system'){
      div.className = 'message system';
      div.innerHTML = `
        <span class="meta">Sistema</span>
        ${escapeHtml(item.text)}
      `;
    }else{
      const own = item.authorId === participantId;
      div.className = 'message ' + (own ? 'me' : 'other');

      let timeLabel = '--:--';
      if(item.createdAt && typeof item.createdAt.toDate === 'function'){
        timeLabel = nowTimeFromDate(item.createdAt.toDate());
      }

      div.innerHTML = `
        <span class="meta">${escapeHtml(item.authorName || 'Jogador')} • ${timeLabel}</span>
        ${escapeHtml(item.text)}
      `;
    }

    messagesEl.appendChild(div);
  });

  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function ensureRoom(){
  const snap = await getDoc(roomRef);

  if(!snap.exists()){
    isHost = true;

    await setDoc(roomRef, {
      code: roomCode,
      name: roomName,
      status: 'waiting',
      hostId: participantId,
      hostName: playerName,
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    });

    await addDoc(messagesRef, {
      type: 'system',
      text: 'A sala foi criada. Aguardando jogadores.',
      createdAt: serverTimestamp()
    });
  } else {
    const data = snap.data();
    isHost = data.hostId === participantId;
  }
}

async function upsertSelf(){
  await setDoc(playerRef, {
    id: participantId,
    name: playerName,
    isHost,
    joinedAt: serverTimestamp(),
    lastSeen: serverTimestamp()
  }, { merge:true });
}

function startHeartbeat(){
  clearInterval(heartbeatTimer);
  heartbeatTimer = setInterval(async function(){
    try{
      await updateDoc(playerRef, {
        lastSeen: serverTimestamp()
      });
    }catch(e){}
  }, HEARTBEAT_MS);
}

function bindRoom(){
  roomUnsub = onSnapshot(roomRef, async function(snap){
    if(!snap.exists()) return;

    const data = snap.data();
    roomNameEl.textContent = data.name || roomName;
    roomCodeEl.textContent = data.code || roomCode;

    const started = data.status === 'started';
    roomStatusEl.textContent = started ? 'Ritual em andamento' : 'Aguardando jogadores';
    sessionLabelEl.textContent = started ? 'Sessão iniciada' : 'Sessão não iniciada';
    footerStatusEl.textContent = started ? 'Ritual iniciado' : 'Aguardando início';

    isHost = data.hostId === participantId;
    startBtn.disabled = !isHost;
    startBtn.textContent = isHost ? (started ? 'Ritual iniciado' : 'Iniciar Ritual') : 'Aguardando anfitrião';

    await setDoc(playerRef, {
      isHost
    }, { merge:true });
  });
}

function bindPlayers(){
  const q = query(collection(db, 'salas', roomCode, 'players'), orderBy('joinedAt', 'asc'));

  playersUnsub = onSnapshot(q, function(snapshot){
    const now = Date.now();

    const players = snapshot.docs
      .map(function(docSnap){
        const data = docSnap.data();
        return {
          id: docSnap.id,
          name: data.name || 'Jogador',
          isHost: !!data.isHost,
          joinedAt: data.joinedAt || null,
          lastSeen: data.lastSeen || null
        };
      })
      .filter(function(player){
        if(!player.lastSeen || typeof player.lastSeen.toMillis !== 'function') return true;
        return (now - player.lastSeen.toMillis()) <= ACTIVE_WINDOW_MS;
      });

    renderPlayers(players);
  });
}

function bindMessages(){
  const q = query(messagesRef, orderBy('createdAt', 'asc'));

  messagesUnsub = onSnapshot(q, function(snapshot){
    const docs = snapshot.docs.map(function(docSnap){
      return { id: docSnap.id, ...docSnap.data() };
    });

    renderMessages(docs);

    const currentIds = new Set(docs.map(item => item.id));

    if(!initialMessagesLoaded){
      knownMessageIds = currentIds;
      initialMessagesLoaded = true;
      return;
    }

    docs.forEach(function(item){
      if (knownMessageIds.has(item.id)) return;

      const isOwnMessage = item.authorId === participantId;
      const shouldPlay =
        (item.type === 'system') ||
        (item.type === 'user' && !isOwnMessage);

      if (shouldPlay){
        playIncomingMessageSound();
      }
    });

    knownMessageIds = currentIds;
  });
}

async function sendMessage(){
  const text = messageInput.value.trim();
  if(!text) return;

  messageInput.value = '';

  await addDoc(messagesRef, {
    type: 'user',
    authorId: participantId,
    authorName: playerName,
    text,
    createdAt: serverTimestamp()
  });

  await updateDoc(roomRef, {
    updatedAt: serverTimestamp()
  });
}

async function startSession(){
  if(!isHost) return;

  const snap = await getDoc(roomRef);
  if(!snap.exists()) return;

  const data = snap.data();
  if(data.status === 'started') return;

  await updateDoc(roomRef, {
    status: 'started',
    startedAt: serverTimestamp(),
    updatedAt: serverTimestamp()
  });

  await addDoc(messagesRef, {
    type: 'system',
    text: 'O anfitrião iniciou o ritual. A próxima etapa pode começar.',
    createdAt: serverTimestamp()
  });
}

async function leaveRoom(){
  if(leaving) return;
  leaving = true;

  try{
    clearInterval(heartbeatTimer);
    if(roomUnsub) roomUnsub();
    if(playersUnsub) playersUnsub();
    if(messagesUnsub) messagesUnsub();

    await deleteDoc(playerRef);
  }catch(e){}

  window.location.href = './entrada.html';
}

copyCodeBtn.addEventListener('click', async function(){
  try{
    await navigator.clipboard.writeText(roomCode);
    await addDoc(messagesRef, {
      type: 'system',
      text: 'O código da sala foi copiado.',
      createdAt: serverTimestamp()
    });
  }catch(e){}
});

sendBtn.addEventListener('click', function(){
  sendMessage().catch(console.error);
});

messageInput.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){
    e.preventDefault();
    sendMessage().catch(console.error);
  }
});

startBtn.addEventListener('click', function(){
  startSession().catch(console.error);
});

leaveBtn.addEventListener('click', function(){
  const ok = confirm('Deseja sair da sala?');
  if(ok){
    leaveRoom();
  }
});

window.addEventListener('pagehide', function(){
  leaveRoom();
});

window.addEventListener('beforeunload', function(){
  leaveRoom();
});

(async function init(){
  try{
    roomNameEl.textContent = roomName;
    roomCodeEl.textContent = roomCode;
    roomStatusEl.textContent = 'Conectando';
    footerStatusEl.textContent = 'Conectando';

    await ensureRoom();
    await upsertSelf();

    startHeartbeat();
    bindRoom();
    bindPlayers();
    bindMessages();
  }catch(error){
    console.error(error);
    showChatEmpty('Não foi possível conectar à sala.<br>Verifique a configuração do Firebase.');
    roomStatusEl.textContent = 'Erro de conexão';
    footerStatusEl.textContent = 'Erro';
  }
})();
</script>
</body>
</html>
